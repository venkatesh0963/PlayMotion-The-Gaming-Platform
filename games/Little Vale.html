<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Little Vale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed isometric canvas; goal + stats pills float at top; a dock at the bottom holds
   the category tray and, above it, the type picker for the selected category.
   One deliberate single-theme look (a sunlit pastel diorama), so every color is set explicitly. */
:root{
  --ink:#3a342d;
  --pill:rgba(50,45,40,.86);
  --pill-fg:#fffdf6;
  --sun:#f9d35b;
  --leaf:#a6d8a0;
  --field:#b9cf8c;
  --paper:#f6f1e3;
  --danger:#e0604c;
  --font:'Fredoka',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--field);color:var(--ink);font-family:var(--font);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#hud{position:absolute;left:0;right:0;top:10px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
#goal{background:var(--pill);color:var(--pill-fg);border-radius:20px;padding:8px 18px 10px;min-width:210px;text-align:center;box-shadow:0 4px 16px rgba(40,40,20,.25)}
#goal .big{font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
#goal .big span{font-weight:500;opacity:.75;font-size:20px}
#goal .sub{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-top:1px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);border-radius:3px;min-width:3px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:auto}
.pill{font:600 14px var(--font);background:var(--pill);color:var(--pill-fg);border:0;border-radius:14px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.y{background:var(--sun);color:var(--ink)}
.pill.bad{background:var(--danger);color:#fff}
button.pill{cursor:pointer}
.pill.net{background:#3a8a56;color:#fff}.pill.net.neg{background:var(--danger)}
#fin{position:fixed;inset:0;z-index:30;background:#f4efe3;color:#2c2a26;display:flex;flex-direction:column;font-family:var(--font);padding-top:env(safe-area-inset-top,0px)}
#fin[hidden]{display:none}
#fin{--card:#fffdf6;--line:#e3dccb;--mut:#6f6a5e;--ok:#2e7d4a;--bad:#c2392f}
.fh{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}.fh h2{margin:0;font:700 18px var(--font);letter-spacing:.04em;flex:1}
.fh button{border:0;background:#2c2a26;color:#fff;border-radius:12px;padding:7px 14px;font:600 14px var(--font);cursor:pointer}
#finTabs{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}#finTabs::-webkit-scrollbar{display:none}
#finTabs button{flex:none;border:1px solid var(--line);background:var(--card);color:#2c2a26;border-radius:999px;padding:7px 14px;font:600 14px var(--font);cursor:pointer}
#finTabs button.on{background:#2c2a26;color:#fff;border-color:#2c2a26}
#finBody{flex:1;overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:760px;width:100%;margin:0 auto;box-sizing:border-box}
#fin .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
#fin h4{margin:0 0 10px;font:700 15px var(--font);display:flex;justify-content:space-between;gap:8px}#fin h4 b{font-weight:600;color:var(--mut)}
#fin .mut{color:var(--mut);font-size:13px;line-height:1.45;margin:8px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;margin:0 0 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.tile small{display:block;color:var(--mut);font-size:12px}.tile b{display:block;font:700 20px var(--font);margin-top:2px;overflow-wrap:anywhere}.tile em{display:block;font-style:normal;color:var(--mut);font-size:11.5px;margin-top:2px}
.tiles.s .tile b{font-size:17px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mid{color:#b07a14}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sum small{display:block;color:var(--mut);font-size:12px}.sum b{font:700 18px var(--font)}
.rb{display:grid;grid-template-columns:minmax(96px,1.1fr) 2fr auto;gap:8px;align-items:center;padding:4px 0;font-size:13.5px}
.rb i{display:block;height:8px;background:#ece5d3;border-radius:4px;overflow:hidden}.rb u{display:block;height:100%;border-radius:4px}.rb b{font-weight:600;text-align:right}.rb em{grid-column:1/-1;font-style:normal;color:var(--mut);font-size:12px;margin-top:-4px}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}.sl:first-of-type{border-top:0}
.sl label{font-size:14px;font-weight:600;min-width:0}.sl label small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:1px}.sl b{text-align:right;font-size:14px}
.sl input[type=range]{width:100%;accent-color:#3a8a56;min-height:28px}
@media(max-width:420px){.sl{grid-template-columns:minmax(0,1fr) 92px 40px}}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}.b{border:0;background:#3a8a56;color:#fff;border-radius:12px;padding:9px 14px;font:600 14px var(--font);cursor:pointer}.b:disabled{opacity:.4;cursor:default}
.tag{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:#ece5d3}.tag.ok{background:#d8efdf}.tag.bad{background:#f6d9d5}
.state{margin:10px 0 4px}.pts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pts span{font-size:12px;background:#f2ecdc;border-radius:8px;padding:3px 8px}
.tbl{font-size:13.5px}.tbl .th,.tbl .tr{display:grid;grid-template-columns:minmax(0,1.6fr) .7fr .7fr 1.2fr;gap:6px;padding:7px 0;border-top:1px solid var(--line);align-items:center}.tbl .th{color:var(--mut);font-size:12px;border-top:0}
.tbl.t2 .th,.tbl.t2 .tr{grid-template-columns:minmax(0,1.4fr) 1fr .8fr .8fr}
.tbl small{display:block;color:var(--mut);font-size:11.5px}
.tg{border:1px solid var(--line);background:#ece5d3;border-radius:10px;padding:5px 10px;font:600 13px var(--font);cursor:pointer;color:#2c2a26}.tg.on{background:#d8efdf;border-color:#a9d6b8}
.dg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.dc{border:1px solid var(--line);background:#f6f1e3;border-radius:10px;padding:8px 4px;font:inherit;cursor:pointer;min-width:0;color:#2c2a26}.dc b{display:block;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dc small{font-size:10.5px;color:var(--mut)}.dc.on{outline:2px solid #2c2a26}.dc.lock{background:#d9d4e4;color:#4a4560}
.ch{width:100%;height:auto;display:block}.ch .gl{stroke:#e8e1d0;stroke-width:1}.ch .zl{stroke:#9a937f;stroke-width:1}.ch .ax{font:10px var(--font);fill:#7a7466}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--mut);margin:-4px 0 6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

button.pill:focus-visible,.tool:focus-visible,.var:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;pointer-events:none;
  padding-top:14px;background:linear-gradient(to top,rgba(246,241,227,.92) 55%,rgba(246,241,227,0))}
#variants,#tools{display:flex;gap:8px;overflow-x:auto;padding:0 12px;touch-action:pan-x;scrollbar-width:none;pointer-events:auto}
#tools{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#variants{gap:6px}
#variants::-webkit-scrollbar,#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;min-width:76px;border:0;border-radius:16px;background:var(--paper);color:var(--ink);font:600 13px var(--font);
  padding:8px 10px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 2px 8px rgba(60,50,20,.2);cursor:pointer}
.tool .sw{width:26px;height:14px;border-radius:7px;border:2px solid rgba(0,0,0,.12)}
.tool small{font-weight:500;opacity:.65;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tool.on{background:var(--sun);box-shadow:0 0 0 3px var(--ink)}
.var{flex:0 0 auto;border:0;border-radius:13px;background:var(--pill);color:var(--pill-fg);font:600 13px var(--font);
  padding:6px 12px 6px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;cursor:pointer;white-space:nowrap}
.var small{font-weight:500;font-size:11px;opacity:.78;font-variant-numeric:tabular-nums}
.var.on{background:var(--sun);color:var(--ink)}
.tool.poor,.var.poor{opacity:.55}
#toast{position:absolute;left:50%;bottom:calc(168px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pill);color:var(--pill-fg);font-weight:600;font-size:15px;
  padding:9px 16px;border-radius:16px;max-width:min(86vw,420px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:420px){#goal .big{font-size:24px}.pill{font-size:13px;padding:5px 10px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

#camctl{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-40%);display:flex;flex-direction:column;gap:6px;z-index:6;pointer-events:auto}
#camctl button.on{background:var(--sun);color:#2c2a26}#camctl button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#camctl button{width:40px;height:40px;border-radius:50%;border:0;background:var(--pill);color:var(--pill-fg);font:600 20px var(--font);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.22);display:grid;place-items:center;padding:0}
#camctl button:disabled{opacity:.35}#camctl button:focus-visible{outline:3px solid var(--sun)}
#menu{position:fixed;inset:0;z-index:40;background:rgba(48,58,44,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;font-family:var(--font)}
#menu[hidden]{display:none}
.mbox{width:min(380px,100%);max-height:100%;overflow:auto;background:#fffdf6;color:#2c2a26;border-radius:22px;padding:24px 20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mbox h1{margin:0;font:700 34px var(--font);text-align:center;letter-spacing:.01em}.mbox .msub{margin:2px 0 18px;text-align:center;color:#6f6a5e;font-size:14px}
.mbox h3{margin:0 0 10px;font:700 18px var(--font)}
.mb{display:block;width:100%;border:1px solid #e3dccb;background:#f4efe3;color:#2c2a26;border-radius:14px;padding:13px 16px;margin:0 0 10px;font:600 16px var(--font);cursor:pointer}
.mb.pri{background:#3a8a56;color:#fff;border-color:#3a8a56}.mb:disabled{opacity:.4;cursor:default}.mb:focus-visible{outline:3px solid var(--sun)}
.mb.sm{width:auto;margin:0;padding:8px 14px;font-size:14px;flex:none}.mb.tg2.on{background:#3a8a56;color:#fff;border-color:#3a8a56}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #e3dccb}.slot>div{min-width:0}.slot b{display:block;font-size:15px}.slot small{display:block;color:#6f6a5e;font-size:12px;overflow-wrap:anywhere}
.mm{color:#6f6a5e;font-size:12.5px;line-height:1.5;margin:10px 0 14px}

#newsbtn{position:relative}.nbadge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#d9453a;color:#fff;font-size:11px;font-weight:700;text-align:center;margin-left:6px;padding:0 5px;vertical-align:middle}.nbadge:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;background:#f6d9d5;color:#7c2a22}.chip.s1{background:#f4ecd2;color:#6d5410}.chip.s2{background:#f8dfc9;color:#7a3f10}
.post.ok,.post.bad,.post.info{color:#2c2a26}
.post{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid #b9b19c;border-radius:14px;padding:11px 12px;margin:0 0 10px}.post.bad{border-left-color:var(--bad)}.post.ok{border-left-color:var(--ok)}.post.info{border-left-color:#c58b1e}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 16px var(--font)}
.post>div:last-child{min-width:0;flex:1}.post b{font-size:14px}.post small{color:var(--mut);font-size:11.5px;margin-left:4px}.post p{margin:3px 0 5px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}.post .tp{font-style:normal;font-size:11px;font-weight:600;color:var(--mut);background:#f0e9d8;border-radius:6px;padding:2px 7px}
#citcard{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));width:min(92vw,340px);background:rgba(252,248,238,.97);color:#2c2a26;border-radius:16px;padding:12px 14px;box-shadow:0 6px 22px rgba(0,0,0,.28);z-index:7;font:13px/1.45 var(--font)}
#citcard b{font-size:15px}#citcard .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:20px;cursor:pointer;color:#6a6458}#citcard .mood{height:7px;border-radius:4px;background:#e4dccb;margin:6px 0 2px;overflow:hidden}#citcard .mood i{display:block;height:100%;background:#6aa84f}
#citcard small{color:#6a6458}.pol{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.pol>div{flex:1;min-width:0}.pol small{display:block;color:var(--mut)}
</style>

<script>
(()=>{
"use strict";
const N=70,OFF=14;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
let W=300,H=500,dpr=1;
const cam={x:0,y:0,z:1.05};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20261115);
function hash(i,j,s){let h=(i*374761393+j*668265263+(s||0)*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const rgb=(c,k)=>{k=k||1;return 'rgb('+Math.min(255,c[0]*k|0)+','+Math.min(255,c[1]*k|0)+','+Math.min(255,c[2]*k|0)+')'};
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const P=(x,y,h)=>[(x-y)*32,(x+y)*16-(h||0)];

/* ---------- world data ---------- */
const idx=(i,j)=>j*N+i, inb=(i,j)=>i>=0&&j>=0&&i<N&&j<N;
// road arrays hold a type (1 single, 2 two-way, 3 highway); rail arrays hold 0/1.
// Layer 0 = surface, 1 = flyover (elevated), 2 = underground.
const road=new Uint8Array(N*N),froad=new Uint8Array(N*N),uroad=new Uint8Array(N*N);
const rail=new Uint8Array(N*N),frail=new Uint8Array(N*N),urail=new Uint8Array(N*N),mtr=new Uint8Array(N*N),fmr=new Uint8Array(N*N),umtr=new Uint8Array(N*N);
const field=new Uint8Array(N*N),water=new Uint8Array(N*N),tree=new Uint8Array(N*N),scorch=new Uint8Array(N*N);
const ROADS=[road,froad,uroad],RAILS=[rail,frail,urail],KIND={road:ROADS,rail:RAILS,metro:[mtr,fmr,umtr]};
const bld=new Array(N*N).fill(null),bocc=new Array(N*N).fill(null);const bAt=k=>bld[k]||bocc[k];
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const has=(kind,L,i,j)=>inb(i,j)&&KIND[kind][L][idx(i,j)]>0;
function cnt(kind,L,i,j){let n=0;for(const d of DIRS)if(has(kind,L,i+d[0],j+d[1]))n++;return n}
// a flyover/tunnel tile is a ramp when it has at most one same-layer neighbour; (ox,oy) points toward the surface tile
function rampOpen(kind,L,i,j,ox,oy){const n=cnt(kind,L,i,j);if(n>1)return false;if(n===0)return true;return has(kind,L,i-ox,j-oy)}
function nbrs(kind,i,j,L){
  const out=[];

function genWorld(){

    const i0=i-OFF,j0=j-OFF,k=idx(i,j),d=Math.hypot(i0-28,j0-28),wn=vnoise(i0*.11+30,j0*.11+30,4);
    let w=(wn<.24&&d>14)||Math.hypot(i0-45,j0-13)<3.2||Math.hypot(i0-9,j0-42)<2.6;
    if(prot(i0,j0))w=false;
    if(Math.abs(j0-riverJ(i0+.5))<riverW(i0+.5))w=true;
    if(j>=N-5+Math.round(vnoise(i0*.25,3,9)*3))w=true;
    const lane=(Math.abs(j0-26)<=1)||(Math.abs(j0-32)<=1&&i0>=21&&i0<=41)||(Math.abs(i0-30)<=1&&j0>=19&&j0<=33)||(Math.abs(i0-24)<=1&&j0>=31&&j0<=41);
    if(lane)w=false;

    if(!w&&!lane&&!prot(i0,j0)){
      const e=clamp((13-Math.min(i0,j0,55-i0))/13,0,1),m=vnoise(i0*.14+70,j0*.14+70,11)*.65+vnoise(i0*.33,j0*.33,12)*.35+e*.42;
      let lv=m>1.0?3:m>.93?2:m>.76?1:0;
      const hn=vnoise(i0*.075+10,j0*.075+40,13);if(lv<1&&d>16&&hn>.64)lv=hn>.78?2:1;
      mount[k]=Math.min(lv,1);
    }
  }
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const k=idx(i,j);if(water[k])continue;
    if(Math.min(i,j,N-1-i,N-1-j)===0||DIRS.some(d=>inb(i+d[0],j+d[1])&&water[idx(i+d[0],j+d[1])]))sand[k]=1}
}
function buildTerrain(){
  const G1=[196,212,142],G3=[150,184,110],TAN=[224,208,164],WAT=[146,196,208];
  const t1=document.createElement('canvas');t1.width=Math.ceil(N*64*TS);t1.height=Math.ceil(N*32*TS)+4;
  const c1=t1.getContext('2d');c1.setTransform(TS,0,0,TS,N*32*TS,0);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const n=vnoise(i*.09,j*.09,1)*.65+vnoise(i*.23,j*.23,2)*.35;
    let c=mix(G1,G3,clamp((n-.28)/.45,0,1));
    const tn=vnoise(i*.07+9,j*.07,3);
    c=mix(c,TAN,smooth(.5,.68,tn)*.9);
    {const k=idx(i,j),lv=mount[k];
      if(lv===1)c=mix(c,[178,202,126],.5);else if(lv===2)c=mix(c,[150,174,104],.7);else if(lv>=3)c=mix([138,134,130],[178,174,168],vnoise(i*.45,j*.45,14));
      if(sand[k]&&lv<3)c=mix(c,SAND,.88);
      if(water[k])c=j>=N-6?mix([108,168,196],WAT,clamp((N-1-j)/6,0,1)*.6):WAT}
    c1.fillStyle=c1.strokeStyle=rgb(c);c1.lineWidth=1.2;
    c1.beginPath();const a=P(i,j),b=P(i+1,j),cc=P(i+1,j+1),d=P(i,j+1);
    c1.moveTo(a[0],a[1]);c1.lineTo(b[0],b[1]);c1.lineTo(cc[0],cc[1]);c1.lineTo(d[0],d[1]);c1.closePath();c1.fill();c1.stroke();
  }
  terr=document.createElement('canvas');terr.width=t1.width;terr.height=t1.height;
  const c2=terr.getContext('2d');
  try{c2.filter='blur(5px)'}catch(e){}
  c2.drawImage(t1,0,0);
}

}

function update(dt){

  if(short&&!shortSeen&&nonHome>3){shortSeen=true;toast('Power or water is running short, so followers arrive slower and fees drop. Build energy and water works.',4200)}
  followers+=(.35+.02*res+rateS)*(short?.5:1)*clamp(.3+E.happy/80,.3,1.3)*dt;
  res=Math.floor(Math.min(followers,cap));waiting=Math.max(0,Math.floor(followers-cap));
  for(const q of smokeSrc)if(Math.random()<dt*2.5)smoke.push({x:q[0],y:q[1],vx:4+Math.random()*5,vy:-14-Math.random()*6,age:0,max:2+Math.random()});
  popCool-=dt;
  lastRes=res;
  fireTimer-=dt;
  if(fireTimer<=0){fireTimer=35+R()*40;const cand=homes.filter(b=>b.burn<=0);
    if(cand.length>=3){const b=cand[(R()*cand.length)|0];b.burn=.05;pop('Fire! Tap it',b.i,b.j,'bad');newsEv('fireStart','bad',['A house is on fire in '+DNAMES[dOf(b.i,b.j)]+'! Someone call the fire brigade!','Smoke and flames over '+DNAMES[dOf(b.i,b.j)]+'. Stay safe, everyone.'],'Fire');if(!fireSeen){fireSeen=true;toast('A home is on fire. Tap the flames with the Look tool, or build a fire station.',4200)}}}
  crimeTimer-=dt;
  if(crimeTimer<=0){crimeTimer=60+R()*50;
    if(homes.length>=4){const h=homes[(R()*homes.length)|0];
      if(pol.some(p=>Math.hypot(p.i-h.i,p.j-h.j)<=p.V.pr)){pop('Police stopped a break-in',h.i,h.j,'ok');newsEv('policeOk','ok',['Police caught a burglar in '+DNAMES[dOf(h.i,h.j)]+'. Thank you, officers!'],'Police')}
      else{const loss=Math.max(0,Math.min(Math.floor(coins),Math.round(4+res*.05)));coins-=loss;pop('Burglary −'+loss,h.i,h.j,'bad');newsEv('crime','bad',['My house in '+DNAMES[dOf(h.i,h.j)]+' was robbed last night. Where are the police?','Burglary in '+DNAMES[dOf(h.i,h.j)]+'. Lock your doors, neighbours.'],'Crime');
        if(!crimeSeen){crimeSeen=true;toast('A burglary. Police stations stop break-ins within their reach.',3600)}}}}
  for(const b of fires){
    b.burn+=dt/38;

    if(Math.random()<dt*14){const q=P(b.i+.5,b.j+.5,b.top*.8);smoke.push({x:q[0],y:q[1],vx:6+Math.random()*6,vy:-18-Math.random()*8,age:0,max:2.4+Math.random()})}
    if(b.burn<=0){b.burn=0;pop('Put out',b.i,b.j,'ok');newsEv('fireOut','ok',['The fire in '+DNAMES[dOf(b.i,b.j)]+' is out. Thank you, firefighters!'],'Fire')}
    else if(b.burn>=1){delB(b);scorch[idx(b.i,b.j)]=1;pop('Burnt down',b.i,b.j,'bad')}
  }
  for(let k=smoke.length-1;k>=0;k--){const s=smoke[k];s.age+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.age>s.max)smoke.splice(k,1)}
  for(let k=pops.length-1;k>=0;k--){pops[k].age+=dt/Math.max(speed,1);if(pops[k].age>3)pops.splice(k,1)}
  let nroad=0;for(let L=0;L<3;L++)for(let q=0;q<N*N;q++)if(ROADS[L][q])nroad++;
  const target=nroad>5?Math.min(46,Math.floor(nroad/6)+Math.floor(res/25)):0;
  for(let k=cars.length-1;k>=0;k--){stepCar(cars[k],dt);if(cars[k].dead)cars.splice(k,1)}
  if(cars.length<target&&Math.random()<dt*2)spawnCar();
  if(cars.length>target+3)cars.pop();
  stepTrain(dt);stepMetro(dt);envStep(dt);citStep(dt);busStep(dt);trfStep(dt);eduStep(dt);routeStep(dt);terrStep();ambStep(dt);rainStep(dt);
}
