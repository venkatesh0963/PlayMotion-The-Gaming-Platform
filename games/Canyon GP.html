<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Canyon GP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Exo+2:ital,wght@1,600;1,800&display=swap" rel="stylesheet">
<style>
/* Layout: one full-bleed portrait canvas (pseudo-3D road) with a slate timing board on top and a speed/gear dash at the bottom. Single committed look, so no light/dark pair. */
:root {
  --ink: #0f2230;
  --panel: #1c3548;
  --panel-edge: #34546a;
  --cream: #f6efdf;
  --muted: #9db2be;
  --flame: #ff6347;
  --flame-deep: #c9452c;
  --mint: #7fd0a8;
  --f-display: 'Exo 2', 'Arial Narrow', system-ui, sans-serif;
  --f-label: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--cream);
  font-family: var(--f-label);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.stage { position: relative; width: 100%; height: 100%; max-width: 560px; margin: 0 auto; overflow: hidden; background: var(--ink); touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hud {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-block: 14px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.board {
  position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px;
  background: rgba(28, 53, 72, 0.94); border: 1px solid var(--panel-edge); border-radius: 3px;
  padding: 10px 14px 12px; box-shadow: 0 6px 18px rgba(8, 18, 28, 0.35);
}
.cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cell.mid { align-items: center; text-align: center; }
.cell.end { align-items: flex-end; text-align: right; }
.lbl { font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.big { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 2.3rem; line-height: 1; display: flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; }
.big i { font-weight: 600; font-size: 0.95rem; color: var(--muted); }
.time { font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 1.45rem; line-height: 1.25; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.prog { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--cream); }

.banner {
  position: absolute; left: 50%; top: 27%; transform: translateX(-50%);
  background: rgba(28, 53, 72, 0.92); border-left: 3px solid var(--mint);
  padding: 7px 20px 8px 18px; font-family: var(--f-display); font-style: italic; font-weight: 600; letter-spacing: 0.16em; font-size: 0.95rem; text-transform: uppercase;
  opacity: 0; transition: opacity 0.2s ease; white-space: nowrap;
}
.banner.show { opacity: 1; }
.banner.contact { border-left-color: var(--flame); }
.big b.up { color: var(--mint); }
.big b.down { color: #ff9a80; }
.vig { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 110px 20px rgba(255, 92, 64, 0.5); }
.go {
  position: absolute; left: 50%; top: 30%; transform: translateX(-50%);
  font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 4.5rem; letter-spacing: 0.04em; color: var(--cream);
  text-shadow: 0 4px 0 rgba(15, 34, 48, 0.55); opacity: 0; transition: opacity 0.3s ease;
}
.go.show { opacity: 1; }

.dash { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.slip { font-size: 0.78rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--mint); display: flex; align-items: center; gap: 12px; opacity: 0; transition: opacity 0.2s ease; height: 1em; }
.slip::before, .slip::after { content: ""; width: 28px; height: 2px; background: var(--mint); }
.slip.show { opacity: 1; }
.revs { display: flex; gap: 6px; width: min(62%, 280px); }
.revs span { flex: 1; height: 5px; background: rgba(246, 239, 223, 0.22); transform: skewX(-24deg); }
.revs span.on { background: var(--cream); }
.revs span.hot.on { background: var(--flame); }
.row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; gap: 12px; }
.gear { justify-self: end; border: 1px solid rgba(246, 239, 223, 0.5); border-radius: 4px; padding: 3px 9px 4px; display: flex; flex-direction: column; align-items: center; line-height: 1; background: rgba(15, 34, 48, 0.35); }
.gear small { font-size: 0.62rem; letter-spacing: 0.2em; color: var(--muted); font-weight: 500; }
.gear b { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 1.7rem; }
.speed { display: flex; align-items: baseline; gap: 6px; min-width: 9.5rem; justify-content: center; }
.speed b { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 3.6rem; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 rgba(15, 34, 48, 0.4); }
.speed small { font-size: 0.78rem; letter-spacing: 0.16em; font-weight: 500; }
.snd {
  justify-self: start; pointer-events: auto; background: rgba(15, 34, 48, 0.55); color: var(--cream); border: 1px solid rgba(246, 239, 223, 0.35);
  border-radius: 4px; padding: 6px 10px; font-family: var(--f-label); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
}
.snd[aria-pressed="false"] { opacity: 0.55; }
.steer { display: flex; align-items: center; gap: 10px; width: min(70%, 300px); justify-content: center; height: 14px; }
.steer span { flex: 1; height: 1px; background: rgba(246, 239, 223, 0.4); }
.steer i { width: 8px; height: 8px; background: var(--cream); transform: rotate(45deg); flex: none; }

.card {
  position: absolute; left: 50%; top: 36%; transform: translateX(-50%);
  width: min(300px, calc(100% - 32px)); box-sizing: border-box;
  background: rgba(24, 45, 64, 0.95); border: 1px solid var(--panel-edge); border-radius: 22px; text-align: center;
  padding: 18px 20px 20px; box-shadow: 0 14px 40px rgba(6, 14, 22, 0.45);
}
.card h2 { margin: 6px 0 4px; font-weight: 600; font-size: 1.9rem; letter-spacing: 0.01em; }
.card p { margin: 0; color: var(--muted); letter-spacing: 0.14em; font-size: 0.92rem; }
.card .tap { margin-top: 14px; font-size: 0.74rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--cream); opacity: 0.8; }
.card svg { display: block; margin: 0 auto; }
.result { top: 30%; width: min(360px, calc(100% - 32px)); border-radius: 4px; padding: 22px 22px 22px; border-top: 4px solid var(--flame); text-align: left; }
.result .head { display: flex; align-items: center; gap: 12px; justify-content: center; font-size: 0.82rem; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 600; }
.result .place { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 6rem; line-height: 1; text-align: center; margin: 8px 0 2px; }
.result .msg { text-align: center; color: var(--cream); font-size: 1.05rem; margin: 0 0 14px; letter-spacing: 0; }
.result .stats { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--panel-edge); padding-top: 14px; margin-bottom: 18px; }
.result .stats div { display: flex; flex-direction: column; gap: 4px; }
.result .stats div:last-child { align-items: flex-end; }
.result .stats b { font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 1.45rem; font-variant-numeric: tabular-nums; }
.result .pb { text-align: center; color: var(--mint); font-size: 0.82rem; letter-spacing: 0.2em; text-transform: uppercase; margin: -6px 0 14px; min-height: 1em; }
.again {
  width: 100%; border: 0; border-bottom: 3px solid var(--flame-deep); background: var(--flame); color: #fff7ee; border-radius: 3px;
  padding: 13px 16px; font-family: var(--f-label); font-weight: 600; font-size: 1.15rem; letter-spacing: 0.04em; cursor: pointer; display: flex; gap: 10px; align-items: center; justify-content: center;
}
.again:active { transform: translateY(1px); border-bottom-width: 2px; }
button:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
@media (max-width: 380px) { .big { font-size: 1.9rem; } .speed b { font-size: 3rem; } .time { font-size: 1.2rem; } }
@media (prefers-reduced-motion: reduce) { .banner, .slip { transition: none; } }
</style>

<div class="stage" id="stage">
  <canvas id="c" aria-label="Canyon circuit, rear view of your car"></canvas>

  <div class="hud">
    <div class="board" role="status" aria-live="off">
      <div class="cell"><span class="lbl">Position</span><span class="big"><b id="pos">8</b><i>/ 8</i></span></div>
      <div class="cell mid"><span class="lbl">Race time</span><span class="time" id="time">0:00.000</span></div>
      <div class="cell end"><span class="lbl">Lap</span><span class="big"><b id="lap">1</b><i>/ 3</i></span></div>
      <div class="prog" id="prog"></div>
    </div>

    <div class="dash">
      <div class="slip" id="slip">Slipstream</div>
      <div class="revs" id="revs"></div>
      <div class="row">
        <div class="gear"><small>GEAR</small><b id="gear">1</b></div>
        <div class="speed"><b id="spd">0</b><small>KM/H</small></div>
      </div>
      <div class="steer" aria-hidden="true"><span></span><i id="dot"></i><span></span></div>
    </div>
  </div>

  <div class="banner" id="banner">GO</div>
  <div class="vig" id="vig"></div>

  <div class="card" id="intro">
    <svg width="96" height="52" viewBox="0 0 96 52" fill="none" stroke="#f6efdf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 26h22M13 19l-7 7 7 7"/>
      <path d="M90 26H68M83 19l7 7-7 7"/>
      <path d="M40 40V16a4 4 0 0 1 8 0v10M48 24a4 4 0 0 1 8 0v4M56 27a4 4 0 0 1 8 0v8c0 7-5 11-12 11h-4c-5 0-8-3-10-7l-2-5a3.5 3.5 0 0 1 6-2l2 3"/>
    </svg>
    <h2>Drag to steer</h2>
    <p>3 LAPS. TAKE THE LEAD.</p>
    <div class="tap">Tap to start</div>
  </div>

  <div class="card result" id="result" hidden>
    <div class="head">
      <svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M3 2v22" stroke="#f6efdf" stroke-width="2.4" stroke-linecap="round"/><g fill="#f6efdf"><rect x="5" y="2" width="4" height="4"/><rect x="13" y="2" width="4" height="4"/><rect x="9" y="6" width="4" height="4"/><rect x="17" y="6" width="4" height="4"/><rect x="5" y="10" width="4" height="4"/><rect x="13" y="10" width="4" height="4"/></g></svg>
      <span>Chequered flag</span>
    </div>
    <div class="place" id="place">P1</div>
    <p class="msg" id="msg">A drive to remember.</p>
    <div class="pb" id="pb"></div>
    <div class="stats">
      <div><span class="lbl">Race time</span><b id="rTime">0:00.000</b></div>
      <div><span class="lbl">Best lap</span><b id="rBest">0:00.000</b></div>
    </div>
    <button class="again" id="again" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 3v5h5"/></svg>
      Race again
    </button>
  </div>
</div>

<script>

  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), cv = $('c'), ctx = cv.getContext('2d', { alpha: false });

  var NEAR = 0.25;
  var bx = new Float64Array(40), by = new Float64Array(40), bz = new Float64Array(40);
  var ox = new Float64Array(40), oy = new Float64Array(40), oz = new Float64Array(40);

    bx[2] = PT[f2] + (PT[f2] - PT[n2]) * ext; by[2] = PT[f2 + 1] + (PT[f2 + 1] - PT[n2 + 1]) * ext; bz[2] = PT[f2 + 2] + (PT[f2 + 2] - PT[n2 + 2]) * ext;
    bx[3] = PT[f1] + (PT[f1] - PT[n1]) * ext; by[3] = PT[f1 + 1] + (PT[f1 + 1] - PT[n1 + 1]) * ext; bz[3] = PT[f1 + 2] + (PT[f1 + 2] - PT[n1 + 2]) * ext;
    var zavg = (bz[0] + bz[1] + bz[2] + bz[3]) / 4;
    if (zavg < -5) return;
    fillPoly(4, fogc(col, zavg));
  }

  function drawGantryExtras(o) {
    // title board text and start lights
    var wx = o.x, wz = o.z, h = o.h, rxv = Math.cos(h), rzv = -Math.sin(h);
    toCam(wx, 9.7, wz); var zc = qz, cxm = qx, cym = qy;
    if (zc < 6) return;
    var pw = 19 * FL / zc, ph = 2.2 * FL / zc, sx = SCX + cxm * FL / zc, sy = SCY - cym * FL / zc;
    if (ph > 7) {
      ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = 'rgb(246,239,223)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'italic 800 ' + Math.round(ph * 0.55) + 'px "Exo 2", sans-serif';
      try { ctx.letterSpacing = Math.round(ph * 0.3) + 'px'; } catch (e) {}
      ctx.fillText('CANYON', sx, sy);
      try { ctx.letterSpacing = '0px'; } catch (e) {}
      ctx.restore();
    }
    var green = goT > 0;
    for (var q = -2; q <= 2; q++) {
      toCam(wx + rxv * q * 2.1, 7.7, wz + rzv * q * 2.1);
      if (qz < 1) continue;
      var rr = 0.55 * FL / qz;
      ctx.fillStyle = green ? 'rgb(150,224,64)' : 'rgb(233,120,60)';
      ctx.beginPath(); ctx.arc(SCX + qx * FL / qz, SCY - qy * FL / qz, rr, 0, PI2); ctx.fill();
    }
  }

  function render() {
    var k, i;
    var yh = SCY - FL * Math.tan(cam.pitch);
    drawSky(yh);

    var camIdx = Math.floor(wrapS(player.s - 11) / DS);
    var iNear = camIdx - 8, nList = 0;
    var rel = 0, relFar = 0;
    while (nList < 150) {
      listRel[nList] = rel;
      var st = rel < 46 ? 1 : rel < 90 ? 2 : 4;
      nList++;
      rel += st;
      if (rel > 190) { listRel[nList] = rel; nList++; break; }
    }
    // camera-space points for each list sample
    for (k = 0; k < nList; k++) {
      var ix = wrapI(iNear + listRel[k]), cx = PX[ix], cz = PZ[ix], rx = RXa[ix], rz = RZa[ix], base = k * 42;
      for (var pp = 0; pp < 14; pp++) {
        toCam(cx + rx * PD[pp], PY[pp], cz + rz * PD[pp]);
        PT[base + pp * 3] = qx; PT[base + pp * 3 + 1] = qy; PT[base + pp * 3 + 2] = qz;
      }
    }
    // map relative index to list segment
    var lastRel = listRel[nList - 1];
    for (k = 0; k < nList - 1; k++) for (i = listRel[k]; i < listRel[k + 1]; i++) segOf[i] = k;
    // bucket cars
    var carBuckets = [];
    for (k = 0; k < cars.length; k++) {
      var cc = cars[k], ci = Math.floor(wrapS(cc.s - 3.6) / DS) % N, crel = (ci - iNear + N) % N;
      if (crel >= lastRel) continue;
      var sidx = segOf[crel];
      (carBuckets[sidx] = carBuckets[sidx] || []).push(cc);
    }

    for (k = nList - 2; k >= 0; k--) {
      var kn = k, kf = k + 1, r0 = listRel[k], r1 = listRel[k + 1], absI = wrapI(iNear + r0);
      var z0 = PT[kn * 42 + 2], z1 = PT[kf * 42 + 2];
      if (z0 < -12 && z1 < -12) continue;
      var par = (absI >> 2) & 1, par2 = (absI >> 1) & 1, wr = WALLRED[absI] && (absI & 7) < 5;
      qk(kn, kf, 3, 4, C_GRASS[par], 0.08); qk(kn, kf, 10, 11, C_GRASS[par], 0.08);
      qk(kn, kf, 1, 2, C_RUN[par], 0.08); qk(kn, kf, 8, 9, C_RUN[par], 0.08);
      qk(kn, kf, 1, 0, C_RUM[par2], 0.08); qk(kn, kf, 7, 8, C_RUM[par2], 0.08);
      qk(kn, kf, 0, 7, C_ASPH[(absI >> 2) & 1], 0.08);
      qk(kn, kf, 2, 5, wr ? C_WALLR : C_WALL, 0.05); qk(kn, kf, 9, 12, wr ? C_WALLR : C_WALL, 0.05);
      qk(kn, kf, 5, 6, C_WALLT, 0.05); qk(kn, kf, 12, 13, C_WALLT, 0.05);
      // decals
      for (var r = r0; r < r1; r++) {
        var ai = wrapI(iNear + r), dl = decals[ai];
        if (dl) for (var di = 0; di < dl.length; di++) {
          var D = dl[di], zsum = 0;
          for (var vv = 0; vv < 4; vv++) { toCam(D.p[vv][0], 0.03, D.p[vv][1]); bx[vv] = qx; by[vv] = qy; bz[vv] = qz; zsum += qz; }
          fillPoly(4, fogc(D.c, zsum / 4));
        }
        // dashed lane lines
        if (((ai >> 1) & 1) === 0 && ai % 4 < 2 && r < 150) {
          var lx = [-2.7, 2.7];
          for (var lq = 0; lq < 2; lq++) {
            var a2 = wrapI(ai + 1);
            var pts = [[PX[ai] + RXa[ai] * (lx[lq] - 0.07), PZ[ai] + RZa[ai] * (lx[lq] - 0.07)], [PX[ai] + RXa[ai] * (lx[lq] + 0.07), PZ[ai] + RZa[ai] * (lx[lq] + 0.07)], [PX[a2] + RXa[a2] * (lx[lq] + 0.07), PZ[a2] + RZa[a2] * (lx[lq] + 0.07)], [PX[a2] + RXa[a2] * (lx[lq] - 0.07), PZ[a2] + RZa[a2] * (lx[lq] - 0.07)]];
            var zs2 = 0;
            for (var vq = 0; vq < 4; vq++) { toCam(pts[vq][0], 0.025, pts[vq][1]); bx[vq] = qx; by[vq] = qy; bz[vq] = qz; zs2 += qz; }
            fillPoly(4, fogc([226, 222, 208], zs2 / 4));
          }
        }
      }
      // objects in this segment
      tmpObj.length = 0;
      for (var r2 = r1 - 1; r2 >= r0; r2--) {
        var bk = buckets[wrapI(iNear + r2)];
        if (bk) for (var bi = 0; bi < bk.length; bi++) {
          var ob = bk[bi]; toCam(ob.x, 0, ob.z);
          var lim = ob.stand ? 60 : 8;
          if (qz < -lim || qz > 430 || Math.abs(qx) > qz * 0.55 + lim + 6) continue;
          tmpObj.push({ z: qz, o: ob, car: null });
        }
      }
      var cb = carBuckets[k];
      if (cb) for (var cj = 0; cj < cb.length; cj++) { toCam(cb[cj].x, 0, cb[cj].z); tmpObj.push({ z: qz, o: null, car: cb[cj] }); }
      if (tmpObj.length > 1) tmpObj.sort(function (a, b) { return b.z - a.z; });
      for (var oi = 0; oi < tmpObj.length; oi++) {
        var to = tmpObj[oi];
        if (to.car) drawCar(to.car, to.z);
        else {
          drawMesh(to.o.m, to.o.x, 0, to.o.z, to.o.yaw, to.o.sc, to.o.sort);
          if (to.o.gantry) drawGantryExtras(to.o);
        }
      }
    }
    // sparks
    if (sparks.length) {
      ctx.strokeStyle = 'rgb(248,205,64)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (k = 0; k < sparks.length; k++) {
        var s2 = sparks[k];
        toCam(s2.x, s2.y, s2.z); var ax = qx, ay = qy, az = qz;
        toCam(s2.x - s2.vx * 0.05, s2.y - s2.vy * 0.05, s2.z - s2.vz * 0.05);
        if (az < 0.5 || qz < 0.5) continue;
        ctx.beginPath(); ctx.moveTo(SCX + ax * FL / az, SCY - ay * FL / az); ctx.lineTo(SCX + qx * FL / qz, SCY - qy * FL / qz); ctx.stroke();
      }
    }
    if (noisePat) { ctx.globalAlpha = 0.07; ctx.fillStyle = noisePat; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  }

  function drawCar(c, zc) {
    var yaw = c.hd + c.yk + (c.isPlayer ? steer * 0.08 : 0);
    // soft shadow
    var ang, n = 10, zs = 0;
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    for (ang = 0; ang < n; ang++) {
      var a = PI2 * ang / n, lx = Math.cos(a) * 1.25, lz = Math.sin(a) * 2.7;
      toCam(c.x + lx * cy + lz * sy, 0.02, c.z - lx * sy + lz * cy);
      bx[ang] = qx; by[ang] = qy; bz[ang] = qz; zs += qz;
    }
    fillPoly(n, 'rgba(10,16,22,' + (0.3 * (1 - fogF(zs / n))).toFixed(2) + ')');
    if (c.lod) { if (zc < 200) c.lod = false; } else if (zc > 240) c.lod = true;
    drawMesh(c.lod ? c.meshes.lo : c.meshes.hi, c.x, 0, c.z, yaw, 1, false, true);
  }

  /* ================= CAMERA ================= */
  function updateCamera(dt) {
    var p = player, tgt = p.hd - p.yk * 0;
    // follow the path heading, not the spin
    var vdn = clamp(p.vd / Math.max(p.v, 12), -0.4, 0.4);
    posAt(p.s, p.d);
    tgt = Math.atan2(PQ.tx + PQ.tz * vdn, PQ.tz - PQ.tx * vdn);
    if (!camInit) { camYaw = tgt; camInit = true; }
    var diff = wrapA(tgt - camYaw);
    camYaw += diff * (1 - Math.exp(-dt * 3.2));
    var dist = 18, sx = Math.sin(camYaw), cz = Math.cos(camYaw);
    var shk = shake * 0.12;
    cam.x = p.x - sx * dist + (Math.random() - 0.5) * shk;
    cam.z = p.z - cz * dist + (Math.random() - 0.5) * shk;
    cam.y = 6.6 + (Math.random() - 0.5) * shk;
    cam.yaw = camYaw; cam.pitch = 0.33;
    setCam();
  }

  /* ================= HUD ================= */
  var el = { pos: $('pos'), time: $('time'), lap: $('lap'), gear: $('gear'), spd: $('spd'), slip: $('slip'), prog: $('prog'), dot: $('dot'), banner: $('banner'), vig: $('vig') };
  var revs = [], rv = $('revs'), q0;
  for (q0 = 0; q0 < 12; q0++) { var s2 = document.createElement('span'); if (q0 >= 9) s2.className = 'hot'; rv.appendChild(s2); revs.push(s2); }
  var cache = {};
  function setText(key, node, v) { if (cache[key] !== v) { cache[key] = v; node.textContent = v; } }
  var GEARS = [0, 50, 92, 135, 172, 212, 250, 281];
  function hud() {
    var kmh = Math.min(player.v, VTOP * 1.05) * 3.6, q;
    setText('pos', el.pos, String(state === 'finished' ? rank : rank));
    var cls = posFlash > 0 ? (posDir > 0 ? 'up' : 'down') : '';
    if (cache.pcls !== cls) { cache.pcls = cls; el.pos.className = cls; }
    setText('time', el.time, fmt(state === 'finished' ? finishTime : raceTime));
    setText('lap', el.lap, String(lap));
    var gear = 1; for (q = 1; q < GEARS.length; q++) if (kmh >= GEARS[q]) gear = q + 1;
    setText('gear', el.gear, String(gear));
    setText('spd', el.spd, String(Math.round(kmh)));
    var lo = GEARS[gear - 1], hi = gear < 8 ? GEARS[gear] : 305, frac = clamp((kmh - lo) / (hi - lo), 0, 1);
    var lit = kmh < 1 ? 0 : Math.round((0.12 + 0.88 * frac) * 12);
    for (q = 0; q < 12; q++) { var on = q < lit; if (revs[q]._on !== on) { revs[q]._on = on; revs[q].classList.toggle('on', on); } }
    var showSlip = slip > 0.5 && state === 'racing';
    if (cache.slip !== showSlip) { cache.slip = showSlip; el.slip.classList.toggle('show', showSlip); }
    var isC = contactT > 0 && state === 'racing';
    var showB = isC || bannerT > 0;
    setText('bantxt', el.banner, isC ? 'Contact' : bannerTxt);
    if (cache.banc !== isC) { cache.banc = isC; el.banner.classList.toggle('contact', isC); }
    if (cache.ban !== showB) { cache.ban = showB; el.banner.classList.toggle('show', showB); }
    el.vig.style.opacity = contactT > 0 ? Math.min(1, contactT * 1.2).toFixed(2) : '0';
    el.prog.style.width = (state === 'finished' ? 100 : (wrapS(player.s) / L) * 100 * (lap === 1 && player.s < 12 ? 0 : 1)).toFixed(1) + '%';
    el.dot.style.transform = 'translateX(' + (steer * 36).toFixed(1) + 'px) rotate(45deg)';
    audioUpdate(clamp(kmh / 300, 0, 1), clamp(kmh / 300, 0, 1));
  }

  /* ================= LOOP ================= */
  function resize() {
    var r = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    FL = (H / 2) / Math.tan(30 * Math.PI / 180); SCX = W / 2; SCY = H / 2;
    if (FL * 2 * Math.tan(Math.atan(W / 2 / FL)) < 1) FL = W;
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  var last = performance.now(), acc = 0, STEP = 1 / 60;
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
    var nsub = Math.max(1, Math.ceil(dt / STEP - 0.001));
    for (var sub = 0; sub < nsub; sub++) update(dt / nsub);
    updateCamera(dt);
    render(); hud();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function () { last = performance.now(); acc = 0; });

  resize();
  newRace(false);
  update(0.0001);
  requestAnimationFrame(frame);
  window.__rgp = { cars: function () { return cars; }, state: function () { return state; } };
})();

</script>

</body></html>
