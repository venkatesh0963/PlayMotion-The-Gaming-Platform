<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pick Me Up Idle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: full-screen isometric-style city canvas. Top: level / diamonds / cash. Bottom: shortcut dock + Income / Speed / Cars.
   One deliberate look (daylight city, chunky arcade UI), so every colour is set explicitly. */
:root{
  --ground:#cfd2c4; --lot:#dedacb; --park:#8fc668; --water:#59a5ea; --kerb:#e4dfd0; --road:#4a5573; --lane:#e8c64a;
  --ink:#16161d; --panel:#25252d; --panel-2:#34343f; --paper:#f4f3fb; --muted:#b9b9c6;
  --yellow:#ffe01b; --yellow-edge:#f0a500; --green:#43b648; --blue:#2f8cf0; --red:#d9473d; --gold:#ffcf3a;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ground);color:var(--paper);font-family:var(--body);font-weight:800;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stage{position:relative;height:100%;width:100%;overflow:hidden;background:var(--ground)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.recenter{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 124px);width:42px;height:42px;border-radius:50%;border:2px solid #111;background:var(--panel);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 #0007;padding:0}
.recenter svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.chip.rain{background:#2f6fd0;border-color:#bcd8ff}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:absolute;top:0;left:0;right:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;padding-block:12px 0}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.lvl{display:flex;align-items:center;gap:8px;min-width:0}
.badge{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#5b3d00;background:radial-gradient(circle at 35% 30%,#fff3a8,var(--gold));border:3px solid #fff;box-shadow:0 2px 6px #0005;font-weight:400}
.lvltxt{display:flex;flex-direction:column;gap:3px;min-width:0;color:#fff;font-family:var(--display);font-weight:400;font-size:13px;text-shadow:0 1px 3px #000a}
.xp{width:64px;height:9px;border-radius:5px;background:#0006;overflow:hidden;border:1px solid #fff6}
.xp i{display:block;height:100%;width:0;background:linear-gradient(#8cf08f,var(--green))}
.pill{display:flex;align-items:center;gap:4px;height:36px;min-width:84px;padding:0 12px 0 4px;border-radius:18px;background:#14141bcc;border:2px solid #ffffff55;color:#fff;font-family:var(--display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums;justify-content:space-between}
.pill svg{width:30px;height:30px;flex:none;margin-left:-2px}
.pill span{flex:1;text-align:center;min-width:0}
.pill.cash{justify-self:end}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{padding:3px 11px;border-radius:12px;background:#14141bcc;color:#fff;font-family:var(--display);font-weight:400;font-size:13px;border:1px solid #fff4}
.chip.hot{background:#e8780f;border-color:#ffd9a8}
.chip.gold{background:#ffcf1f;color:#6b4a00;border-color:#fff3}

.toast{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 150px);text-align:center;pointer-events:none;font-family:var(--display);font-weight:400;font-size:clamp(24px,7.5vw,40px);line-height:1;color:#fff;-webkit-text-stroke:8px #111;paint-order:stroke fill;opacity:0;padding:0 12px}
.toast.show{animation:pop 2.6s ease-out}
.toast small{display:block;font-size:.5em;margin-top:6px;-webkit-text-stroke-width:5px}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}

.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;padding-bottom:16px;pointer-events:none}
.bottom>*{pointer-events:auto}
.hint{align-self:center;pointer-events:none;padding:5px 14px;border-radius:14px;background:#14141bdd;color:#fff;font-family:var(--display);font-weight:400;font-size:14px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.dock{display:flex;justify-content:space-between;gap:6px}
.ib{position:relative;flex:1;max-width:56px;aspect-ratio:1;border:2px solid #111;border-radius:14px;background:var(--panel);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 #0007;padding:0}
.ib svg{width:60%;height:60%;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #0007}
.dot{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--red);border:2px solid #fff;box-sizing:border-box}
.bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.up{background:var(--panel);border-radius:12px;padding:6px 6px 7px;border:2px solid #111;box-shadow:0 3px 0 #0006;display:flex;flex-direction:column;gap:5px;min-width:0}
.up .tp{display:flex;align-items:center;gap:6px;min-height:42px;color:#e8e8ee}
.up .tp svg{width:34px;height:34px;flex:none}
.up .txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.up .txt b{font-family:var(--display);font-weight:400;font-size:16px;color:#d4d4dc}
.up .txt span{font-size:14px;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{border:0;cursor:pointer;width:100%;border-radius:8px;padding:3px 4px 4px;background:linear-gradient(#ffe84a,var(--yellow));border-bottom:4px solid var(--yellow-edge);color:#a97b00;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.15;display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums}
.btn small{font-family:var(--display);font-size:15px;opacity:.9}
.cost{display:flex;align-items:center;gap:3px;color:#8f6600}
.cost svg{width:22px;height:22px}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{filter:saturate(.25) brightness(.8);cursor:default}
.btn.can{animation:ready 1.4s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 3px #fff8,0 0 14px #ffe01b}}
.ib:focus-visible,.btn:focus-visible,.sbtn:focus-visible,.x:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.overlay{position:absolute;inset:0;background:#000a;display:grid;place-items:center;padding:12px;z-index:5}
.sheet{width:min(440px,100%);max-height:100%;background:var(--panel);border:2px solid #111;border-radius:18px;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.shead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.shead h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
.x{border:0;background:var(--panel-2);color:#fff;width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.sbody{padding:4px 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.note{font-size:13px;line-height:1.4;color:var(--muted)}
.h3{font-family:var(--display);font-weight:400;font-size:16px;color:#e7e7ee;margin-top:4px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:12px;padding:10px;min-width:0}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row b{font-family:var(--display);font-weight:400;font-size:16px}
.row small{font-size:12px;color:var(--muted);font-weight:700}
.sw{width:34px;height:34px;flex:none}
.sbtn{border:0;border-radius:9px;padding:8px 12px;font-family:var(--display);font-weight:400;font-size:15px;cursor:pointer;background:var(--yellow);color:#6b4a00;border-bottom:3px solid var(--yellow-edge);white-space:nowrap;font-variant-numeric:tabular-nums}
.sbtn.blue{background:var(--blue);color:#fff;border-bottom-color:#1b5fb0}
.sbtn.red{background:var(--red);color:#fff;border-bottom-color:#8f2820}
.sbtn.ghost{background:#44444f;color:#ddd;border-bottom-color:#22222a}
.sbtn:disabled{filter:saturate(.2) brightness(.75);cursor:default}
.tag{font-family:var(--display);font-weight:400;font-size:13px;padding:3px 9px;border-radius:9px;background:#14141b;color:#9fe3a2}
.prog{height:8px;border-radius:4px;background:#14141b;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(#8cf08f,var(--green))}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.day{background:var(--panel-2);border-radius:10px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;border:2px solid transparent;font-size:12px}
.day b{font-family:var(--display);font-weight:400;font-size:13px;color:var(--muted)}
.day span{font-family:var(--display);font-weight:400;font-size:15px;color:#fff}
.day.now{border-color:var(--gold)}.day.done{opacity:.45}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;background:var(--panel-2);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.stats span:nth-child(even){text-align:right;color:#fff}
@media (prefers-reduced-motion:reduce){.btn.can,.hint{animation:none}.toast.show{animation-duration:.01s}}
@media (max-width:380px){.up .tp svg{width:28px;height:28px}.up .txt b{font-size:14px}.pill{min-width:68px;font-size:16px}.xp{width:44px}}
</style>

<div class="stage" id="stage">
  <canvas id="cv" aria-label="City map with taxis and passengers"></canvas>

  <div class="top gut" id="topEl">
    <header class="hud">
      <div class="lvl"><div class="badge" id="lvlNum">1</div><div class="lvltxt">Level<div class="xp"><i id="xpFill"></i></div></div></div>
      <div class="pill" title="Diamonds"><svg viewBox="0 0 32 32"><path d="M8 6h16l5 7-13 14L3 13z" fill="#2f8cf0"/><path d="M8 6h16l5 7H3z" fill="#6fc0ff"/><path d="M16 27 11 13h10z" fill="#1d6fd0"/></svg><span id="gems">0</span></div>
      <div class="pill cash" title="Cash"><svg viewBox="0 0 32 32"><g transform="rotate(-20 16 16)"><rect x="3" y="8" width="26" height="16" rx="2" fill="#4cc151" stroke="#2c8a31" stroke-width="2"/><circle cx="16" cy="16" r="5" fill="#a6ecaa" stroke="#2c8a31" stroke-width="1.5"/><text x="16" y="19.6" font-size="9" text-anchor="middle" font-family="sans-serif" font-weight="800" fill="#2c8a31">$</text></g></svg><span id="cash">0</span></div>
    </header>
    <div class="chips" id="chips"></div>
  </div>

  <div class="toast" id="toast"></div>
  <button class="recenter" id="recenter" hidden aria-label="Recenter map"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>

  <div class="bottom gut" id="bottomEl">
    <div class="hint" id="hint" hidden>Tap a passenger to send a taxi</div>
    <nav class="dock" aria-label="Shortcuts">
      <button class="ib" data-tab="garage" aria-label="Garage"><svg viewBox="0 0 24 24"><path d="M3 16v-4l2-5h14l2 5v4M3 16h18M3 16v3h3v-3M18 16v3h3v-3M5 12h14"/></svg><em class="dot" hidden></em></button>
      <button class="ib" data-tab="missions" aria-label="Missions"><svg viewBox="0 0 24 24"><path d="M5 3v18M5 4h12l-2 4 2 4H5"/></svg><em class="dot" hidden></em></button>
      <button class="ib" data-tab="ach" aria-label="Achievements"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3M12 13v4M8 20h8M9 17h6"/></svg><em class="dot" hidden></em></button>
      <button class="ib" data-tab="city" aria-label="City"><svg viewBox="0 0 24 24"><path d="M3 21V9l6-3v15M9 21V4l8 3v14M17 21v-8l4 1v7M2 21h20"/></svg><em class="dot" hidden></em></button>
      <button class="ib" data-tab="daily" aria-label="Daily reward"><svg viewBox="0 0 24 24"><path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7c-3 0-5-1-4-3 1.5-2 4 0 4 3zM12 7c3 0 5-1 4-3-1.5-2-4 0-4 3z"/></svg><em class="dot" hidden></em></button>
      <button class="ib" data-tab="finance" aria-label="Finance"><svg viewBox="0 0 24 24"><path d="M5 20v-8M11 20V5M17 20v-5M3 20h18"/></svg><em class="dot" hidden></em></button>
      <button class="ib" data-tab="menu" aria-label="Business menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><em class="dot" hidden></em></button>
    </nav>
    <nav class="bar" aria-label="Upgrades">
      <div class="up">
        <div class="tp">
          <svg viewBox="0 0 34 34"><text x="1" y="25" font-size="22" font-family="sans-serif" font-weight="800" fill="#4cc151">$</text><g transform="rotate(35 22 15)"><path d="M12 7h18v6a3 3 0 0 0 0 6v6H12v-6a3 3 0 0 0 0-6z" fill="#ffd21f" stroke="#c88a00" stroke-width="1.5"/></g></svg>
          <div class="txt"><b>Income</b><span id="incVal">$10/mi</span></div>
        </div>
        <button class="btn" id="bInc"><small id="incLv">lv0</small><span class="cost"><svg viewBox="0 0 22 22"><rect x="2" y="5" width="18" height="12" rx="1.5" fill="#4cc151" stroke="#2c8a31" stroke-width="1.5"/><circle cx="11" cy="11" r="3.2" fill="#a6ecaa"/></svg><span id="incCost">50</span></span></button>
      </div>
      <div class="up">
        <div class="tp">
          <svg viewBox="0 0 34 34"><path d="M4 26A14 14 0 0 1 30 14" fill="none" stroke="#ffd21f" stroke-width="7" stroke-linecap="round"/><circle cx="19" cy="23" r="3.4" fill="#fff"/><path d="M19 23 12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
          <div class="txt"><b>Speed</b><span id="spdVal">1x</span></div>
        </div>
        <button class="btn" id="bSpd"><small id="spdLv">lv0</small><span class="cost"><svg viewBox="0 0 22 22"><rect x="2" y="5" width="18" height="12" rx="1.5" fill="#4cc151" stroke="#2c8a31" stroke-width="1.5"/><circle cx="11" cy="11" r="3.2" fill="#a6ecaa"/></svg><span id="spdCost">50</span></span></button>
      </div>
      <div class="up">
        <div class="tp">
          <svg viewBox="0 0 34 34"><g transform="rotate(-30 17 17)"><rect x="3" y="9" width="28" height="16" rx="8" fill="#ffd21f" stroke="#222" stroke-width="2.5"/><rect x="11" y="12" width="9" height="10" rx="3" fill="#222"/></g></svg>
          <div class="txt"><b>Cars</b><span id="carVal">1</span></div>
        </div>
        <button class="btn" id="bCar"><small id="carLv">lv0</small><span class="cost"><svg viewBox="0 0 22 22"><rect x="2" y="5" width="18" height="12" rx="1.5" fill="#4cc151" stroke="#2c8a31" stroke-width="1.5"/><circle cx="11" cy="11" r="3.2" fill="#a6ecaa"/></svg><span id="carCost">50</span></span></button>
      </div>
    </nav>
  </div>

  <div class="overlay" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
      <div class="shead"><h2 id="sTitle"></h2><button class="x" id="sClose" aria-label="Close">&times;</button></div>
      <div class="sbody" id="sBody"></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const KEY='pickmeup-idle-v2';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- formatting ---------- */
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp'];
function fmt(n){
  n=Math.floor(n);
  if(n<1000)return String(n);
  let i=0,v=n;
  while(v>=1000&&i<SUF.length-1){v/=1000;i++}
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):v.toFixed(0))+SUF[i];
}

/* ---------- game data ---------- */
const MODELS=[
  {n:'Hatchback',c:'#f1f2f7',inc:1,spd:1,len:22,cost:0},
  {n:'Yellow Cab',c:'#ffd21f',inc:1.35,spd:1.1,len:24,cost:3000,sign:1},
  {n:'Sport Coupe',c:'#e5483f',inc:1.8,spd:1.35,len:23,cost:40000},
  {n:'Limousine',c:'#2b2b36',inc:3,spd:1.2,len:34,cost:600000},
  {n:'Gold Rush',c:'#f5b400',inc:5,spd:1.5,len:26,gems:30}
];
const AREAS=[
  {n:'Downtown',i0:2,i1:4,j0:3,j1:6,cost:0,cap:3},
  {n:'Midtown',i0:1,i1:5,j0:2,j1:7,cost:6000,cap:6},
  {n:'Harbor',i0:1,i1:5,j0:1,j1:8,cost:150000,cap:9},
  {n:'Uptown',i0:0,i1:6,j0:0,j1:9,cost:4000000,cap:12}
];
const MILE=100;

/* ---------- state ---------- */
const EXPK=['wages','cuts','fuel','tax','maint','repair','accident','insur','plan','fines','cancel'];
const EXPN={wages:'Driver wages',cuts:'Driver cuts (10% of fares)',fuel:'Fuel',tax:'City tax',maint:'Maintenance',repair:'Breakdown repairs',accident:'Accident fees',insur:'Insurance premiums',plan:'Service plan',fines:'Traffic fines',cancel:'Cancellation penalties'};
const FIN=()=>({rev:0,wages:0,cuts:0,fuel:0,tax:0,maint:0,repair:0,accident:0,insur:0,plan:0,fines:0,cancel:0});
const newCar=(m,d)=>({m,d,cond:100,rev:0,exp:0});
const DEF=()=>({cash:50,gems:0,total:0,run:0,inc:0,spd:0,area:0,stars:0,rides:0,miles:0,vips:0,tips:0,lifeRev:0,
  plan:{ins:0,svc:0},fin:FIN(),
  fleet:[newCar(0,0)],models:[1,0,0,0,0],missions:[],ach:{},streak:0,lastDaily:'',boostUntil:0,away:Date.now(),level:1});
let S=DEF();
try{
  const o=JSON.parse(localStorage.getItem(KEY)||'null');
  if(o)for(const k in S)if(o[k]!==undefined&&typeof o[k]===typeof S[k])S[k]=o[k];
}catch(e){}
if(!Array.isArray(S.fleet)||!S.fleet.length)S.fleet=[newCar(0,0)];
if(!Array.isArray(S.models)||S.models.length!==MODELS.length)S.models=[1,0,0,0,0];
S.models[0]=1;
S.fin=Object.assign(FIN(),S.fin);S.plan=Object.assign({ins:0,svc:0},S.plan);
S.fleet.forEach(f=>{if(typeof f.cond!=='number')f.cond=100;f.rev=f.rev||0;f.exp=f.exp||0;f.d=f.d?1:0});
function save(){S.away=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const incomePerMi=()=>Math.round(10*Math.pow(1.18,S.inc));
const speedMult=()=>1+0.35*S.spd;
const rebirthMult=()=>1+0.25*S.stars;
const drivers=()=>S.fleet.filter(f=>f.d).length;
const costInc=()=>Math.round(50*Math.pow(1.45,S.inc));
const costSpd=()=>Math.round(50*Math.pow(1.45,S.spd));
const costCar=()=>Math.round(50*Math.pow(2.3,S.fleet.length-1));
const costDrv=()=>Math.round(120*Math.pow(2.1,drivers()));
const boosted=()=>Date.now()<S.boostUntil;
const boostMult=()=>boosted()?2:1;
/* running costs */
const opUnit=()=>incomePerMi()*Math.sqrt(speedMult());
const fuelIdx=()=>1+.3*Math.sin(Date.now()/150000)+.1*Math.sin(Date.now()/37000);
const cong=(x,y)=>clamp(1-Math.hypot(x-W/2,y-H*.52)/340,0,1);
const repairFee=()=>Math.round(incomePerMi()*30);
const flow=[];
function net60(){const t=Date.now()-60000;while(flow.length&&flow[0][0]<t)flow.shift();return flow.reduce((s,e)=>s+e[1],0)}
function spend(cat,amt,f){
  if(!(amt>0))return 0;
  S.cash-=Math.min(S.cash,amt);
  S.fin[cat]=(S.fin[cat]||0)+amt;
  if(f)f.exp=(f.exp||0)+amt;
  flow.push([Date.now(),-amt]);
  return amt;
}
function rateEst(){

const W=700,H=1100,COLS=7,ROWS=10;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7),nodes=[],adj=[],edges=[];
for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){
  nodes.push({i,j,x:-70+i*(W+140)/(COLS-1)+(R()-.5)*40,y:-70+j*(H+140)/(ROWS-1)+(R()-.5)*40,unl:false});
  adj.push([]);
}
const nid=(i,j)=>j*COLS+i;
function link(a,b,w){
  const d=Math.hypot(nodes[a].x-nodes[b].x,nodes[a].y-nodes[b].y);
  adj[a].push({to:b,d});adj[b].push({to:a,d});edges.push({a,b,w});
}
for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){
  if(i<COLS-1)link(nid(i,j),nid(i+1,j),j%3===0?18:11);
  if(j<ROWS-1)link(nid(i,j),nid(i,j+1),i%3===0?18:11);
  if(i<COLS-1&&j>0&&(i+j)%3===0)link(nid(i,j),nid(i+1,j-1),14);
}
let UL=[];
function applyArea(){
  const A=AREAS[S.area];
  nodes.forEach(n=>{n.unl=n.i>=A.i0&&n.i<=A.i1&&n.j>=A.j0&&n.j<=A.j1});
  UL=nodes.map((n,k)=>k).filter(k=>nodes[k].unl);
}
function route(a,b){
  const n=nodes.length,dist=new Array(n).fill(Infinity),prev=new Array(n).fill(-1),done=new Array(n).fill(false);
  dist[a]=0;
  for(let c=0;c<n;c++){
    let u=-1,best=Infinity;
    for(let k=0;k<n;k++)if(!done[k]&&dist[k]<best){best=dist[k];u=k}
    if(u<0||u===b)break;
    done[u]=true;
    for(const e of adj[u]){if(!nodes[e.to].unl)continue;if(dist[u]+e.d<dist[e.to]){dist[e.to]=dist[u]+e.d;prev[e.to]=u}}
  }
  const p=[];let cur=b;
  while(cur!==-1){p.unshift(cur);cur=prev[cur]}
  return p;
}
const ndist=(a,b)=>Math.hypot(nodes[a].x-nodes[b].x,nodes[a].y-nodes[b].y);
function pickFrom(from,min,max,pool){
  pool=pool||UL;let fallback=-1;
  for(let t=0;t<40;t++){
    const p=pool[Math.floor(Math.random()*pool.length)];
    if(p===from)continue;
    const d=ndist(from,p);
    if(d>=min&&d<=max)return p;
    if(fallback<0)fallback=p;
  }
  return fallback;
}

const PAL=[['#c98260','#8c5238'],['#7ea8dc','#4d6e9c'],['#e9dcbc','#b4a47e'],['#9ab5aa','#64816f'],['#d9a2a2','#a06565'],['#d2d8df','#98a1ab'],['#e0b46c','#a97c3a']];
function buildTex(){
  const TF=2;tex.width=W*TF;tex.height=H*TF;
  const g=tex.getContext('2d');g.scale(TF,TF);
  const C=getComputedStyle(document.documentElement);const v=n=>C.getPropertyValue(n).trim();
  g.fillStyle=v('--ground');g.fillRect(0,0,W,H);
  const pr=rng(21),bld=[],trees=[];
  const poly=(q,k,fill)=>{
    const cx=(q[0].x+q[1].x+q[2].x+q[3].x)/4,cy=(q[0].y+q[1].y+q[2].y+q[3].y)/4;
    g.beginPath();q.forEach((p,n)=>{const x=cx+(p.x-cx)*k,y=cy+(p.y-cy)*k;n?g.lineTo(x,y):g.moveTo(x,y)});
    g.closePath();g.fillStyle=fill;g.fill();
  };
  for(let j=0;j<ROWS-1;j++)for(let i=0;i<COLS-1;i++){
    const q=[nodes[nid(i,j)],nodes[nid(i+1,j)],nodes[nid(i+1,j+1)],nodes[nid(i,j+1)]];
    const pt=(u,w)=>({x:(1-w)*((1-u)*q[0].x+u*q[1].x)+w*((1-u)*q[3].x+u*q[2].x),y:(1-w)*((1-u)*q[0].y+u*q[1].y)+w*((1-u)*q[3].y+u*q[2].y)});
    const park=(i===2&&j===4)||(i===3&&j===1)||(i===4&&j===7)||pr()<.12;
    if(park){
      poly(q,.9,v('--park'));
      for(let t=0;t<7;t++){const p=pt(.18+pr()*.64,.18+pr()*.64);trees.push({x:p.x,y:p.y,r:8+pr()*6})}
    }else{
      poly(q,.9,v('--lot'));
      [[.27,.3],[.73,.3],[.27,.72],[.73,.72]].forEach(a=>{
        if(pr()<.78){
          const p=pt(a[0]+(pr()-.5)*.08,a[1]+(pr()-.5)*.08),w=22+pr()*16,d=20+pr()*14,h=12+pr()*38;
          bld.push({x:p.x-w/2,y:p.y-d/2,w,d,h,c:PAL[Math.floor(pr()*PAL.length)]});
        }
      });
      if(pr()<.5){const p=pt(.5,.5);trees.push({x:p.x,y:p.y,r:6+pr()*3})}
    }
  }
  // water
  g.beginPath();g.moveTo(-80,H*.8);g.quadraticCurveTo(70,H*.84,110,H*.95);g.lineTo(150,H+80);g.lineTo(-80,H+80);g.closePath();
  g.fillStyle=v('--water');g.fill();
  // roads
  g.lineCap='round';g.lineJoin='round';
  const seg=(e)=>{g.beginPath();g.moveTo(nodes[e.a].x,nodes[e.a].y);g.lineTo(nodes[e.b].x,nodes[e.b].y);g.stroke()};
  g.strokeStyle=v('--kerb');edges.forEach(e=>{g.lineWidth=e.w+6;seg(e)});
  g.strokeStyle=v('--road');edges.forEach(e=>{g.lineWidth=e.w;seg(e)});
  g.strokeStyle=v('--lane');g.lineWidth=1.4;g.setLineDash([7,6]);edges.forEach(e=>{if(e.w>=14)seg(e)});g.setLineDash([]);
  // crossings
  g.strokeStyle='#ffffffaa';g.lineWidth=2;
  // buildings
  const wins=[],wr=rng(99);
  bld.sort((a,b)=>(a.y+a.d)-(b.y+b.d));
  bld.forEach(b=>{
    g.fillStyle='#0002';g.fillRect(b.x+4,b.y+b.d-2,b.w,6);
    g.fillStyle=b.c[1];g.fillRect(b.x,b.y+b.d-b.h,b.w,b.h);
    if(b.h>20){g.fillStyle='#ffffff55';for(let wy=b.y+b.d-b.h+5;wy<b.y+b.d-4;wy+=8)for(let wx=b.x+4;wx<b.x+b.w-5;wx+=8){g.fillRect(wx,wy,3.5,3.5);if(wr()<.55)wins.push([wx,wy])}}
    g.fillStyle=b.c[0];g.fillRect(b.x,b.y-b.h,b.w,b.d);
    g.fillStyle='#0000001c';g.fillRect(b.x,b.y-b.h+b.d-2,b.w,2);
  });
  trees.sort((a,b)=>a.y-b.y).forEach(t=>{
    g.fillStyle='#0003';g.beginPath();g.ellipse(t.x+3,t.y+t.r*.5,t.r,t.r*.55,0,0,7);g.fill();
    g.fillStyle='#8fc83a';g.beginPath();g.arc(t.x,t.y-t.r*.6,t.r,0,7);g.fill();
    g.fillStyle='#c5ee5a';g.beginPath();g.arc(t.x-t.r*.25,t.y-t.r*.85,t.r*.6,0,7);g.fill();
  });
  // night lights: street lamps and lit windows
  tex2.width=W*TF;tex2.height=H*TF;
  const l=tex2.getContext('2d');l.scale(TF,TF);
  edges.forEach(e=>{
    const a=nodes[e.a],b=nodes[e.b],len=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.round(len/70));
    for(let k=0;k<n;k++){
      const t=(k+.5)/n,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;
      const gr=l.createRadialGradient(x,y,0,x,y,22);
      gr.addColorStop(0,'rgba(255,214,120,.55)');gr.addColorStop(1,'rgba(255,214,120,0)');
      l.fillStyle=gr;l.fillRect(x-22,y-22,44,44);
    }
  });
  l.fillStyle='#ffd77a';wins.forEach(w=>l.fillRect(w[0],w[1],3.5,3.5));
}

  cars.push({f,x:nodes[n].x,y:nodes[n].y,node:n,ang:0,tang:0,route:[],phase:'idle',pax:null,ride:0,wait:0,pulse:0});
}
function syncCars(){
  while(cars.length<S.fleet.length)addCar(S.fleet[cars.length]);
  cars.length=S.fleet.length;
  cars.forEach((c,i)=>c.f=S.fleet[i]);
}
let paxId=1;
function spawnPax(){
  const cands=UL.filter(k=>{
    if(pax.some(p=>p.node===k))return false;
    const n=nodes[k],[sx,sy]=w2s(n.x,n.y);
    return sx>24&&sx<cw-24&&sy>$('topEl').offsetHeight+60&&sy<ch-$('bottomEl').offsetHeight;
  });
  const pool=cands.length?cands:UL.filter(k=>!pax.some(p=>p.node===k));
  if(!pool.length)return;
  const node=pool[Math.floor(Math.random()*pool.length)];
  const rush=isRush(),q=Math.random(),pc=.012+.004*S.area;
  const celeb=q<pc,vip=!celeb&&q<pc+.08+.03*S.area,rest=Math.random();
  const kind=celeb?'celeb':vip?'vip':rest<(rush?.5:.12)?'commuter':rest<(rush?.6:.37)?'tourist':'regular';
  const dest=kind==='tourist'?pickFrom(node,500,950):kind==='commuter'?pickFrom(node,140,380):pickFrom(node,260,760);
  const face=Math.floor(Math.random()*facesFor({kind}).length);
  pax.push({id:paxId++,node,dest,vip:vip||celeb,celeb,kind,face,age:0,patience:PATIENCE[kind],taken:null});
  if(celeb)float(nodes[node].x,nodes[node].y-60,'Celebrity!','#d63fb0');
}
function demand(){
  return 0.6*(0.05+0.04*S.fleet.length)*(1+0.25*S.area)*(isRush()?2:1)*(1+.2*rainLvl)*Math.pow(speedMult(),.7);
}
let spawnAcc=0;
function nearestFree(c){
  let best=null,bd=1e9;
  pax.forEach(p=>{if(p.taken)return;const d=ndist(c.node,p.node);if(d<bd){bd=d;best=p}});
  return best;
}
function dispatch(c,p){
  const mid=c.route.length>0;
  const from=mid?c.route[0]:c.node;
  const r=route(from,p.node);
  c.route=mid?r:r.slice(1);
  c.pax=p;p.taken=c;p.pw=0;c.phase='pick';
}
function pickup(c){
  const p=c.pax,i=pax.indexOf(p);if(i>=0)pax.splice(i,1);
  c.phase='ride';c.ride=0;c.route=route(c.node,p.dest).slice(1);c.wait=.4;
}
function dropoff(c){
  const p=c.pax,f=c.f,m=MODELS[f.m],mi=c.ride/MILE;
  const gross=mi*incomePerMi()*m.inc*rebirthMult()*boostMult()*(p&&p.celeb?10:p&&p.vip?4:1)*(p&&p.kind==='tourist'?1.15:1)*weatherPay();
  gain(gross);S.fin.rev+=gross;S.lifeRev+=gross;f.rev+=gross;flow.push([Date.now(),gross]);
  S.rides++;S.miles+=mi;mprog('rides',1);mprog('miles',mi);
  const cost=(f.d?spend('cuts',gross*.1,f):0)+spend('fuel',mi*incomePerMi()*.08*fuelIdx(),f)+spend('tax',gross*(.02+.01*S.area),f);
  const [dx,dy]=[c.x,c.y];
  float(dx,dy,(p&&p.vip?'VIP +$':'+$')+fmt(gross-cost),p&&p.vip?'#e8a400':'#2ea23a');
  float(dx,dy+17,'costs -$'+fmt(cost),'#d9473d');
  if(p&&p.vip){
    S.vips++;mprog('vip',1);
    if(p.celeb){S.gems+=3;float(dx,dy-24,'+3 diamonds','#2f8cf0');showToast('CELEBRITY FARE','x10 pay and 3 diamonds')}
    else if(Math.random()<.35){S.gems++;float(dx,dy-24,'+1 diamond','#2f8cf0')}
  }
  if(p&&p.kind==='commuter'){
    const tip=gross*(isRush()?.4:.1);
    gain(tip);S.fin.rev+=tip;S.lifeRev+=tip;f.rev+=tip;flow.push([Date.now(),tip]);
    float(dx,dy-42,(isRush()?'Rush tip +$':'Tip +$')+fmt(tip),'#e8a400');
  }
  c.pax=null;c.phase='idle';c.route=[];c.wait=.5;
  checkAch();
}
function wander(c){
  const t=pickFrom(c.node,120,380);
  if(t>=0&&t!==c.node)c.route=route(c.node,t).slice(1);
}
function cancelPax(c,broke){
  const p=c.pax;
  if(p){
    const i=pax.indexOf(p);if(i>=0)pax.splice(i,1);
    const pen=Math.round(incomePerMi()*1.5);spend('cancel',pen,c.f);
    float(c.x,c.y-20,'Cancelled -$'+fmt(pen),'#d9473d');
  }
  c.pax=null;c.phase='idle';c.route=broke?[]:c.route.slice(0,1);
}
function breakDown(c){
  c.broken=true;c.brokenT=25;
  if(c.phase==='pick'&&c.pax){c.pax.taken=null;c.pax.pw=0;c.pax=null;c.phase='idle';c.route=[]}
  float(c.x,c.y-22,'Broken down! Tap to repair','#d9473d');
}
const carFee=c=>c.broken?repairFee()*(S.plan.ins?.2:1):Math.round((100-c.f.cond)/100*incomePerMi()*20);
function serviceAll(){
  const need=cars.filter(c=>c.broken||c.f.cond<99.5);
  const tot=need.reduce((s,c)=>s+carFee(c),0);
  if(!need.length||S.cash<tot)return;
  need.forEach(fixCar);
}
function fixCar(c){
  const f=c.f,broke=c.broken;
  const fee=broke?repairFee()*(S.plan.ins?.2:1):Math.round((100-f.cond)/100*incomePerMi()*20);
  if(S.cash<fee){float(c.x,c.y-22,'Need $'+fmt(fee),'#d9473d');return}
  spend(broke?'repair':'maint',fee,f);
  if(broke){f.cond=55;c.broken=false;c.wait=.3}else f.cond=100;
  float(c.x,c.y-22,(broke?'Repaired -$':'Serviced -$')+fmt(fee),'#2f8cf0');
}
function onDrive(c,d){
  const f=c.f;
  f.cond=Math.max(0,f.cond-d/MILE*.25);
  if(S.plan.svc&&f.cond<30)f.cond=100;
  if(f.cond<=0&&!c.broken){breakDown(c);return}
  c.evt=(c.evt||0)+d;
  while(c.evt>=25){
    c.evt-=25;
    const cn=cong(c.x,c.y),rush=isRush()?1:0;
    if(Math.random()<.0006*(1+2*cn*rush+(f.cond<35?1.5:0)+.6*rainLvl)){
      const fee=incomePerMi()*12*(S.plan.ins?.2:1);
      spend('accident',fee,f);c.wait=4;c.crash=1.6;c.evt=0;
      float(c.x,c.y-22,'Accident! -$'+fmt(fee),'#d9473d');return;
    }
    if(speedMult()>1.7&&Math.random()<.0005*(speedMult()-1)*(rush?1.5:1)){
      const fine=incomePerMi()*3;spend('fines',fine,f);
      float(c.x,c.y-22,'Speeding fine -$'+fmt(fine),'#d9473d');
    }
  }
}
function stepCar(c,dt){
  const f=c.f;
  if(c.crash>0)c.crash-=dt;
  if(c.broken){
    c.brokenT-=dt;
    if(c.phase==='ride'&&c.brokenT<=0)cancelPax(c,true);
    return;
  }
  if(c.wait>0){c.wait-=dt;return}
  if(c.phase==='idle'&&f.d){const p=nearestFree(c);if(p)dispatch(c,p)}
  if(c.phase==='pick'&&c.pax){
    c.pax.pw=(c.pax.pw||0)+dt;
    if(c.pax.pw>(c.pax.vip?15:24)){cancelPax(c,false);return}
  }
  const tf=(1-(.1+(isRush()?.4:0))*cong(c.x,c.y))*(1-.15*rainLvl);
  let move=22*speedMult()*MODELS[f.m].spd*tf*(f.cond<35?.6:1)*dt;
  while(move>0&&c.route.length){
    const nn=nodes[c.route[0]],dx=nn.x-c.x,dy=nn.y-c.y,d=Math.hypot(dx,dy);
    if(d>.001)c.tang=Math.atan2(dy,dx)+Math.PI/2;
    let step;
    if(d<=move){c.x=nn.x;c.y=nn.y;c.node=c.route.shift();move-=d;step=d;if(c.phase==='ride')c.ride+=d}
    else{c.x+=dx/d*move;c.y+=dy/d*move;if(c.phase==='ride')c.ride+=move;step=move;move=0}
    onDrive(c,step);
    if(c.broken||c.wait>0)break;
  }
  if(!c.route.length&&!c.broken&&c.wait<=0){
    if(c.phase==='pick')pickup(c);
    else if(c.phase==='ride')dropoff(c);
    else if(c.f.d){wander(c);c.wait=.4+Math.random()*1.2}
  }
  const da=((c.tang-c.ang+Math.PI*3)%(Math.PI*2))-Math.PI;
  c.ang+=da*Math.min(1,dt*10);
}
function float(x,y,t,col){floats.push({x,y,t,col,age:0})}

/* ---------- drawing ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function carSprite(c,time){
  const m=MODELS[c.f.m],L=m.len,Wd=11;
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.ang);
  if(nightLvl>.1){
    const gr=ctx.createLinearGradient(0,-L/2,0,-L/2-36);
    gr.addColorStop(0,'rgba(255,240,170,'+(.6*nightLvl)+')');gr.addColorStop(1,'rgba(255,240,170,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(-4,-L/2);ctx.lineTo(4,-L/2);ctx.lineTo(14,-L/2-36);ctx.lineTo(-14,-L/2-36);ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='#0003';rr(ctx,-Wd/2+2,-L/2+3,Wd,L,4);ctx.fill();
  ctx.fillStyle=m.c;ctx.strokeStyle='#1b2030';ctx.lineWidth=1.5;rr(ctx,-Wd/2,-L/2,Wd,L,4.5);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1f2a48';rr(ctx,-Wd/2+1.6,-L/2+L*.2,Wd-3.2,L*.2,2);ctx.fill();
  rr(ctx,-Wd/2+1.8,L/2-L*.28,Wd-3.6,L*.14,2);ctx.fill();
  if(m.sign){ctx.fillStyle='#fff';ctx.fillRect(-2.6,-1,5.2,2.6)}
  if(c.phase==='ride'){ctx.fillStyle=c.pax&&c.pax.vip?'#ffcf3a':'#fff';ctx.beginPath();ctx.arc(0,L*.02,2.4,0,7);ctx.fill();ctx.strokeStyle='#1b2030';ctx.lineWidth=.8;ctx.stroke()}
  ctx.restore();
  if(c.phase==='idle'&&!c.f.d){
    ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.globalAlpha=.5+.4*Math.sin(time/250);
    ctx.beginPath();ctx.arc(c.x,c.y,19,0,7);ctx.stroke();ctx.restore();
  }
  if(c.pulse>0){ctx.save();ctx.strokeStyle='#ffd21f';ctx.globalAlpha=c.pulse;ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,c.y,14+(1-c.pulse)*18,0,7);ctx.stroke();ctx.restore()}
  if(c.broken||c.f.cond<35||c.crash>0){
    const red=c.broken||c.crash>0,y=c.y-24+Math.sin(time/180)*2;
    ctx.save();ctx.fillStyle=red?'#e5483f':'#ffb020';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(c.x,y-10);ctx.lineTo(c.x+10,y+7);ctx.lineTo(c.x-10,y+7);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='800 11px sans-serif';ctx.textAlign='center';ctx.fillText('!',c.x,y+5.5);ctx.restore();
  }
  if(c.crash>0){ctx.save();ctx.strokeStyle='#ff4b3a';ctx.globalAlpha=Math.min(1,c.crash);ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,c.y,16,0,7);ctx.stroke();ctx.restore()}
}
function drawPin(p,time){
  const n=nodes[p.node],[sx,sy0]=w2s(n.x,n.y),sy=sy0-4+Math.sin(time/300+p.id)*2;
  const cy=sy-36,r=21;
  ctx.save();
  ctx.globalAlpha=p.taken?.45:1;
  ctx.fillStyle='#16161d';ctx.beginPath();ctx.arc(sx,cy,r+3,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(sx-13,cy+14);ctx.lineTo(sx,sy);ctx.lineTo(sx+13,cy+14);ctx.closePath();ctx.fill();
  ctx.fillStyle=KCOL[p.kind||'regular'];ctx.beginPath();ctx.arc(sx,cy,r,0,7);ctx.fill();
  if(p.vip){ctx.strokeStyle='#fff6c2';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,cy,r-1,0,7);ctx.stroke()}
  ctx.save();ctx.beginPath();ctx.arc(sx,cy,r-4,0,7);ctx.clip();
  ctx.drawImage(facesFor(p)[p.face],sx-r+4,cy-r+4,(r-4)*2,(r-4)*2);ctx.restore();

    const f=1-p.age/p.patience;
    ctx.strokeStyle=f>.4?'#6ee06f':f>.2?'#ffb020':'#ff4b3a';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(sx,cy,r+1.5,-Math.PI/2,-Math.PI/2+Math.PI*2*f);ctx.stroke();
  }
  if(p.vip&&!p.celeb){
    ctx.fillStyle='#ffcf3a';ctx.strokeStyle='#7a5200';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(sx-11,cy-r-3);ctx.lineTo(sx-11,cy-r-13);ctx.lineTo(sx-5,cy-r-8);ctx.lineTo(sx,cy-r-15);ctx.lineTo(sx+5,cy-r-8);ctx.lineTo(sx+11,cy-r-13);ctx.lineTo(sx+11,cy-r-3);ctx.closePath();ctx.fill();ctx.stroke();
  }
  if(p.celeb){
    ctx.fillStyle='#ff6bd0';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.lineJoin='round';
    ctx.beginPath();
    for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rad=k%2?6:13;const x=sx+Math.cos(a)*rad,y=cy-r-12+Math.sin(a)*rad;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.closePath();ctx.fill();ctx.stroke();
  }
  if(p.kind==='tourist'||p.kind==='commuter'){
    const bx=sx+r-2,by=cy+r-4;
    ctx.fillStyle='#16161d';ctx.beginPath();ctx.arc(bx,by,9,0,7);ctx.fill();
    ctx.fillStyle=KCOL[p.kind];ctx.beginPath();ctx.arc(bx,by,7.5,0,7);ctx.fill();

    else{ctx.fillRect(bx-4.5,by-2,9,6);ctx.fillRect(bx-2,by-4,4,2)}
  }
  ctx.restore();
}
function draw(time){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#cfd2c4';ctx.fillRect(0,0,cw,ch);
  ctx.setTransform(dpr*cam.s,0,0,dpr*cam.s,dpr*(cw/2-cam.x*cam.s),dpr*(cam.uy-cam.y*cam.s));
  ctx.drawImage(tex,0,0,W,H);
  if(nightLvl>.01||rainLvl>.01){
    ctx.fillStyle='rgba(12,20,52,'+Math.min(.62,.56*nightLvl+.16*rainLvl)+')';ctx.fillRect(0,0,W,H);
    if(nightLvl>.05){ctx.globalAlpha=nightLvl;ctx.drawImage(tex2,0,0,W,H);ctx.globalAlpha=1}
  }
  // locked-district veil
  const v=cam.vr;
  ctx.fillStyle='rgba(20,24,46,.52)';ctx.beginPath();
  ctx.rect(-200,-200,W+400,H+400);ctx.rect(v.x0,v.y0,v.x1-v.x0,v.y1-v.y0);ctx.fill('evenodd');
  ctx.strokeStyle='#ffffffb0';ctx.lineWidth=2.5/cam.s;ctx.setLineDash([10/cam.s,8/cam.s]);
  ctx.strokeRect(v.x0,v.y0,v.x1-v.x0,v.y1-v.y0);ctx.setLineDash([]);
  // rush-hour traffic on busy roads
  if(isRush()){
    ctx.lineCap='round';
    edges.forEach(e=>{
      const a=nodes[e.a],b=nodes[e.b];if(!a.unl&&!b.unl)return;
      const cn=cong((a.x+b.x)/2,(a.y+b.y)/2);if(cn<.28)return;
      ctx.strokeStyle=cn>.6?'rgba(255,60,45,.75)':'rgba(255,170,30,.7)';ctx.lineWidth=e.w*.55;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    });
  }
  // routes
  cars.forEach((c,idx)=>{
    if(!c.route.length)return;
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash([12,9]);ctx.lineDashOffset=-time/40;
    ctx.beginPath();ctx.moveTo(c.x,c.y);c.route.forEach(n=>ctx.lineTo(nodes[n].x,nodes[n].y));
    ctx.globalAlpha=.55;ctx.strokeStyle='#103a1c';ctx.lineWidth=6;ctx.stroke();
    ctx.globalAlpha=c.phase==='pick'?.95:.75;ctx.strokeStyle=c.phase==='pick'?'#47e068':'#8cf5a3';ctx.lineWidth=3.6;ctx.stroke();
    ctx.restore();
  });
  // drop-off markers
  cars.forEach(c=>{
    if(c.phase!=='ride'||!c.pax)return;
    const t=nodes[c.pax.dest],vip=c.pax.vip;
    ctx.fillStyle=vip?'#ffcf3a':'#43b648';ctx.strokeStyle='#fff';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(t.x,t.y,12+Math.sin(time/250)*1.5,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle=vip?'#6b4a00':'#fff';ctx.font='800 14px sans-serif';ctx.textAlign='center';ctx.fillText('$',t.x,t.y+5);
  });
  cars.forEach(c=>carSprite(c,time));
  // screen-space layer
  ctx.setTransform(dpr,0,0,dpr,0,0);
  pax.slice().sort((a,b)=>nodes[a.node].y-nodes[b.node].y).forEach(p=>drawPin(p,time));
  if(rainLvl>.03){
    ctx.save();ctx.strokeStyle='rgba(205,228,255,'+(.5*rainLvl)+')';ctx.lineWidth=1.3;ctx.beginPath();
    const n=Math.round(clamp(cw*ch/2600,60,260));
    for(let i=0;i<n;i++){
      const sp=.6+(i%5)*.13,y=((i*311.7)%ch+time*.55*sp)%ch,x=((i*173.3)%cw-y*.22+cw*2)%cw;
      ctx.moveTo(x,y);ctx.lineTo(x-3.5,y+13);
    }
    ctx.stroke();ctx.restore();
  }
  floats.forEach(f=>{
    const [sx,sy]=w2s(f.x,f.y);
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age/1.3);
    ctx.font='400 21px "Lilita One","Arial Rounded MT Bold",sans-serif';ctx.textAlign='center';ctx.lineJoin='round';
    ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText(f.t,sx,sy-f.age*42);ctx.fillStyle=f.col;ctx.fillText(f.t,sx,sy-f.age*42);
    ctx.restore();
  });
}

/* ---------- input on the map ---------- */
function onTap(px,py){
  let hit=null,bd=30;
  pax.forEach(p=>{
    if(p.taken)return;
    const n=nodes[p.node],[sx,sy]=w2s(n.x,n.y),d=Math.hypot(px-sx,py-(sy-34));
    if(d<bd){bd=d;hit=p}
  });
  if(hit){
    let car=null,cd=1e9;
    cars.forEach(c=>{if(c.phase==='idle'&&!c.broken){const d=ndist(c.node,hit.node)+Math.hypot(c.x-nodes[c.node].x,c.y-nodes[c.node].y);if(d<cd){cd=d;car=c}}});
    if(car){car.wait=0;dispatch(car,hit)}
    else{const n=nodes[hit.node];float(n.x,n.y-50,'All taxis busy','#c33')}
    return;
  }
  const [wx,wy]=s2w(px,py);let best=null;bd=46/cam.s;
  cars.forEach(c=>{const d=Math.hypot(c.x-wx,c.y-wy);if(d<bd){bd=d;best=c}});
  if(best){
    if(best.broken||best.f.cond<35){fixCar(best);updateUI();return}
    const tip=incomePerMi()*5*boostMult()*rebirthMult();
    gain(tip);S.fin.rev+=tip;S.lifeRev+=tip;best.f.rev+=tip;flow.push([Date.now(),tip]);S.tips++;mprog('tips',1);best.pulse=1;float(best.x,best.y-18,'Tip +$'+fmt(tip),'#e8a400');updateUI();
  }
}
/* drag to pan, pinch or wheel to zoom, tap to act */
const ptrs=new Map();let drag=null,pinch=0;
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
function applyView(){view.dirty=true;camTarget(false);cam.s=camT.s;cam.x=camT.x;cam.y=camT.y;cam.uy=camT.uy}
cv.addEventListener('pointerdown',ev=>{
  try{cv.setPointerCapture(ev.pointerId)}catch(e){}
  const r=cv.getBoundingClientRect();
  ptrs.set(ev.pointerId,{x:ev.clientX-r.left,y:ev.clientY-r.top});
  if(!drag)drag={moved:false,sx:ev.clientX,sy:ev.clientY};
  if(ptrs.size===2){pinch=pdist();drag.moved=true}
});
cv.addEventListener('pointermove',ev=>{
  const p=ptrs.get(ev.pointerId);if(!p)return;
  const r=cv.getBoundingClientRect(),nx=ev.clientX-r.left,ny=ev.clientY-r.top;
  if(ptrs.size===2){
    p.x=nx;p.y=ny;const d=pdist();
    if(pinch>0)view.z=clamp(view.z*d/pinch,.4,4);
    pinch=d;applyView();return;
  }
  if(!drag.moved&&Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)<7){p.x=nx;p.y=ny;return}
  drag.moved=true;
  view.px-=(nx-p.x)/cam.s;view.py-=(ny-p.y)/cam.s;p.x=nx;p.y=ny;applyView();
});
function endPtr(ev){
  const p=ptrs.get(ev.pointerId);ptrs.delete(ev.pointerId);
  if(drag&&!drag.moved&&ev.type==='pointerup'&&p)onTap(p.x,p.y);
  if(ptrs.size<2)pinch=0;
  if(ptrs.size===0)drag=null;
}

/* ---------- purchases ---------- */
function buy(kind){
  if(kind==='inc'&&S.cash>=costInc()){S.cash-=costInc();S.inc++}
  else if(kind==='spd'&&S.cash>=costSpd()){S.cash-=costSpd();S.spd++}
  else if(kind==='car'&&S.fleet.length<AREAS[S.area].cap&&S.cash>=costCar()){
    S.cash-=costCar();
    let best=0;S.models.forEach((o,i)=>{if(o)best=i});
    S.fleet.push(newCar(best,0));syncCars();
  }else return;
  checkAch();updateUI();save();
}
$('bInc').onclick=()=>buy('inc');
$('bSpd').onclick=()=>buy('spd');
$('bCar').onclick=()=>buy('car');

/* ---------- daily reward ---------- */
const DAILY=[{c:1},{g:1},{c:2},{g:2},{c:4},{g:3},{c:8,g:5}];
const todayStr=()=>new Date().toLocaleDateString('en-CA');
function dailyState(){
  const t=todayStr();
  if(S.lastDaily===t)return {claimed:true,idx:(S.streak+6)%7};
  let idx=0;
  if(S.lastDaily){const diff=Math.round((Date.parse(t)-Date.parse(S.lastDaily))/864e5);idx=diff===1?S.streak%7:0}
  return {claimed:false,idx};
}
const dailyUnit=()=>Math.max(200,Math.round(rateEst()*240));
function claimDaily(){
  const st=dailyState();if(st.claimed)return;
  const d=DAILY[st.idx];
  if(d.c)gain(d.c*dailyUnit());
  if(d.g)S.gems+=d.g;
  S.streak=st.idx+1;S.lastDaily=todayStr();
  showToast('DAILY REWARD',(d.c?'+$'+fmt(d.c*dailyUnit())+' ':'')+(d.g?'+'+d.g+' diamonds':''));
  save();
}

/* ---------- rebirth ---------- */
const starGain=()=>Math.floor(Math.sqrt(S.run/50000));
function rebirth(){
  const g=starGain();if(g<1)return;
  S.stars+=g;S.cash=50;S.run=0;S.inc=0;S.spd=0;S.area=0;S.fleet=[newCar(0,0)];S.boostUntil=0;S.fin=FIN();S.plan={ins:0,svc:0};
  S.missions=[newMission(),newMission(),newMission()];
  cars.length=0;pax.length=0;resetView();applyArea();syncCars();camTarget(true);
  checkAch();save();showToast('REBIRTH','+'+g+' star'+(g>1?'s':'')+', income +'+Math.round(g*25)+'%');
}

/* ---------- offline ---------- */
function applyAway(sec){
  if(sec<30||drivers()===0)return;
  sec=Math.min(sec,4*3600);
  let r=0;
  S.fleet.forEach(f=>{if(f.d){const m=MODELS[f.m];r+=22*speedMult()*m.spd*(incomePerMi()/MILE)*m.inc*.2}});
  const earn=r*rebirthMult()*sec;
  if(earn<1)return;
  gain(earn);S.fin.rev+=earn;S.lifeRev+=earn;
  const u=opUnit()/60*sec;
  const costs=spend('cuts',earn*.1)+spend('fuel',earn*.04)+spend('tax',earn*(.02+.01*S.area))+spend('wages',drivers()*u*1.2)
    +(S.plan.ins?spend('insur',S.fleet.length*u*.3):0)+(S.plan.svc?spend('plan',S.fleet.length*u*.45):0);
  showToast('WELCOME BACK','Drivers netted $'+fmt(Math.max(0,earn-costs)));updateUI();
}

/* ---------- main loop ---------- */
let last=0,saveT=0,uiT=0;
const opAcc={wages:0,insur:0,plan:0};
function ops(dt){
  const u=opUnit()/60*dt,n=S.fleet.length;
  opAcc.wages+=drivers()*u*1.2;
  if(S.plan.ins)opAcc.insur+=n*u*.3;
  if(S.plan.svc)opAcc.plan+=n*u*.45;
  for(const k in opAcc)if(opAcc[k]>=1){const v=Math.floor(opAcc[k]);spend(k,v);opAcc[k]-=v}
}
function frame(time){
  const dt=Math.min(.05,(time-last)/1000||0);last=time;
  cars.forEach(c=>{stepCar(c,dt);if(c.pulse>0)c.pulse=Math.max(0,c.pulse-dt*2.5)});
  for(let i=pax.length-1;i>=0;i--){const p=pax[i];if(!p.taken){p.age+=dt;if(p.age>p.patience)pax.splice(i,1)}}
  for(let i=floats.length-1;i>=0;i--){floats[i].age+=dt;if(floats[i].age>1.3)floats.splice(i,1)}
  ops(dt);
  nightLvl+=(nightTarget()-nightLvl)*Math.min(1,dt*.4);
  rainLvl+=(rainTarget()-rainLvl)*Math.min(1,dt*.3);
  spawnAcc+=dt*demand();
  const cap=4+S.fleet.length+2*S.area;
  while(spawnAcc>=1){spawnAcc-=1;if(pax.length<cap)spawnPax()}
  const k=1-Math.exp(-dt*3.2);
  cam.s+=(camT.s-cam.s)*k;cam.x+=(camT.x-cam.x)*k;cam.y+=(camT.y-cam.y)*k;cam.uy+=(camT.uy-cam.uy)*k;
  for(const q of ['x0','y0','x1','y1'])cam.vr[q]+=(camT.vr[q]-cam.vr[q])*k;
  uiT+=dt;if(uiT>.25){uiT=0;updateUI()}
  saveT+=dt;if(saveT>5){saveT=0;save()}
  draw(time);
  requestAnimationFrame(frame);
}
