<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kheti Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: HUD on top, field canvas beside a ledger panel, vehicle bar underneath. */
:root{
  --bg:#e9eee4; --surface:#fbfcf8; --ink:#17251c; --muted:#56655b; --line:#d3dacc;
  --chip:#e1e8db; --field:#2c7a39; --field-fill:#3f8f4a; --on-field:#ffffff;
  --gold:#e0a416; --danger:#b3302a; --soil:#7a5638;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1611; --surface:#18221b; --ink:#e7efe6; --muted:#9bab9f; --line:#2b3a2f;
  --chip:#223027; --field:#6cc079; --field-fill:#4a9d57; --on-field:#08110a;
  --gold:#f0b429; --danger:#ef6a62; --soil:#a07a50; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1611; --surface:#18221b; --ink:#e7efe6; --muted:#9bab9f; --line:#2b3a2f;
  --chip:#223027; --field:#6cc079; --field-fill:#4a9d57; --on-field:#08110a;
  --gold:#f0b429; --danger:#ef6a62; --soil:#a07a50; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--field);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-block:10px}

#hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
#hud h1{font:800 20px/1 var(--f-display);margin:0 6px 0 0;letter-spacing:-.01em}
#hud h1 small{display:block;font:500 11px/1.2 var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat b{font:700 17px/1.1 var(--f-display)}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.daybar{width:84px;height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:4px}
.daybar i{display:block;height:100%;width:0;background:var(--gold)}
#bookbtn{display:none;margin-left:0;background:var(--field-fill);color:var(--on-field);border:0;border-radius:9px;padding:8px 14px;font-weight:700}

main{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:10px;min-height:0}
#stage{position:relative;border-radius:14px;overflow:hidden;min-height:0;background:#6e9a55;border:1px solid var(--line)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.tip{position:absolute;left:10px;top:10px;max-width:calc(100% - 190px);padding:7px 11px;border-radius:9px;
  background:rgba(14,24,17,.78);color:#fff;font-size:13px;pointer-events:none}
#camBtn{position:absolute;right:10px;top:10px;border:0;border-radius:9px;padding:8px 12px;background:rgba(14,24,17,.78);color:#fff;font-weight:700;font-size:13px}
#camBtn:hover{background:rgba(14,24,17,.92)}
#nav{position:absolute;right:10px;top:52px;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;background:rgba(14,24,17,.78);color:#fff;font-weight:700;font-size:13px;pointer-events:none}
#navArrow{display:inline-block;color:#ffd75e;font-size:15px;line-height:1}
#toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,8px);padding:8px 14px;border-radius:9px;
  background:rgba(14,24,17,.88);color:#fff;font-weight:500;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 20px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#padL,#padR{position:absolute;bottom:max(12px,env(safe-area-inset-bottom,0px));display:none;gap:12px}
#padL{left:12px;flex-direction:column}
#padR{right:12px;flex-direction:row}
.pb{width:72px;height:72px;border:0;border-radius:18px;background:rgba(14,24,17,.6);color:#fff;font-size:26px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.pb:active,.pb.down{background:rgba(14,24,17,.92)}
#fsBtn{margin-left:auto;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-weight:700}
#fsBtn:hover{background:var(--line)}
#app.pseudo{position:fixed;inset:0;z-index:100;height:auto;background:var(--bg);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

#panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0}
#tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-weight:700;color:var(--muted)}
#tabs button.on{background:var(--chip);color:var(--ink)}
#pbody{padding:12px;overflow:auto;min-height:0;flex:1}
#pbody h3{font:700 15px/1.2 var(--f-display);margin:16px 0 8px}
#pbody h3:first-child{margin-top:0}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:6px 10px;font-weight:700}
.btn.go{background:var(--field-fill);color:var(--on-field);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.crops{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.crop{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px}
.crop.on{border-color:var(--field-fill);box-shadow:inset 0 0 0 1px var(--field-fill);background:var(--chip)}
.crop b{display:flex;align-items:center;gap:6px}
.crop i{width:10px;height:10px;border-radius:50%;display:inline-block}
.crop small{color:var(--muted);font-size:12px}

.pmap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pl{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:70px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;background:transparent;text-align:left}
.pl.open{background:var(--chip)}
.pl small{color:var(--muted);font-size:11px;line-height:1.3}
.pl b{font-size:12px}

table{width:100%;border-collapse:collapse}
td,th{padding:5px 0;text-align:left;border-bottom:1px solid var(--line)}
td:last-child,th:last-child{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
tr.sub td{color:var(--muted);font-size:12px}
.pos{color:var(--field)}.neg{color:var(--danger)}
.ledger{max-height:200px;overflow:auto}
ol.how{margin:0;padding-left:18px;display:grid;gap:4px}

@media (max-width:820px),(pointer:coarse){
  main{grid-template-columns:minmax(0,1fr)}
  #panel{position:absolute;inset:0;z-index:5;display:none}
  #panel.open{display:flex}
  #bookbtn{display:block}
}
@media (pointer:coarse),(max-width:820px){#padL,#padR{display:flex}#toast{bottom:104px}}
#app:fullscreen{background:var(--bg);padding-inline:10px}

#fleet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding-bottom:max(0px,env(safe-area-inset-bottom,0px))}
#fleet button{display:flex;flex-direction:column;gap:1px;align-items:flex-start;min-width:0;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:7px 9px}
#fleet button.on{border-color:var(--field-fill);box-shadow:inset 0 0 0 2px var(--field-fill)}
#fleet b{display:flex;align-items:center;gap:6px;font-size:13px;max-width:100%}
#fleet b i{width:10px;height:10px;border-radius:3px;flex:none}
#fleet b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fleet small{color:var(--muted);font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fleet kbd{font:500 10px var(--f-body);color:var(--muted);margin-left:auto;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (max-width:560px){#fleet kbd{display:none}#fleet small{font-size:10px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <header id="hud">
    <h1>Kheti Farm<small>Plough · sow · water · harvest · sell</small></h1>
    <div class="stat"><b class="num" id="h-cash">₹0</b><span>Cash</span></div>
    <div class="stat"><b class="num" id="h-day">Day 1</b><span>Season clock</span><div class="daybar"><i id="h-bar"></i></div></div>
    <div class="stat"><b class="num" id="h-worth">₹0</b><span>Net worth</span></div>
    <div class="stat"><b class="num" id="h-plots">1 / 9</b><span>Plots owned</span></div>
    <button id="fsBtn" type="button">⛶ Full screen</button>
    <button id="bookbtn" type="button">Farm book</button>
  </header>
  <main>
    <div id="stage">
      <canvas id="cv" aria-label="Farm map"></canvas>
      <div class="tip" id="tip"></div>
      <button id="camBtn" type="button" title="Change camera angle (C)">Camera: Chase ▸</button>
      <div id="nav" hidden><span id="navArrow">▲</span><span id="navText"></span></div>
      <div id="toast"></div>
      <div id="padL" aria-label="Forward and back">
        <button type="button" class="pb" data-d="u" aria-label="Forward">▲</button>
        <button type="button" class="pb" data-d="d" aria-label="Back">▼</button>
      </div>
      <div id="padR" aria-label="Steer left and right">
        <button type="button" class="pb" data-d="l" aria-label="Steer left">◀</button>
        <button type="button" class="pb" data-d="r" aria-label="Steer right">▶</button>
      </div>
    </div>
    <aside id="panel">
      <div id="tabs">
        <button type="button" data-act="tab:fields" class="on">Fields</button>
        <button type="button" data-act="tab:market">Godown &amp; Mandi</button>
        <button type="button" data-act="tab:books">Balance sheet</button>
      </div>
      <div id="pbody"></div>
    </aside>
  </main>
  <nav id="fleet" aria-label="Vehicles"></nav>
</div>
<script>
(function(){
'use strict';
var T=40,COLS=144,ROWS=70,PW=12,PH=8,DAYLEN=24,SAVE_KEY='kheti-farm-v3';
function $(id){return document.getElementById(id);}

var CROPS={
  wheat:{name:'Wheat',seed:4,grow:38,yield:3,base:9,ripe:'#e3b341',leaf:'#7fb04a'},
  tomato:{name:'Tomato',seed:10,grow:30,yield:3,base:14,ripe:'#d9412e',leaf:'#4f9a3f'},
  rice:{name:'Rice',seed:6,grow:50,yield:4,base:9,ripe:'#cdd870',leaf:'#6cae4b'},
  corn:{name:'Corn',seed:8,grow:65,yield:5,base:10,ripe:'#f2c418',leaf:'#4c9a3a'},
  cane:{name:'Sugarcane',seed:14,grow:100,yield:8,base:11,ripe:'#a9bd4e',leaf:'#5fa043'}
};
var CROP_IDS=Object.keys(CROPS);

var TANK_CAP=100,HOPPER_CAP=130,TRUCK_CAP=320;
var VEH=[
  {id:'tractor',short:'Plough',name:'Tractor + Plough',color:'#c2362f',speed:4.6,tip:'Drive over hard brown soil to plough it soft.'},
  {id:'seeder',short:'Seeder',name:'Seed Drill',color:'#2f6db5',speed:4.4,tip:'Drive over ploughed soil to bury seeds. Pick the crop in Fields.'},
  {id:'tanker',short:'Tanker',name:'Water Tanker',color:'#2a9d9b',speed:4.4,tip:'Drive over sown rows to water them. Refill at the well.'},
  {id:'harvester',short:'Harvester',name:'Harvester',color:'#e0a21a',speed:3.8,tip:'Drive over golden crops to cut them. Unload at the godown.'},
  {id:'truck',short:'Truck',name:'Delivery Truck',color:'#6b5aa6',speed:9,tip:'Load at the godown, then drive to the Mandi to sell.'}
];
var VEH_BY={};VEH.forEach(function(d){VEH_BY[d.id]=d;});

var BUILD=[
  {k:'shed',x:9,y:44,w:1,h:1},{k:'shed',x:23,y:44,w:1,h:1},{k:'shed',x:9,y:48,w:1,h:1},{k:'shed',x:23,y:48,w:1,h:1},
  {k:'shed',x:10,y:43,w:5,h:1},
  {k:'godown',x:26,y:44,w:10,h:5},
  {k:'well',x:40,y:44,w:3,h:3},
  {k:'pond',x:20,y:60,w:10,h:7}
];
var ZONES={
  godown:[{x:26,y:42,w:10,h:2},{x:26,y:49,w:10,h:2}],
  well:[{x:38,y:42,w:7,h:7}],
  market:[{x:108,y:34,w:32,h:6}]
};
var HOMES=[{x:58,y:42},{x:86,y:42},{x:52,y:2},{x:82,y:2}];
var STALLS=[{x:112,y:28},{x:122,y:28},{x:132,y:28}];
var NF=[],fieldAt=new Int16Array(COLS*ROWS).fill(-1);
var PL=[],plotAt=new Int8Array(COLS*ROWS).fill(-1),buildAt=new Uint8Array(COLS*ROWS);
(function(){
  for(var r=0;r<3;r++)for(var c=0;c<3;c++){
    var id=r*3+c,x=12+c*12,y=12+r*8;PL.push({id:id,c:c,r:r,x:x,y:y});
    for(var j=0;j<PH;j++)for(var i=0;i<PW;i++)plotAt[(y+j)*COLS+x+i]=id;
  }
  BUILD.forEach(function(b){mark(b.x,b.y,b.w,b.h);});
  [[52,12,4,3],[12,0,3,1],[112,0,2,3],[56,50,4,2]].forEach(function(g){
    for(var r=0;r<g[3];r++)for(var c=0;c<g[2];c++)NF.push({x:g[0]+c*12,y:g[1]+r*8,w:12,h:8});
  });
  NF.forEach(function(f,n){for(var j=0;j<f.h;j++)for(var k=0;k<f.w;k++)fieldAt[(f.y+j)*COLS+f.x+k]=n;mark(f.x,f.y,f.w,f.h);});
  HOMES.forEach(function(h){mark(h.x,h.y,7,5);mark(h.x+10,h.y,10,5);mark(h.x+23,h.y+1,3,3);});
  STALLS.forEach(function(s){mark(s.x,s.y,7,4);});
  function mark(x,y,w,hh){for(var j=0;j<hh;j++)for(var i=0;i<w;i++)buildAt[(y+j)*COLS+x+i]=1;}
})();

function qty(o){var n=0;for(var k in o)n+=o[k];return n;}
function inr(n){return (n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');}
function inr1(n){return '₹'+(Math.round(n*10)/10).toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1});}

var S;
function emptyCells(){var a=[];for(var i=0;i<PW*PH;i++)a.push({s:0,crop:null,g:0,w:false});return a;}
function newState(){
  var s={cash:3000,day:1,t:0,unlocked:[],cells:[],seeds:{},godown:{},prices:{},prev:{},sel:'tractor',crop:'wheat',
    loan:0,land:2000,mach:12000,cap0:0,veh:{},ledger:[],
    books:{prod:0,gain:0,seedsUsed:0,fuel:0,interest:0,depr:0,sales:0}};
  for(var i=0;i<9;i++){s.unlocked.push(i===6);s.cells.push(emptyCells());}
  CROP_IDS.forEach(function(id){s.seeds[id]=0;s.godown[id]=0;s.prices[id]=CROPS[id].base;s.prev[id]=CROPS[id].base;});
  s.seeds.wheat=96;
  var xs=[10.9,13.5,16.1,18.7,21.3];
  VEH.forEach(function(d,i){
    s.veh[d.id]={x:xs[i],y:47.2,a:Math.PI/2,tank:d.id==='tanker'?TANK_CAP:0,load:{}};
  });
  s.cap0=calc(s).assets;
  s.ledger.unshift({day:1,text:'Opening capital: cash, 1 plot, machinery, seed bag',amt:0});
  return s;
}
function calc(s){
  var seedStock=0,cropStock=0;
  CROP_IDS.forEach(function(id){
    seedStock+=s.seeds[id]*CROPS[id].seed;
    var q=s.godown[id]+(s.veh.harvester.load[id]||0)+(s.veh.truck.load[id]||0);
    cropStock+=q*CROPS[id].base;
  });
  var b=s.books,assets=s.cash+seedStock+cropStock+s.land+s.mach;
  var income=b.prod+b.gain,exp=b.seedsUsed+b.fuel+b.interest+b.depr,profit=income-exp;
  return {seedStock:seedStock,cropStock:cropStock,assets:assets,income:income,exp:exp,profit:profit,
    equity:s.cap0+profit,liab:s.loan};
}
function log(text,amt){S.ledger.unshift({day:S.day,text:text,amt:amt||0});if(S.ledger.length>60)S.ledger.pop();}
function ownedCount(){return S.unlocked.filter(Boolean).length;}
function plotCost(){return 1500+1000*(ownedCount()-1);}
function canUnlock(id){
  if(S.unlocked[id])return false;var p=PL[id];
  return PL.some(function(q){return S.unlocked[q.id]&&Math.abs(q.c-p.c)+Math.abs(q.r-p.r)===1;});
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;var s=JSON.parse(raw);
    if(!s||!s.cells||s.cells.length!==9||s.cells[0].length!==PW*PH||!s.veh||!s.books)return null;return s;
  }catch(e){return null;}
}

/* ---------- input ---------- */
var keys={},pad={u:0,d:0,l:0,r:0};
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if('arrowupdownleftright wasd'.indexOf(k)>=0||k.indexOf('arrow')===0){if(k.indexOf('arrow')===0||k===' ')e.preventDefault();keys[k]=1;}
  if(k>='1'&&k<='5')selectVeh(VEH[+k-1].id);
  if(k==='c')cycleCam();
});
window.addEventListener('keyup',function(e){delete keys[e.key.toLowerCase()];});
window.addEventListener('blur',function(){keys={};});
Array.prototype.forEach.call(document.querySelectorAll('.pb'),function(b){
  var d=b.getAttribute('data-d');
  b.addEventListener('pointerdown',function(e){e.preventDefault();pad[d]=1;b.classList.add('down');try{b.setPointerCapture(e.pointerId);}catch(x){}});
  b.addEventListener('contextmenu',function(e){e.preventDefault();});
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){b.addEventListener(ev,function(){pad[d]=0;b.classList.remove('down');});});
});

/* ---------- collision ---------- */
function blockedTile(tx,ty){
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return true;
  var i=ty*COLS+tx;
  if(buildAt[i])return true;
  var p=plotAt[i];return p>=0&&!S.unlocked[p];
}
function canStand(x,y){
  var r=0.4;
  return !blockedTile(Math.floor(x-r),Math.floor(y-r))&&!blockedTile(Math.floor(x+r),Math.floor(y-r))&&
         !blockedTile(Math.floor(x-r),Math.floor(y+r))&&!blockedTile(Math.floor(x+r),Math.floor(y+r));
}
function inZone(name,x,y){
  return ZONES[name].some(function(z){return x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h;});
}
function angDiff(a,b){var d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}

/* ---------- effects & messages ---------- */
var fx=[],toastT=0,lastNote={};
function toast(msg){var el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('on');},2400);}
function note(key,msg){var n=Date.now();if(lastNote[key]&&n-lastNote[key]<3500)return;lastNote[key]=n;toast(msg);}
function puff(x,y,col,n){for(var i=0;i<n;i++)fx.push({x:x,y:.15,z:y,vx:(Math.random()-.5)*1.4,vy:.6+Math.random()*.9,vz:(Math.random()-.5)*1.4,life:.5+Math.random()*.3,t:0,col:col});}
function float(x,y,txt,col){fx.push({x:x,y:1.4,z:y,vx:0,vy:.8,vz:0,life:1.6,t:0,txt:txt,col:col});}
function fuel(n){S.cash-=n;S.books.fuel+=n;}

/* ---------- field work ---------- */
function work(v,d){
  var off={tractor:.95,seeder:1.0,tanker:1.0,harvester:-1.0}[d.id]||0;
  var wx=v.x-Math.cos(v.a)*off,wy=v.y-Math.sin(v.a)*off;
  var tx=Math.floor(wx),ty=Math.floor(wy);
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return;
  var pid=plotAt[ty*COLS+tx];
  if(pid<0||!S.unlocked[pid])return;
  var P=PL[pid],cell=S.cells[pid][(ty-P.y)*PW+(tx-P.x)];
  if(d.id==='tractor'){

function zones(v,d,dt){
  if(d.id==='tanker'&&inZone('well',v.x,v.y)&&v.tank<TANK_CAP){
    v.tank=Math.min(TANK_CAP,v.tank+25*dt);
    if(v.tank>=TANK_CAP){v.tank=TANK_CAP;toast('Water tank full');}
  }
  if(d.id==='harvester'&&inZone('godown',v.x,v.y)&&qty(v.load)>0){
    var n=qty(v.load);CROP_IDS.forEach(function(id){S.godown[id]+=(v.load[id]||0);});
    v.load={};toast('Unloaded '+n+' units into the godown');log('Harvester unloaded '+n+' units into godown',0);
    float(v.x,v.y-.4,'+'+n+' stored','#fff3b0');
  }
  if(d.id==='truck'){
    if(inZone('godown',v.x,v.y)){
      var room=TRUCK_CAP-qty(v.load),moved=0;
      CROP_IDS.forEach(function(id){
        var m=Math.min(room,S.godown[id]);if(m>0){S.godown[id]-=m;v.load[id]=(v.load[id]||0)+m;room-=m;moved+=m;}
      });
      if(moved>0){toast('Loaded '+moved+' units. Now drive to the Mandi.');float(v.x,v.y-.4,'Loaded '+moved,'#fff');}
      else if(qty(v.load)===0)note('empty','Godown is empty. Harvest and unload first.');
    }
    if(inZone('market',v.x,v.y)&&qty(v.load)>0){
      var total=0,units=0,parts=[];
      CROP_IDS.forEach(function(id){
        var q=v.load[id]||0;if(!q)return;var p=S.prices[id],rev=q*p;

      });

}

/* ---------- time ---------- */
function newDay(){
  S.day++;S.t=0;
  CROP_IDS.forEach(function(id){
    var c=CROPS[id],p=S.prices[id];S.prev[id]=p;
    p=p*(1+(Math.random()-.5)*.2)+(c.base-p)*.1;
    S.prices[id]=Math.max(c.base*.6,Math.min(c.base*1.6,p));
  });
  S.books.depr+=18;S.mach-=18;
  if(S.loan>0){var i=S.loan*.005;S.cash-=i;S.books.interest+=i;}
}
function grow(dt){
  for(var p=0;p<9;p++){
    if(!S.unlocked[p])continue;
    var cs=S.cells[p];
    for(var i=0;i<cs.length;i++){
      var c=cs[i];
      if(c.s===2&&c.w){c.g+=dt/CROPS[c.crop].grow;if(c.g>=1){c.g=1;c.s=3;}}
    }
  }
}

function selectVeh(id){S.sel=id;updateFleet(true);}
function buySeeds(id,n){

  S.cash-=cost;S.seeds[id]+=n;log('Bought '+n+' '+CROPS[id].name+' seeds',-cost);
}
function unlockPlot(id){
  if(S.unlocked[id])return;

  var cost=plotCost();
  if(S.cash<cost){toast('You need '+inr(cost)+' to buy this plot');return;}

function loan(n){

  if(M.k==='driver'){
    C.x=v.x+Math.cos(v.a)*.2;C.z=v.y+Math.sin(v.a)*.2;C.y=S.sel==='truck'?1.4:(S.sel==='harvester'?1.5:1.3);
    C.yaw=v.a;C.pitch=.08;
  }else{
    var ang=M.k==='orbit'?orbitA:camHead,tx=M.k==='orbit'?v.x:v.x+Math.cos(camHead)*M.la,tz=M.k==='orbit'?v.y:v.y+Math.sin(camHead)*M.la;
    C.x=v.x-Math.cos(ang)*M.d;C.z=v.y-Math.sin(ang)*M.d;C.y=M.h;
    C.yaw=Math.atan2(tz-C.z,tx-C.x);C.pitch=Math.min(1.5,Math.atan2(C.y-.45,Math.hypot(tx-C.x,tz-C.z)));
  }
  skyYaw=C.yaw;
  setCam();
  var hy=Math.max(0,Math.min(H,horizonY)),g=ctx.createLinearGradient(0,0,0,hy+1);
  g.addColorStop(0,'rgb('+(skyTop[0]|0)+','+(skyTop[1]|0)+','+(skyTop[2]|0)+')');g.addColorStop(1,'rgb('+(fogCol[0]|0)+','+(fogCol[1]|0)+','+(fogCol[2]|0)+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hy+1);
  ctx.fillStyle='rgb('+(fogCol[0]|0)+','+(fogCol[1]|0)+','+(fogCol[2]|0)+')';ctx.fillRect(0,hy,W,H-hy);
  items.length=0;labels.length=0;
  drawSky();drawGround();drawZones();drawShadows();
  for(var pid=0;pid<9;pid++){
    if(!S.unlocked[pid])continue;var P=PL[pid],cs=S.cells[pid];
    for(var j=0;j<PH;j++)for(var i=0;i<PW;i++){var c=cs[j*PW+i];if(c.s>=2)drawCrop(c,P.x+i,P.y+j);}
  }
  drawPlotMarks();drawBuildings();
  VEH.forEach(function(d){drawVeh(d,S.veh[d.id],d.id===S.sel);});
  NPCS.forEach(function(n){if(visible(n.v.x,n.v.y,4,6400))drawVeh(n.d,n.v,false,true);});
  PARKED.forEach(function(n){if(visible(n.v.x,n.v.y,4,6400))drawVeh(n.d,n.v,false,true);});
  items.sort(function(a,b){return b.k-a.k;});
  ctx.lineJoin='round';ctx.lineWidth=.7;
  for(var n=0;n<items.length;n++){
    var it=items[n],q=it.p;ctx.fillStyle=it.c;
    ctx.beginPath();ctx.moveTo(q[0],q[1]);for(var m=2;m<q.length;m+=2)ctx.lineTo(q[m],q[m+1]);ctx.closePath();ctx.fill();if(!it.s){ctx.strokeStyle=it.c;ctx.stroke();}
  }
  drawFx();
  ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(20,30,20,.8)';
  for(var l=0;l<labels.length;l++){
    var L=labels[l];ctx.globalAlpha=L.a;ctx.font='700 '+L.s+'px "DM Sans",sans-serif';ctx.strokeText(L.t,L.x,L.y);ctx.fillStyle=L.c;ctx.fillText(L.t,L.x,L.y);
  }
  ctx.globalAlpha=1;
  if(al>0){ctx.fillStyle='rgba(12,22,60,'+al+')';ctx.fillRect(0,0,W,H);}
}

/* ---------- simulation step ---------- */
function step(dt){
  var d=VEH_BY[S.sel],v=S.veh[S.sel];
  VEH.forEach(function(q){S.veh[q.id].mv=0;});
  updateNpcs(dt);
  var th=((keys.w||keys.arrowup||pad.u)?1:0)-((keys.s||keys.arrowdown||pad.d)?1:0);
  var st=((keys.d||keys.arrowright||pad.r)?1:0)-((keys.a||keys.arrowleft||pad.l)?1:0);
  if(st)v.a+=st*(th<0?-1:1)*(th?1.9:1.1)*dt;
  if(th){
    var sp=th*d.speed*(th<0?.55:1)*dt,nx=v.x+Math.cos(v.a)*sp,ny=v.y+Math.sin(v.a)*sp,moved=0;
    if(canStand(nx,v.y)){v.x=nx;moved=1;}
    if(canStand(v.x,ny)){v.y=ny;moved=1;}
    if(moved){v.roll=(v.roll||0)+sp/.25;v.mv=1;if(Math.random()<dt*14)puff(v.x-Math.cos(v.a)*(th>0?.8:-.8),v.y-Math.sin(v.a)*(th>0?.8:-.8),'#cdb98f',1);}
  }
  work(v,d);zones(v,d,dt);
  S.t+=dt;if(S.t>=DAYLEN)newDay();
  grow(dt);
  for(var i=fx.length-1;i>=0;i--){var f=fx[i];f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.z+=f.vz*dt;if(f.t>f.life)fx.splice(i,1);}
}

/* ---------- UI ---------- */
var tab='fields',lastHtml='',resetArm=0;
function counts(){
  var c={hard:0,plough:0,sown:0,dry:0,ready:0};
  for(var p=0;p<9;p++){if(!S.unlocked[p])continue;S.cells[p].forEach(function(x){
    if(x.s===0)c.hard++;else if(x.s===1)c.plough++;else if(x.s===2){c.sown++;if(!x.w)c.dry++;}else c.ready++;});}
  return c;
}
function plotCounts(p){var a=0,b=0;S.cells[p].forEach(function(x){if(x.s===2)a++;else if(x.s===3)b++;});return[a,b];}
function cls(n){return n>=0?'pos':'neg';}

function fieldsHtml(){
  var h='<h3>Crop to sow</h3><div class="crops">';
  CROP_IDS.forEach(function(id){
    var c=CROPS[id];
    h+='<button type="button" class="crop'+(S.crop===id?' on':'')+'" data-act="crop:'+id+'"><b><i style="background:'+c.ripe+'"></i>'+c.name+'</b>'+
      '<small>Seed '+inr(c.seed)+' · grows '+c.grow+'s</small><small>'+c.yield+' units per row · std '+inr(c.base)+'</small><small>Seeds in bag: '+S.seeds[id]+'</small></button>';
  });
  h+='</div><div class="btns">';
  var sel=CROPS[S.crop];
  [20,96,200].forEach(function(n){
    h+='<button type="button" class="btn go" data-act="buy:'+S.crop+':'+n+'"'+(S.cash<sel.seed*n?' disabled':'')+'>Buy '+n+' '+sel.name+' · '+inr(sel.seed*n)+'</button>';
  });
  h+='</div><p class="muted">One plot has 96 rows. Each sown row uses one seed.</p>';
  h+='<h3>Land · '+ownedCount()+' of 9 plots owned</h3><div class="pmap">';
  PL.forEach(function(p){
    if(S.unlocked[p.id]){
      var pc=plotCounts(p.id);
      h+='<div class="pl open"><b>Plot '+(p.id+1)+'</b><small>'+pc[0]+' growing<br>'+pc[1]+' ready</small></div>';
    }else{
      var ok=canUnlock(p.id);
      h+='<div class="pl"><b>Plot '+(p.id+1)+'</b>'+(ok?'<button type="button" class="btn go" data-act="unlock:'+p.id+'"'+(S.cash<plotCost()?' disabled':'')+'>Buy '+inr(plotCost())+'</button>':'<small>Locked</small>')+'</div>';
    }
  });
  h+='</div><p class="muted">Each new plot costs '+inr(plotCost())+' now and rises by ₹1,000 every time. You can only buy a plot that touches land you own.</p>';
  h+='<h3>How a season works</h3><ol class="how"><li>Plough hard soil with the tractor.</li><li>Bury seeds with the seed drill.</li><li>Water the sown rows with the tanker (refill at the well).</li><li>Wait for rows to turn gold, then cut them with the harvester.</li><li>Unload at the godown, load the truck, sell at the Mandi.</li></ol>';
  return h;
}
function marketHtml(){
  var h='<h3>Mandi prices today</h3><table><tr><th>Crop</th><th>Godown</th><th>Price / unit</th></tr>';
  CROP_IDS.forEach(function(id){
    var c=CROPS[id],p=S.prices[id],up=p>=S.prev[id],gd=p>=c.base;
    h+='<tr><td>'+c.name+'<br><small class="muted">std '+inr1(c.base)+'</small></td><td class="num">'+Math.floor(S.godown[id])+'</td><td class="num '+(gd?'pos':'neg')+'">'+(up?'▲':'▼')+' '+inr1(p)+'</td></tr>';
  });
  h+='</table><p class="muted">Prices drift every day around a standard price. Green means above standard, so it is a good day to sell.</p>';
  h+='<h3>On the move</h3><table><tr><td>Harvester hopper</td><td class="num">'+Math.round(qty(S.veh.harvester.load))+' / '+HOPPER_CAP+'</td></tr>'+
     '<tr><td>Truck cargo</td><td class="num">'+Math.round(qty(S.veh.truck.load))+' / '+TRUCK_CAP+'</td></tr>'+
     '<tr><td>Water tank</td><td class="num">'+Math.round(S.veh.tanker.tank)+' / '+TANK_CAP+'</td></tr></table>';
  return h;
}
function booksHtml(){
  var c=calc(S),b=S.books,bal=Math.abs(c.assets-c.liab-c.equity)<.5;
  var h='<h3>Balance sheet · Day '+S.day+'</h3><table>'+
   '<tr><td>Cash</td><td class="num">'+inr(S.cash)+'</td></tr>'+
   '<tr><td>Seed stock</td><td class="num">'+inr(c.seedStock)+'</td></tr>'+
   '<tr><td>Crops in godown and vehicles</td><td class="num">'+inr(c.cropStock)+'</td></tr>'+
   '<tr><td>Land ('+ownedCount()+' plots)</td><td class="num">'+inr(S.land)+'</td></tr>'+
   '<tr><td>Machinery (after depreciation)</td><td class="num">'+inr(S.mach)+'</td></tr>'+
   '<tr class="tot"><td>Total assets</td><td class="num">'+inr(c.assets)+'</td></tr>'+
   '<tr><td>Loan owed</td><td class="num">'+inr(S.loan)+'</td></tr>'+
   '<tr><td>Opening capital</td><td class="num">'+inr(S.cap0)+'</td></tr>'+
   '<tr><td>Profit kept in the farm</td><td class="num '+cls(c.profit)+'">'+inr(c.profit)+'</td></tr>'+
   '<tr class="tot"><td>Loan + capital + profit</td><td class="num">'+inr(c.liab+c.equity)+'</td></tr>'+
   '<tr class="sub"><td>'+(bal?'Both sides match':'Both sides differ')+'</td><td class="num">'+(bal?'✓':inr(c.assets-c.liab-c.equity))+'</td></tr></table>';
  h+='<div class="btns"><button type="button" class="btn" data-act="loan:2000">Borrow ₹2,000</button><button type="button" class="btn" data-act="loan:-2000"'+(S.loan<=0?' disabled':'')+'>Repay ₹2,000</button></div>'+
     '<p class="muted">A loan costs 0.5% of the balance every day.</p>';
  h+='<h3>Profit and loss</h3><table>'+
   '<tr><td>Harvest value (standard price)</td><td class="num">'+inr(b.prod)+'</td></tr>'+
   '<tr><td>Market gain or loss on sales</td><td class="num '+cls(b.gain)+'">'+inr(b.gain)+'</td></tr>'+
   '<tr class="tot"><td>Total income</td><td class="num">'+inr(c.income)+'</td></tr>'+
   '<tr><td>Seeds used</td><td class="num">'+inr(b.seedsUsed)+'</td></tr>'+
   '<tr><td>Fuel and labour</td><td class="num">'+inr(b.fuel)+'</td></tr>'+
   '<tr><td>Loan interest</td><td class="num">'+inr(b.interest)+'</td></tr>'+
   '<tr><td>Machinery depreciation</td><td class="num">'+inr(b.depr)+'</td></tr>'+
   '<tr class="tot"><td>Net profit</td><td class="num '+cls(c.profit)+'">'+inr(c.profit)+'</td></tr>'+
   '<tr class="sub"><td>Cash received from sales</td><td class="num">'+inr(b.sales)+'</td></tr></table>';
  h+='<h3>Cash book</h3><div class="ledger"><table>';
  S.ledger.slice(0,16).forEach(function(l){
    h+='<tr><td>Day '+l.day+' · '+l.text+'</td><td class="num '+(l.amt?cls(l.amt):'')+'">'+(l.amt?inr(l.amt):'')+'</td></tr>';
  });
  h+='</table></div><div class="btns"><button type="button" class="btn" data-act="reset">Reset farm</button></div>';
  return h;
}
function renderPanel(force){
  var h=tab==='fields'?fieldsHtml():tab==='market'?marketHtml():booksHtml();
  if(h!==lastHtml||force){var body=$('pbody'),st=body.scrollTop;body.innerHTML=h;body.scrollTop=st;lastHtml=h;}
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){
    b.classList.toggle('on',b.getAttribute('data-act')==='tab:'+tab);
  });
}

/* fleet bar */
function buildFleet(){
  var h='';
  VEH.forEach(function(d,i){
    h+='<button type="button" data-v="'+d.id+'" title="'+d.name+'"><b><i style="background:'+d.color+'"></i><span>'+d.short+'</span><kbd>'+(i+1)+'</kbd></b><small id="fs-'+d.id+'"></small></button>';
  });
  $('fleet').innerHTML=h;
}
function updateFleet(){
  var c=counts();
  var st={tractor:c.hard+' rows to plough',seeder:c.plough+' ready · '+S.seeds[S.crop]+' seeds',
    tanker:'Tank '+Math.round(S.veh.tanker.tank)+'/'+TANK_CAP,harvester:'Hopper '+Math.round(qty(S.veh.harvester.load))+'/'+HOPPER_CAP,
    truck:'Cargo '+Math.round(qty(S.veh.truck.load))+'/'+TRUCK_CAP};
  Array.prototype.forEach.call(document.querySelectorAll('#fleet button'),function(b){
    var id=b.getAttribute('data-v');b.classList.toggle('on',id===S.sel);$('fs-'+id).textContent=st[id];
  });
  $('tip').textContent=VEH_BY[S.sel].name+': '+VEH_BY[S.sel].tip+' W/S drive · A/D steer · C camera';
}
function updateHud(){
  var c=calc(S);
  $('h-cash').textContent=inr(S.cash);$('h-day').textContent='Day '+S.day;
  $('h-bar').style.width=(S.t/DAYLEN*100)+'%';
  $('h-worth').textContent=inr(c.assets-c.liab);$('h-plots').textContent=ownedCount()+' / 9';
}
function uiTick(){updateHud();updateFleet();renderPanel();navUpdate();}

/* events */
$('fleet').addEventListener('click',function(e){var b=e.target.closest('button[data-v]');if(b)selectVeh(b.getAttribute('data-v'));});
$('panel').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act').split(':');
  if(a[0]==='tab'){tab=a[1];}
  else if(a[0]==='crop'){S.crop=a[1];}
  else if(a[0]==='buy'){buySeeds(a[1],+a[2]);}
  else if(a[0]==='unlock'){unlockPlot(+a[1]);}
  else if(a[0]==='loan'){loan(+a[1]);}
  else if(a[0]==='reset'){
    if(Date.now()-resetArm<4000){S=newState();save();resetArm=0;toast('New farm started');}
    else{resetArm=Date.now();toast('Tap Reset farm again within 4 seconds to confirm');}
  }
  uiTick();
});
$('bookbtn').addEventListener('click',function(){
  var p=$('panel'),open=p.classList.toggle('open');this.textContent=open?'Back to farm':'Farm book';
});
var drag=null,dragMoved=0;
cv.addEventListener('pointerdown',function(e){drag={x:e.clientX};dragMoved=0;});
window.addEventListener('pointermove',function(e){
  if(!drag)return;var dx=e.clientX-drag.x;drag.x=e.clientX;dragMoved+=Math.abs(dx);
  if(CAMS[camMode].k==='orbit')orbitA+=dx*.012;
});
window.addEventListener('pointerup',function(){drag=null;});
$('camBtn').addEventListener('click',cycleCam);
/* full screen: real fullscreen where the browser allows it, otherwise fill the window */
var fsBtn=$('fsBtn'),appEl=$('app'),pseudoFs=false;
function inFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement)||pseudoFs;}
function fsLabel(){fsBtn.textContent=inFs()?'✕ Exit full screen':'⛶ Full screen';setTimeout(resize,60);}
function enterFs(){
  var req=appEl.requestFullscreen||appEl.webkitRequestFullscreen;
  function fallback(){pseudoFs=true;appEl.classList.add('pseudo');fsLabel();}
  if(!req){fallback();return;}
  try{
    var r=req.call(appEl);
    if(r&&r.then)r.then(function(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});}catch(e){}},fallback);
  }catch(e){fallback();}
}
function exitFs(){
  if(pseudoFs){pseudoFs=false;appEl.classList.remove('pseudo');fsLabel();return;}
  var ex=document.exitFullscreen||document.webkitExitFullscreen;
  try{if(ex)ex.call(document);}catch(e){}
  try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
}
fsBtn.addEventListener('click',function(){if(inFs())exitFs();else enterFs();});
document.addEventListener('fullscreenchange',fsLabel);document.addEventListener('webkitfullscreenchange',fsLabel);
window.addEventListener('keydown',function(e){if(e.key==='Escape'&&pseudoFs)exitFs();});
cv.addEventListener('click',function(e){
  if(dragMoved>6){dragMoved=0;return;}
  var r=cv.getBoundingClientRect(),g=pick(e.clientX-r.left,e.clientY-r.top);if(!g)return;
  var tx=Math.floor(g[0]),ty=Math.floor(g[1]);
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return;
  var p=plotAt[ty*COLS+tx];if(p>=0&&!S.unlocked[p]){unlockPlot(p);uiTick();}
});

/* ---------- start ---------- */
S=load()||newState();
buildFleet();resize();
if('ResizeObserver' in window)new ResizeObserver(resize).observe($('stage'));else window.addEventListener('resize',resize);
renderPanel(true);uiTick();
setTimeout(function(){toast('Drive the Plough over the brown rows: W forward, A/D steer, C changes camera');},600);
setInterval(save,5000);
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
var last=performance.now(),acc=0;
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;lastDt=dt;
  step(dt);draw();acc+=dt;if(acc>.3){acc=0;uiTick();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__farm={get S(){return S;},step:step,keys:keys};
})();
