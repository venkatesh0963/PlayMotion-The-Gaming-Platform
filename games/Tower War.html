<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tower War</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Archivo:wght@400;600;700&display=swap">
<style>
/* Layout: one centred war-table column. Header strip, strength bar, square-ish canvas board, controls, level chips. Single dark look by choice. */
:root {
  --board: #12262a;
  --board-2: #183338;
  --ink: #e8efe9;
  --muted: #8fa5a0;
  --line: #2b4a4e;
  --blue: #6ec1ff;
  --red: #ff6a5a;
  --amber: #f4b13e;
  --neutral: #8a9a94;
  --panel: #0c1a1d;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--panel); color: var(--ink); }
body {
  font-family: var(--font-body);
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 34px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; text-wrap: balance; }
.lvl { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-align: right; min-width: 0; }
.lvl b { color: var(--ink); font-weight: 700; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; transition: width .25s linear; }
.board { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #e8c985; }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 360 / 560; touch-action: none; user-select: none; -webkit-user-select: none; }
.hint { font-size: 13px; line-height: 1.45; color: var(--muted); margin: 0; }
.hint b { color: var(--ink); font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: 600 13px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink); background: var(--board-2); border: 1px solid var(--line);
  padding: 11px 14px; border-radius: 6px; cursor: pointer; min-height: 40px;
}
button:hover { border-color: var(--blue); }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
button.primary { background: var(--blue); color: #06161c; border-color: var(--blue); }
button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { min-width: 40px; padding: 10px 0; text-align: center; }
.chips button[disabled] { opacity: .35; cursor: not-allowed; }
.chips button.cur { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; background: rgba(8, 18, 20, .82); text-align: center; padding: 24px;
}
.overlay[hidden] { display: none; }
.overlay h2 { font-family: var(--font-display); font-weight: 900; font-size: 46px; text-transform: uppercase; margin: 0; letter-spacing: .03em; line-height: 1; }
.overlay p { margin: 0; color: var(--muted); font-size: 14px; max-width: 28ch; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Tower War</h1>
    <div class="lvl" id="lvlLabel"></div>
  </header>
  <div class="bar" id="bar" aria-label="Soldier strength by side"><i id="bBlue" style="background:var(--blue)"></i><i id="bRed" style="background:var(--red)"></i><i id="bAmber" style="background:#a066e0"></i></div>
  <div class="board">
    <canvas id="cv" width="360" height="560" aria-label="Tower War battlefield"></canvas>
    <div class="overlay" id="overlay" hidden>
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <div class="row" style="justify-content:center">
        <button class="primary" id="ovBtn"></button>
        <button id="ovRetry">Replay</button>
      </div>
    </div>
  </div>
  <p class="hint"><b>Drag</b> from a blue tower to another tower to send soldiers. Each tower holds <b>2 lines</b> (the dots under it). A third line replaces the oldest. <b>Tap</b> a tower to clear its lines, or <b>swipe across</b> a route to cut it.</p>
  <div class="legend"><span><i style="background:var(--blue)"></i>You</span><span><i style="background:var(--red)"></i>Red army</span><span><i style="background:#a066e0"></i>Purple army</span><span><i style="background:var(--neutral)"></i>Unclaimed</span></div>
  <div class="row">
    <button id="restart">Restart</button>
    <button id="speed" aria-pressed="false">Speed x2</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<script>
(function () {
  var W = 360, H = 560;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var COLORS = { 0: '#8a9a94', 1: '#6ec1ff', 2: '#ff6a5a', 3: '#a066e0' };
  var SIZES = [
    { r: 20, cap: 30, grow: 1.1 },
    { r: 27, cap: 50, grow: 0.75 }
  ];
  // [x, y, owner, soldiers, size]
  var LEVELS = [
    { name: 'First Contact', t: [[180,470,1,20,1],[180,115,2,12,1],[85,290,0,6,0],[275,290,0,6,0]] },
    { name: 'Crossfire', t: [[90,480,1,20,1],[270,480,0,8,0],[180,360,0,10,0],[90,240,0,8,0],[270,240,2,10,0],[270,115,2,14,1]] },
    { name: 'Pincer', t: [[180,490,1,24,1],[60,390,0,8,0],[300,390,0,8,0],[180,300,0,12,1],[60,200,2,10,0],[300,200,2,10,0],[180,110,2,16,1]] },
    { name: 'Three Banners', t: [[180,490,1,24,1],[70,380,0,8,0],[290,380,0,8,0],[70,185,2,16,1],[290,185,3,16,1],[180,280,0,14,1],[180,110,0,10,0]] },
    { name: 'High Ground', t: [[70,490,1,24,1],[180,500,0,8,0],[290,490,0,8,0],[120,390,0,10,0],[240,390,0,10,0],[180,290,3,14,1],[70,190,2,14,0],[290,190,2,14,0],[180,110,2,22,1]] },
    { name: 'Last Bastion', t: [[180,510,1,28,1],[60,430,0,8,0],[300,430,0,8,0],[120,330,0,10,0],[240,330,0,10,0],[60,230,2,16,0],[300,230,3,16,0],[180,215,0,14,1],[120,115,2,20,1],[240,115,3,20,1]] },
    { name: 'Crossroads', t: [[180,505,1,26,1],[70,410,0,8,0],[290,410,0,8,0],[180,330,0,12,0],[70,240,2,14,0],[290,240,2,14,0],[180,140,2,22,1]] },
    { name: 'Twin Peaks', t: [[100,505,1,24,1],[260,505,1,10,0],[180,410,0,10,0],[60,300,0,10,0],[300,300,0,10,0],[110,190,2,18,1],[250,190,2,18,1],[180,115,2,12,0]] },
    { name: 'Gauntlet', t: [[180,510,1,28,1],[70,430,0,8,0],[290,430,0,8,0],[180,350,2,10,0],[70,270,2,12,0],[290,270,3,12,0],[180,190,0,12,1],[70,125,2,14,0],[290,125,3,14,0]] },
    { name: 'Three Kingdoms', t: [[180,510,1,28,1],[60,420,0,8,0],[300,420,0,8,0],[180,380,0,10,0],[60,290,2,16,1],[300,290,3,16,1],[180,270,0,14,0],[60,130,2,14,0],[300,130,3,14,0],[180,140,2,20,1]] },
    { name: 'Fortress Ring', t: [[180,505,1,30,1],[60,440,0,8,0],[300,440,0,8,0],[100,340,0,10,0],[260,340,0,10,0],[180,300,2,24,1],[60,230,2,14,0],[300,230,3,14,0],[120,130,3,18,0],[240,130,2,18,0]] },
    { name: 'Maze Runner', t: [[60,510,1,26,1],[180,510,0,10,0],[300,510,0,10,0],[120,420,2,12,0],[240,420,3,12,0],[60,330,0,10,0],[300,330,0,10,0],[180,310,2,20,1],[120,210,3,14,0],[240,210,2,14,0],[60,120,2,14,0],[300,120,3,14,0],[180,125,0,10,0]] },
    { name: 'Siege', t: [[180,505,1,32,1],[80,430,1,10,0],[280,430,0,8,0],[180,380,0,10,0],[60,300,2,18,1],[300,300,3,18,1],[180,260,2,22,1],[100,160,3,14,0],[260,160,2,14,0],[180,120,3,24,1]] },
    { name: 'Warlords', t: [[180,505,1,34,1],[70,440,0,10,0],[290,440,0,10,0],[180,400,0,12,0],[120,320,2,16,0],[240,320,3,16,0],[50,220,3,20,1],[310,220,2,20,1],[180,230,0,14,0],[120,125,2,20,1],[240,125,3,20,1]] },
    { name: 'Final Siege', t: [[180,505,1,36,1],[60,450,0,10,0],[300,450,0,10,0],[180,410,0,12,0],[100,320,2,18,0],[260,320,3,18,0],[180,300,2,26,1],[50,215,3,18,0],[310,215,2,18,0],[180,200,3,26,1],[110,115,2,20,1],[250,115,3,20,1]] }
  ];

  var best = 0;
  try { best = parseInt(localStorage.getItem('towerwar-best') || '0', 10) || 0; } catch (e) {}

  var level = 0, towers = [], soldiers = [], over = false, speed = 1, aiClock = 0, dashT = 0;
  var drag = null, swipe = null, ptr = { x: 0, y: 0 };

  function load(i) {
    level = i; over = false; soldiers = []; aiClock = 0;
    towers = LEVELS[i].t.map(function (d, k) {
      return { id: k, x: d[0], y: d[1], owner: d[2], n: d[3], s: SIZES[d[4]], gy: d[1] + (d[4] ? 27 : 22), outs: [], growT: 0, emitT: 0 };
    });
    drag = null; swipe = null;
    document.getElementById('overlay').hidden = true;
    document.getElementById('lvlLabel').innerHTML = 'Level <b>' + (i + 1) + '</b> / ' + LEVELS.length + '<br>' + LEVELS[i].name;
    buildChips();
  }

  function buildChips() {
    var c = document.getElementById('chips');
    c.innerHTML = '';
    LEVELS.forEach(function (_, i) {
      var b = document.createElement('button');
      b.textContent = i + 1;
      b.setAttribute('aria-label', 'Level ' + (i + 1));
      if (i > best) b.disabled = true;
      if (i === level) b.className = 'cur';
      b.onclick = function () { load(i); };
      c.appendChild(b);
    });
  }

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  var MAX_LINES = 2;

  function send(t, toId) {
    var to = towers[toId];
    var d = Math.hypot(to.x - t.x, to.gy - t.gy) || 1;
    var dx = (to.x - t.x) / d, dy = (to.gy - t.gy) / d;
    soldiers.push({
      owner: t.owner, from: t.id, to: toId,
      x: t.x + dx * t.s.r, y: t.gy + dy * t.s.r,
      sx: t.x + dx * t.s.r, sy: t.gy + dy * t.s.r,
      ex: to.x - dx * to.s.r, ey: to.gy - dy * to.s.r, p: 0
    });
  }

  function arrive(s) {
    var t = towers[s.to];
    if (t.owner === s.owner) { t.n++; return; }
    t.n--;
    if (t.n < 0) { t.owner = s.owner; t.n = 1; t.outs = []; }
  }

  function step(dt) {
    var i, j;
    towers.forEach(function (t) {
      t.growT += dt;
      if (t.owner !== 0 && t.growT >= t.s.grow) {
        t.growT = 0;
        if (t.n < t.s.cap) t.n++;
      }
      if (t.n > t.s.cap) { t.emitDecay = (t.emitDecay || 0) + dt; if (t.emitDecay > 1.2) { t.emitDecay = 0; t.n--; } }
      if (t.outs.length && t.owner !== 0) {
        t.emitT += dt;
        if (t.emitT >= 0.3) {
          t.emitT = 0;
          t.outs.forEach(function (id) {
            if (t.n > 1) { t.n--; send(t, id); }
          });
        }
      } else { t.emitT = 0; }
    });

    for (i = 0; i < soldiers.length; i++) {
      var s = soldiers[i];
      var len = Math.hypot(s.ex - s.sx, s.ey - s.sy) || 1;
      s.p += (70 * dt) / len;
      s.x = s.sx + (s.ex - s.sx) * Math.min(1, s.p);
      s.y = s.sy + (s.ey - s.sy) * Math.min(1, s.p);
    }
    // collisions between opposing soldiers
    for (i = 0; i < soldiers.length; i++) {
      var a = soldiers[i];
      if (a.dead) continue;
      for (j = i + 1; j < soldiers.length; j++) {
        var b = soldiers[j];
        if (b.dead || a.owner === b.owner) continue;
        if (Math.abs(a.x - b.x) < 5 && Math.abs(a.y - b.y) < 5) { a.dead = b.dead = true; break; }
      }
    }
    var alive = [];
    soldiers.forEach(function (s) {
      if (s.dead) return;
      if (s.p >= 1) { arrive(s); return; }
      alive.push(s);
    });
    soldiers = alive;

    // AI
    aiClock += dt;
    var interval = Math.max(0.7, 1.5 - level * 0.12);
    if (aiClock >= interval) {
      aiClock = 0;
      towers.forEach(function (t) {
        if (t.owner < 2) return;
        if (t.outs.length && t.n < 3) { t.outs = []; return; }
        t.outs = t.outs.filter(function (id) { return towers[id].owner !== t.owner; });
        var maxO = level >= 4 ? 2 : 1;
        if (t.n < 6 || t.outs.length >= maxO) return;
        if (t.outs.length && t.n < 12) return;
        var bestT = -1, bestScore = 1e9;
        towers.forEach(function (o) {
          if (o.owner === t.owner || t.outs.indexOf(o.id) >= 0) return;
          var sc = o.n + dist(t, o) / 28 + (o.owner === 1 ? -3 : 0) + Math.random() * 3;
          if (sc < bestScore) { bestScore = sc; bestT = o.id; }
        });
        if (bestT >= 0) t.outs.push(bestT);
      });
    }

    // end conditions
    var mine = towers.some(function (t) { return t.owner === 1; });
    var foes = towers.some(function (t) { return t.owner >= 2; });
    if (!mine) finish(false); else if (!foes) finish(true);
  }

  function finish(win) {
    over = true;
    var ov = document.getElementById('overlay');
    var title = document.getElementById('ovTitle');
    var txt = document.getElementById('ovText');
    var btn = document.getElementById('ovBtn');
    ov.hidden = false;
    if (win) {
      var last = level === LEVELS.length - 1;
      if (level + 1 > best && !last) {
        best = level + 1;
        try { localStorage.setItem('towerwar-best', String(best)); } catch (e) {}
      }
      title.textContent = last ? 'Kingdom won' : 'Level cleared';
      title.style.color = 'var(--blue)';
      txt.textContent = last ? 'Every tower flies your colour.' : 'All enemy towers are yours.';
      btn.textContent = last ? 'Play again' : 'Next level';
      btn.onclick = function () { load(last ? 0 : level + 1); };
    } else {
      title.textContent = 'Overrun';
      title.style.color = 'var(--red)';
      txt.textContent = 'You lost your last tower. Try a different route.';
      btn.textContent = 'Try again';
      btn.onclick = function () { load(level); };
    }
    buildChips();
  }

  // ---- input ----
  function toLocal(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }
  function towerAt(p, pad) {
    var f = null, bd = 1e9;
    towers.forEach(function (t) {
      var rx = t.s.r + 6 + pad, ry = t.s.r * 1.9 + pad;
      var d = Math.hypot((p.x - t.x) / rx, (p.y - (t.y - 8)) / ry);
      if (d <= 1 && d < bd) { bd = d; f = t; }
    });
    return f;
  }
  function segHit(a, b, c, d) {
    function ccw(p, q, r) { return (r.y - p.y) * (q.x - p.x) > (q.y - p.y) * (r.x - p.x); }
    return ccw(a, c, d) !== ccw(b, c, d) && ccw(a, b, c) !== ccw(a, b, d);
  }

  cv.addEventListener('pointerdown', function (e) {
    if (over) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    var p = toLocal(e); ptr = p;
    var t = towerAt(p, 10);
    if (t && t.owner === 1) { drag = { from: t, moved: false }; }
    else { swipe = { last: p }; }
  });
  cv.addEventListener('pointermove', function (e) {
    var p = toLocal(e);
    if (drag) {
      ptr = p;
      if (Math.hypot(p.x - drag.from.x, p.y - drag.from.y) > drag.from.s.r) drag.moved = true;
    } else if (swipe) {
      var a = swipe.last, b = p;
      towers.forEach(function (t) {
        if (t.owner !== 1 || !t.outs.length) return;
        t.outs = t.outs.filter(function (id) {
          var to = towers[id];
          return !segHit(a, b, { x: t.x, y: t.gy }, { x: to.x, y: to.gy });
        });
      });
      swipe.last = p; ptr = p;
    }
  });
  function endPtr(e) {
    var p = toLocal(e);
    if (drag) {
      var tgt = towerAt(p, 12);
      if (!drag.moved) { drag.from.outs = []; }
      else if (tgt && tgt !== drag.from && drag.from.outs.indexOf(tgt.id) < 0) {
        if (drag.from.outs.length >= MAX_LINES) drag.from.outs.shift();
        drag.from.outs.push(tgt.id);
      }
    }
    drag = null; swipe = null;
  }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', function () { drag = null; swipe = null; });

  // ---- drawing ----
  // Cartoon tower seen from a raised angle: stacked octagonal tiers (red or blue base, pale middle tiers with slit windows, coloured cap).
  var PAL = {
    0: { main: '#a9afb5', light: '#d3d8dc' },
    1: { main: '#3f8fe8', light: '#7dbcff' },
    2: { main: '#e23b3b', light: '#ff7a6b' },
    3: { main: '#8b4fd1', light: '#c19bf0' }
  };
  function shadeCol(hex, a) {
    var n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    var tg = a < 0 ? 0 : 255, p = Math.abs(a);
    r = Math.round(r + (tg - r) * p); g = Math.round(g + (tg - g) * p); b = Math.round(b + (tg - b) * p);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  // One octagonal prism: top face centred at (cx, cy), sides h tall, squashed by sq for the viewing angle.
  function tier(cx, cy, w, h, side, top, sq) {
    var rx = (w / 2) / 0.9239, ry = rx * sq, i, a;
    var A = [-22.5, 22.5, 67.5, 112.5, 157.5, 202.5], S = [-0.3, -0.15, 0, 0.06, -0.1], P = [];
    for (i = 0; i < 6; i++) { a = A[i] * Math.PI / 180; P.push({ x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) }); }
    ctx.lineJoin = 'round'; ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(40,24,20,0.5)';
    for (i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.moveTo(P[i].x, P[i].y); ctx.lineTo(P[i + 1].x, P[i + 1].y);
      ctx.lineTo(P[i + 1].x, P[i + 1].y + h); ctx.lineTo(P[i].x, P[i].y + h);
      ctx.closePath(); ctx.fillStyle = shadeCol(side, S[i]); ctx.fill(); ctx.stroke();
    }
    ctx.beginPath();
    for (i = 0; i < 8; i++) {
      a = (22.5 + 45 * i) * Math.PI / 180;
      var px = cx + rx * Math.cos(a), py = cy + ry * Math.sin(a);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fillStyle = top; ctx.fill(); ctx.stroke();
    return { rx: rx, ry: ry, fy: cy + ry * 0.9239 + h / 2 };
  }
  function slit(cx, cy, w, h) {
    ctx.fillStyle = '#2b2230';
    ctx.beginPath(); ctx.rect(cx - w / 2, cy - h / 2, w, h); ctx.fill();
  }

  function drawTower(t) {
    var P = PAL[t.owner], k = t.s.r > 22 ? 1.25 : 1, x = t.x, yb = t.gy;
    // ground shadow
    ctx.fillStyle = 'rgba(110,70,10,0.28)';
    ctx.beginPath(); ctx.ellipse(x + 9 * k, yb + 5 * k, 31 * k, 12 * k, 0, 0, 6.2832); ctx.fill();

    var base = tier(x, yb - 13 * k, 46 * k, 13 * k, P.main, '#e4e7eb', 0.5);
    // door
    var dw = base.rx * 0.34, dh = 9 * k, by = base.fy + 6.5 * k;
    ctx.fillStyle = '#2b2230';
    ctx.beginPath();
    ctx.moveTo(x - dw / 2, by); ctx.lineTo(x - dw / 2, by - dh + dw / 2);
    ctx.arc(x, by - dh + dw / 2, dw / 2, Math.PI, 0);
    ctx.lineTo(x + dw / 2, by); ctx.closePath(); ctx.fill();

    var mid = tier(x, yb - 27 * k, 34 * k, 14 * k, '#eef0f3', '#cfd5db', 0.5);
    slit(x, mid.fy, mid.rx * 0.55, 3.2 * k);
    var up = tier(x, yb - 41 * k, 31 * k, 14 * k, '#eef0f3', '#cfd5db', 0.5);
    slit(x, up.fy, up.rx * 0.55, 3.2 * k);
    var cap = tier(x, yb - 56 * k, 38 * k, 15 * k, P.main, P.light, 0.5);
    // two round windows on the cap
    ctx.fillStyle = shadeCol(P.light, 0.5);
    ctx.beginPath(); ctx.arc(x - cap.rx * 0.2, cap.fy, 2.6 * k, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(x + cap.rx * 0.2, cap.fy, 2.6 * k, 0, 6.2832); ctx.fill();

    // line pips under your towers: filled when a line is in use
    if (t.owner === 1) {
      for (var q = 0; q < MAX_LINES; q++) {
        ctx.beginPath(); ctx.arc(x - 7 + q * 14, yb + 14 * k, 3.6, 0, 6.2832);
        ctx.fillStyle = q < t.outs.length ? '#3f8fe8' : 'rgba(255,255,255,0.55)'; ctx.fill();
        ctx.lineWidth = 1.2; ctx.strokeStyle = '#2a1d1a'; ctx.stroke();
      }
    }
    // soldier count above the roof
    var ty = yb - 56 * k - cap.ry - 10 * k;
    ctx.font = '700 ' + Math.round(17 * k) + 'px Archivo, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 4.5; ctx.strokeStyle = '#2a1d1a';
    ctx.strokeText(String(t.n), x, ty);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(String(t.n), x, ty);
  }

  // Top-down soldier: shoulders, helmet and spear, rotated to the marching direction.
  function drawSoldier(s) {
    var col = COLORS[s.owner];
    var ang = Math.atan2(s.ey - s.sy, s.ex - s.sx);
    var sway = Math.sin(s.p * 70) * 0.6;
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(ang);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(1.5, 2, 3.4, 5.4, 0, 0, 6.2832); ctx.fill();
    // spear
    ctx.strokeStyle = '#d8d2bf'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(-1, 3.6); ctx.lineTo(9, 3.6 + sway * 0.3); ctx.stroke();
    ctx.fillStyle = '#f3f7f4';
    ctx.beginPath(); ctx.moveTo(9, 2.4); ctx.lineTo(12, 3.6); ctx.lineTo(9, 4.8); ctx.closePath(); ctx.fill();
    // shoulders / body (long axis across the heading)
    ctx.fillStyle = col; ctx.strokeStyle = 'rgba(8,18,20,0.9)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(0, sway * 0.2, 2.8, 5.2, 0, 0, 6.2832); ctx.fill(); ctx.stroke();
    // helmet
    ctx.fillStyle = '#d9dfdc';
    ctx.beginPath(); ctx.arc(0.8, 0, 2.6, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0.2, 0, 1.1, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#f1d797'); g.addColorStop(1, '#e0ba6b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(150,105,30,0.13)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x <= W; x += 30) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (var y = 0; y <= H; y += 30) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    towers.forEach(function (t) {
      if (t.owner === 0) return;
      t.outs.forEach(function (id) {
        var to = towers[id];
        ctx.save();
        ctx.strokeStyle = COLORS[t.owner]; ctx.globalAlpha = 0.65; ctx.lineWidth = 2.5;
        ctx.setLineDash([8, 6]); ctx.lineDashOffset = -dashT * 30;
        ctx.beginPath(); ctx.moveTo(t.x, t.gy); ctx.lineTo(to.x, to.gy); ctx.stroke();
        ctx.restore();
      });
    });

    if (drag && drag.moved) {
      ctx.save();
      ctx.strokeStyle = COLORS[1]; ctx.globalAlpha = 0.9; ctx.lineWidth = 2.5; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.moveTo(drag.from.x, drag.from.gy); ctx.lineTo(ptr.x, ptr.y); ctx.stroke();
      ctx.restore();
      var hov = towerAt(ptr, 12);
      if (hov && hov !== drag.from) {
        ctx.beginPath(); ctx.ellipse(hov.x, hov.gy, hov.s.r + 16, (hov.s.r + 16) * 0.5, 0, 0, 6.2832);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.strokeStyle = '#3a2a10'; ctx.lineWidth = 1; ctx.stroke();
      }
    }

    towers.slice().sort(function (a, b) { return a.y - b.y; }).forEach(drawTower);

    soldiers.forEach(drawSoldier);
  }

  function updateBar() {
    var tot = [0, 0, 0, 0];
    towers.forEach(function (t) { tot[t.owner] += t.n; });
    soldiers.forEach(function (s) { tot[s.owner]++; });
    var sum = tot[1] + tot[2] + tot[3] || 1;
    document.getElementById('bBlue').style.width = (tot[1] / sum * 100) + '%';
    document.getElementById('bRed').style.width = (tot[2] / sum * 100) + '%';
    document.getElementById('bAmber').style.width = (tot[3] / sum * 100) + '%';
  }

  // ---- sizing + loop ----
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = cv.clientWidth || W;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(w * (H / W) * dpr);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);

  var last = performance.now(), barT = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    dashT += dt;
    if (!over) {
      var steps = speed;
      for (var k = 0; k < steps && !over; k++) step(dt);
    }
    barT += dt;
    if (barT > 0.15) { barT = 0; updateBar(); }
    draw();
    requestAnimationFrame(frame);
  }

  document.getElementById('restart').onclick = function () { load(level); };
  document.getElementById('ovRetry').onclick = function () { load(level); };
  document.getElementById('speed').onclick = function () {
    speed = speed === 1 ? 2 : 1;
    this.setAttribute('aria-pressed', speed === 2 ? 'true' : 'false');
  };

  resize();
  load(0);
  requestAnimationFrame(frame);
})();
</script>

</body></html>
