<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stickman Dash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Permanent+Marker&display=swap">
<style>
  /* Layout: one centered column, a graph-paper canvas as the stage, stats above, thumb controls below.
     Single committed look (ink on blueprint paper), so no dark variant on purpose. */
  :root {
    --paper: #E8EDF1;
    --grid: #D3DBE3;
    --ink: #17202B;
    --hazard: #E4572E;
    --coin: #F2B134;
    --ground: #CBD5DE;
    --soft: #A9B6C3;
    --accent: #2F5BFF;
    --muted: #55626F;
    --font-display: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
    --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  html, body { height: auto; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-data);
    font-size: 14px;
    padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 7vw, 44px); line-height: 1; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
  .stats { display: flex; gap: 22px; margin: 0; padding: 0; }
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat dt { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .stat dd { margin: 0; font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .stage { border: 2px solid var(--ink); border-radius: 6px; background: var(--paper); overflow: hidden; line-height: 0; }
  canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 800 / 340; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    font: inherit; font-family: var(--font-display); font-size: 22px; letter-spacing: 0.03em;
    min-height: 64px; border: 2px solid var(--ink); border-radius: 6px; cursor: pointer;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .btn small { font-family: var(--font-data); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
  .btn.duck { background: var(--paper); color: var(--ink); }
  .btn.jump { background: var(--accent); color: #fff; border-color: var(--ink); }
  .btn:active, .btn.down { transform: translateY(2px); }
  .btn:focus-visible, canvas:focus-visible { outline: 3px solid var(--hazard); outline-offset: 2px; }
  .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; max-width: 65ch; }
  kbd { font-family: var(--font-data); font-size: 12px; border: 1px solid var(--soft); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: #F5F8FA; color: var(--ink); }
</style>

<div class="wrap">
  <header>
    <h1>Stickman Dash</h1>
    <dl class="stats" aria-live="off">
      <div class="stat"><dt>Distance</dt><dd><span id="sDist">0</span> m</dd></div>
      <div class="stat"><dt>Coins</dt><dd id="sCoins">0</dd></div>
      <div class="stat"><dt>Best</dt><dd id="sBest">0</dd></div>
    </dl>
  </header>

  <div class="stage"><canvas id="c" tabindex="0" aria-label="Stickman Dash game area. Press space to start and jump, down arrow to duck."></canvas></div>

  <div class="controls">
    <button type="button" id="bDuck" class="btn duck">Duck<small>hold</small></button>
    <button type="button" id="bJump" class="btn jump">Jump<small>hold to go higher</small></button>
  </div>

  <p class="hint"><kbd>Space</kbd> or <kbd>↑</kbd> to jump, <kbd>↓</kbd> to duck. Hop spikes and crates, slide under hanging beams, grab coins. Each coin is worth 10 points on top of your distance.</p>
</div>

<script>
(function () {
  var W = 800, H = 340, GY = H - 58, PX = 120;
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var cs = getComputedStyle(document.documentElement);
  function tok(n) { return cs.getPropertyValue(n).trim(); }
  var col = { paper: tok('--paper'), grid: tok('--grid'), ink: tok('--ink'), hazard: tok('--hazard'), coin: tok('--coin'), ground: tok('--ground'), soft: tok('--soft') };
  var elDist = document.getElementById('sDist'), elCoins = document.getElementById('sCoins'), elBest = document.getElementById('sBest');

  var scale = 1;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = cv.clientWidth || 600;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(w * H / W * dpr);
    scale = cv.width / W;
  }
  window.addEventListener('resize', resize);
  resize();

  var state = 'ready';
  var dist = 0, coinCount = 0, speed = 300, t = 0, deadAt = 0, bgX = 0;
  var py = 0, vy = 0, duckHeld = false, jumpHeld = false, ducking = false;
  var obs = [], coins = [], texts = [], gapLeft = 520;
  var best = 0;
  try { best = +localStorage.getItem('stickman-dash-best') || 0; } catch (e) {}
  var clouds = [{ x: 90, y: 50, s: 1 }, { x: 380, y: 78, s: 0.7 }, { x: 640, y: 40, s: 1.2 }];

  function score() { return Math.floor(dist) + coinCount * 10; }
  function hud() {
    elDist.textContent = Math.floor(dist);
    elCoins.textContent = coinCount;
    elBest.textContent = best;
  }

  function reset() {
    dist = 0; coinCount = 0; speed = 300; py = 0; vy = 0;
    obs = []; coins = []; texts = []; gapLeft = 520; ducking = false;
  }

  function jumpPress() {
    jumpHeld = true;
    if (state === 'ready') { reset(); state = 'run'; return; }
    if (state === 'dead') { if (performance.now() - deadAt > 500) { reset(); state = 'run'; } return; }
    if (py === 0) { vy = 860; py = 1; }
  }
  function jumpRelease() {
    jumpHeld = false;
    if (vy > 360) vy *= 0.5;
  }

  function spawn() {
    var r = Math.random(), o, i;
    if (r < 0.4) {
      var n = 1 + (Math.random() * 3 | 0);
      o = { k: 'spike', n: n, w: n * 26, h: 30 };
    } else if (r < 0.7) {
      o = { k: 'crate', w: 40, h: Math.random() < 0.3 ? 62 : 40 };
    } else {
      o = { k: 'bar', w: 90, h: 14 };
    }
    o.x = W + 40;
    o.y = o.k === 'bar' ? GY - 64 : GY - o.h;
    obs.push(o);
    if (Math.random() < 0.65) {
      if (o.k === 'bar') {
        for (i = 0; i < 3; i++) coins.push({ x: o.x + 14 + i * 31, h: 20, p: Math.random() * 6 });
      } else {
        var mid = o.x + o.w / 2, hs = [80, 108, 80];
        for (i = 0; i < 3; i++) coins.push({ x: mid + (i - 1) * 34, h: hs[i] + (o.h > 40 ? 20 : 0), p: Math.random() * 6 });
      }
    }
  }

  function update(dt) {
    speed = Math.min(640, 300 + dist * 1.2);
    var g = (duckHeld && py > 0) ? 7000 : 2500;
    if (py > 0 || vy > 0) {
      vy -= g * dt; py += vy * dt;
      if (py <= 0) { py = 0; vy = 0; }
    }
    ducking = duckHeld && py === 0;
    dist += speed * dt / 40;
    bgX += speed * dt;

    gapLeft -= speed * dt;
    if (gapLeft <= 0) { spawn(); gapLeft = speed * (0.85 + Math.random() * 0.7) + 170; }

    var i, o, c;
    for (i = obs.length - 1; i >= 0; i--) { obs[i].x -= speed * dt; if (obs[i].x + obs[i].w < -60) obs.splice(i, 1); }
    for (i = coins.length - 1; i >= 0; i--) { coins[i].x -= speed * dt; if (coins[i].x < -30) coins.splice(i, 1); }
    for (i = texts.length - 1; i >= 0; i--) { texts[i].life -= dt; texts[i].y -= 40 * dt; texts[i].x -= speed * dt * 0.2; if (texts[i].life <= 0) texts.splice(i, 1); }

    var ph = ducking ? 40 : 72;
    var pl = PX - 10, pr = PX + 10, pt = GY - py - ph + 5, pb = GY - py - 2;

    for (i = 0; i < obs.length; i++) {
      o = obs[i];
      var ox = o.x, ow = o.w, oy = o.y, oh = o.h;
      if (o.k === 'spike') { ox += 4; ow -= 8; oy += 8; oh -= 8; }
      if (pr > ox && pl < ox + ow && pb > oy && pt < oy + oh) { die(); return; }
    }
    for (i = coins.length - 1; i >= 0; i--) {
      c = coins[i];
      var cy = GY - c.h;
      var nx = Math.max(pl, Math.min(c.x, pr)), ny = Math.max(pt, Math.min(cy, pb));
      var dx = c.x - nx, dy = cy - ny;
      if (dx * dx + dy * dy < 100) {
        coinCount++; texts.push({ x: c.x, y: cy - 10, life: 0.7 }); coins.splice(i, 1);
      }
    }
  }

  function die() {
    state = 'dead'; deadAt = performance.now();
    var s = score();
    if (s > best) {
      best = s;
      try { localStorage.setItem('stickman-dash-best', String(best)); } catch (e) {}
    }
  }

  /* ---------- drawing ---------- */
  function drawStick(x, gy, ph, pose) {
    ctx.save();
    ctx.translate(x, gy);
    ctx.strokeStyle = col.ink; ctx.fillStyle = col.paper; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var head, sh, hip, legs, arms, i;
    if (pose === 'dead') { ctx.translate(-4, -8); ctx.rotate(-Math.PI / 2); }
    if (pose === 'duck') {
      head = [11, -34]; sh = [5, -26]; hip = [-6, -16];
      legs = [[[8, -10], [22, -3]], [[1, -8], [10, -2]]];
      arms = [[[16, -18], [27, -20]], [[14, -14], [23, -9]]];
    } else if (pose === 'air') {
      hip = [0, -34]; sh = [2, -56]; head = [4, -67];
      legs = [[[11, -24], [3, -12]], [[-8, -26], [-16, -15]]];
      arms = [[[13, -63], [18, -74]], [[-9, -62], [-13, -73]]];
    } else {
      var p = pose === 'idle' ? Math.sin(ph * 1.5) * 0.25 + 0.4 : ph;
      var amp = pose === 'idle' ? 0.25 : 0.6;
      legs = []; var maxY = 0;
      for (i = 0; i < 2; i++) {
        var pp = p + i * Math.PI;
        var a = Math.sin(pp) * amp;
        var bend = pose === 'idle' ? 0.1 : Math.max(0, Math.cos(pp)) * 1.1;
        var kx = Math.sin(a) * 15, ky = Math.cos(a) * 15;
        var fx = kx + Math.sin(a - bend) * 15, fy = ky + Math.cos(a - bend) * 15;
        legs.push([[kx, ky], [fx, fy]]);
        if (fy > maxY) maxY = fy;
      }
      var hy = maxY;
      hip = [0, -hy]; sh = [2, -hy - 22]; head = [4, -hy - 33];
      for (i = 0; i < 2; i++) {
        legs[i][0][1] -= hy; legs[i][1][1] -= hy;
      }
      arms = [];
      for (i = 0; i < 2; i++) {
        var ang = Math.sin(p + i * Math.PI + Math.PI) * (pose === 'idle' ? 0.2 : 0.9);
        var ex = sh[0] + Math.sin(ang) * 12, ey = sh[1] + Math.cos(ang) * 12;
        var hx = ex + Math.sin(ang + 1.0) * 11, hyy = ey + Math.cos(ang + 1.0) * 11;
        arms.push([[ex, ey], [hx, hyy]]);
      }
    }
    ctx.beginPath();
    ctx.moveTo(sh[0], sh[1]); ctx.lineTo(hip[0], hip[1]);
    for (i = 0; i < 2; i++) {
      ctx.moveTo(hip[0], hip[1]); ctx.lineTo(legs[i][0][0] + (pose === 'duck' || pose === 'air' ? 0 : 0), legs[i][0][1] + (pose === 'duck' || pose === 'air' ? 0 : 0));
      ctx.lineTo(legs[i][1][0], legs[i][1][1]);
      ctx.moveTo(sh[0], sh[1]); ctx.lineTo(arms[i][0][0], arms[i][0][1]); ctx.lineTo(arms[i][1][0], arms[i][1][1]);
    }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(head[0], head[1], 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 2.5; ctx.beginPath();
    if (pose === 'dead') {
      ctx.moveTo(head[0] + 1, head[1] - 4); ctx.lineTo(head[0] + 6, head[1] + 1);
      ctx.moveTo(head[0] + 6, head[1] - 4); ctx.lineTo(head[0] + 1, head[1] + 1);
    } else {
      ctx.moveTo(head[0] + 4, head[1] - 2); ctx.lineTo(head[0] + 4, head[1] + 1);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawBg() {
    ctx.fillStyle = col.paper; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = col.grid; ctx.lineWidth = 1; ctx.beginPath();
    var off = bgX % 40, x, y;
    for (x = -off; x <= W; x += 40) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, H); }
    for (y = 20; y <= H; y += 40) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();

    ctx.strokeStyle = col.soft; ctx.lineWidth = 2; ctx.lineCap = 'round';
    var c, i;
    for (i = 0; i < clouds.length; i++) {
      c = clouds[i];
      var cx = ((c.x - bgX * 0.12 * c.s) % (W + 160) + (W + 160)) % (W + 160) - 80;
      ctx.beginPath();
      ctx.arc(cx, c.y, 12 * c.s, Math.PI, 0); ctx.arc(cx + 18 * c.s, c.y - 4 * c.s, 15 * c.s, Math.PI, 0); ctx.arc(cx + 38 * c.s, c.y, 11 * c.s, Math.PI, 0);
      ctx.stroke();
    }
    var ho = bgX * 0.3;
    ctx.beginPath();
    for (x = 0; x <= W; x += 8) {
      var hy = GY - 34 - (Math.sin((x + ho) * 0.012) * 16 + Math.sin((x + ho) * 0.031) * 6);
      if (x === 0) ctx.moveTo(x, hy); else ctx.lineTo(x, hy);
    }
    ctx.stroke();

    ctx.fillStyle = col.ground; ctx.fillRect(0, GY, W, H - GY);
    ctx.strokeStyle = col.ink; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, GY); ctx.lineTo(W, GY); ctx.stroke();
    ctx.strokeStyle = col.soft; ctx.lineWidth = 2; ctx.beginPath();
    var go = bgX % 32;
    for (x = -go; x < W; x += 32) { ctx.moveTo(x, GY + 12); ctx.lineTo(x - 10, GY + 24); }
    for (x = -((bgX * 1.0) % 64) + 20; x < W; x += 64) { ctx.moveTo(x, GY + 36); ctx.lineTo(x - 10, GY + 46); }
    ctx.stroke();
  }

  function drawObs() {
    var i, j, o;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (i = 0; i < obs.length; i++) {
      o = obs[i];
      if (o.k === 'spike') {
        ctx.fillStyle = col.hazard; ctx.strokeStyle = col.ink; ctx.lineWidth = 3;
        for (j = 0; j < o.n; j++) {
          var sx = o.x + j * 26;
          ctx.beginPath(); ctx.moveTo(sx + 1, GY); ctx.lineTo(sx + 13, GY - 30); ctx.lineTo(sx + 25, GY); ctx.closePath(); ctx.fill(); ctx.stroke();
        }
      } else if (o.k === 'crate') {
        ctx.fillStyle = col.paper; ctx.strokeStyle = col.ink; ctx.lineWidth = 3;
        ctx.fillRect(o.x, o.y, o.w, o.h); ctx.strokeRect(o.x, o.y, o.w, o.h);
        ctx.lineWidth = 2; ctx.beginPath();
        for (j = 0; j < o.h; j += 40) {
          ctx.moveTo(o.x, o.y + j); ctx.lineTo(o.x + o.w, o.y + Math.min(j + 40, o.h));
          ctx.moveTo(o.x + o.w, o.y + j); ctx.lineTo(o.x, o.y + Math.min(j + 40, o.h));
        }
        ctx.stroke();
      } else {
        ctx.strokeStyle = col.ink; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(o.x + 8, 0); ctx.lineTo(o.x + 8, o.y); ctx.moveTo(o.x + o.w - 8, 0); ctx.lineTo(o.x + o.w - 8, o.y);
        ctx.stroke();
        ctx.fillStyle = col.hazard; ctx.lineWidth = 3;
        ctx.fillRect(o.x, o.y, o.w, o.h); ctx.strokeRect(o.x, o.y, o.w, o.h);
        ctx.save(); ctx.beginPath(); ctx.rect(o.x, o.y, o.w, o.h); ctx.clip();
        ctx.strokeStyle = col.paper; ctx.lineWidth = 4; ctx.beginPath();
        for (j = -14; j < o.w; j += 18) { ctx.moveTo(o.x + j, o.y + o.h); ctx.lineTo(o.x + j + 14, o.y); }
        ctx.stroke(); ctx.restore();
      }
    }
    for (i = 0; i < coins.length; i++) {
      var c = coins[i], cy = GY - c.h, sw = Math.abs(Math.cos(t * 5 + c.p)) * 8 + 2;
      ctx.fillStyle = col.coin; ctx.strokeStyle = col.ink; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(c.x, cy, sw, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = col.ink; ctx.font = "16px 'Permanent Marker', cursive"; ctx.textAlign = 'center';
    for (i = 0; i < texts.length; i++) {
      ctx.globalAlpha = Math.min(1, texts[i].life * 2);
      ctx.fillText('+10', texts[i].x, texts[i].y);
    }
    ctx.globalAlpha = 1;
  }

  function banner(title, sub) {
    ctx.textAlign = 'center';
    ctx.fillStyle = col.ink; ctx.font = "40px 'Permanent Marker', cursive";
    ctx.fillText(title, W / 2, 112);
    ctx.font = "500 15px 'IBM Plex Mono', monospace";
    ctx.fillText(sub, W / 2, 142);
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawBg();
    drawObs();
    var gy = GY - py;
    if (state === 'dead') drawStick(PX, GY, 0, 'dead');
    else if (state === 'ready') drawStick(PX, GY, t, 'idle');
    else if (py > 0) drawStick(PX, gy, 0, 'air');
    else if (ducking) drawStick(PX, GY, 0, 'duck');
    else drawStick(PX, GY, t * (7 + speed / 90), 'run');

    if (state === 'ready') banner('Ready?', 'Tap the stage or press Space to run');
    if (state === 'dead') banner('Tripped!', score() + ' pts · ' + Math.floor(dist) + ' m · ' + coinCount + ' coins   |   tap to retry');
    hud();
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
    if (state === 'run') update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- input ---------- */
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
      e.preventDefault(); if (!e.repeat) jumpPress();
    } else if (k === 'ArrowDown' || k === 's' || k === 'S') {
      e.preventDefault(); duckHeld = true;
    } else if (k === 'Enter' && state !== 'run') {
      e.preventDefault(); jumpPress(); jumpRelease();
    }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') jumpRelease();
    else if (k === 'ArrowDown' || k === 's' || k === 'S') duckHeld = false;
  });
  window.addEventListener('blur', function () { duckHeld = false; jumpHeld = false; });

  function hold(el, down, up, cls) {
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); el.classList.add('down'); down(); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) {
      el.addEventListener(n, function () { if (el.classList.contains('down')) { el.classList.remove('down'); up(); } });
    });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  hold(document.getElementById('bJump'), jumpPress, jumpRelease);
  hold(document.getElementById('bDuck'), function () { duckHeld = true; }, function () { duckHeld = false; });
  hold(cv, jumpPress, jumpRelease);
  cv.focus({ preventScroll: true });
})();
</script>

</body></html>
