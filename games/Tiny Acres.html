<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tiny Acres</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D diorama; crop cards float on top, one control panel docks at the bottom. */
:root{
  --bg:#dfe8d2; --panel:#f2f4ec; --ink:#24301f; --muted:#667360; --line:#d3dac8;
  --accent:#5c8a3a; --accent-ink:#ffffff; --coin:#a8701f; --chip:#e4e9da; --sel:#24301f; --sel-ink:#f2f4ec;
  --bad:#b4472f; --good:#3f7d34;
  --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#162018; --panel:#222b20; --ink:#e7eddb; --muted:#9aa793; --line:#323d2f;
  --accent:#8fbf62; --accent-ink:#14200d; --coin:#e0aa52; --chip:#2c372a; --sel:#e7eddb; --sel-ink:#222b20;
  --bad:#e5846c; --good:#8fcf7f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#162018; --panel:#222b20; --ink:#e7eddb; --muted:#9aa793; --line:#323d2f;
  --accent:#8fbf62; --accent-ink:#14200d; --coin:#e0aa52; --chip:#2c372a; --sel:#e7eddb; --sel-ink:#222b20;
  --bad:#e5846c; --good:#8fcf7f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.3 var(--sans);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#app{position:relative;height:100%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#ui{position:relative;height:100%;display:flex;flex-direction:column;pointer-events:none}
#ui>*{pointer-events:auto}
h1{font:600 28px/1.1 var(--serif);margin:8px 0 8px;letter-spacing:-.01em;pointer-events:none}
#cropbar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.crop{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 12px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);border-radius:10px;font:inherit;text-align:left;cursor:pointer;min-width:0}
.crop b{font-weight:600}
.crop small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.crop .px{font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.crop.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.crop.on small{color:inherit;opacity:.75}
.up{color:var(--good)}.dn{color:var(--bad)}.crop.on .up,.crop.on .dn{color:inherit}
#side{position:absolute;right:0;top:42%;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.sq{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 22px var(--sans);cursor:pointer}
.sq.off{opacity:.45;text-decoration:line-through}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--panelh,200px) + 14px);background:var(--sel);color:var(--sel-ink);
  padding:7px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:normal;text-align:center;width:max-content;max-width:min(92%,420px)}
#toast.show{opacity:1}
#panel{margin-top:auto;margin-bottom:max(10px,env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:12px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#money{font:600 34px/1.05 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums;margin-top:6px}
.right{text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
#speeds{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.sp{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.sp.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stockrow{display:grid;gap:6px}
.stockrow .t{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
#chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:99px;padding:3px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.btn{padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 14px var(--sans);cursor:pointer;min-width:0}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#drawer{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.upg{display:flex;justify-content:space-between;align-items:center;gap:10px}
.upg span{font-size:13px;min-width:0}.upg small{display:block;color:var(--muted)}
.upg .btn{padding:8px 12px;white-space:nowrap}
.hint{font-size:12px;color:var(--muted)}
#vehbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.vb{padding:7px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 12px var(--sans);cursor:pointer;min-width:0}
.vb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#joy{position:absolute;left:0;bottom:calc(var(--panelh,200px) + 14px);width:124px;height:124px;border-radius:50%;background:var(--panel);border:1px solid var(--line);opacity:.92;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);pointer-events:none}
#actbtn{position:absolute;right:0;bottom:calc(var(--panelh,200px) + 14px);padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#app[data-drive] #toast{bottom:calc(var(--panelh,200px) + 150px)}
@media(max-width:420px){h1{font-size:25px}.acts{grid-template-columns:1fr 1fr}.acts .pri{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="app">
<canvas id="cv" aria-label="Rotatable 3D farm. Tap a plot to plant, harvest or buy land."></canvas>
<div id="ui">
  <h1>Tiny Acres</h1>
  <div id="cropbar"></div>
  <div id="vehbar" aria-label="Choose a vehicle to drive">
    <button class="vb on" data-v="">Auto</button><button class="vb" data-v="farmer">Farmer</button><button class="vb" data-v="tractor">Tractor</button><button class="vb" data-v="harvester">Harvester</button><button class="vb" data-v="truck">Truck</button>
  </div>
  <div id="side">
    <button class="sq" id="zin" aria-label="Zoom in">+</button>
    <button class="sq" id="zout" aria-label="Zoom out">&minus;</button>
    <button class="sq" id="zreset" aria-label="Reset view">&#10530;</button>
    <button class="sq" id="snd" aria-label="Sound on" title="Sound">&#9834;</button>
  </div>
  <div id="toast" role="status"></div>
  <div id="joy" hidden aria-label="Move stick"><div id="knob"></div></div>
  <button class="btn pri" id="actbtn" hidden>Hop in</button>
  <div id="panel">
    <div class="row">
      <div><div class="lbl">The Farmhand</div><div id="money">$0</div></div>
      <div>
        <div id="speeds"><button class="sp" data-s="0">Pause</button><button class="sp on" data-s="1">1&times;</button><button class="sp" data-s="2">2&times;</button><button class="sp" data-s="4">4&times;</button></div>
        <div class="right" id="clock"></div><div class="right" id="pop"></div>
      </div>
    </div>
    <div class="stockrow">
      <div class="t"><span>Barn <b id="stocktxt"></b></span><span class="hint" id="hint"></span></div>
      <div class="bar"><i id="stockbar"></i></div>
      <div id="chips"></div>
      <div class="hint" id="drivehint" hidden></div>
    </div>
    <div class="acts">
      <button class="btn pri" id="truckbtn">Send truck</button>
      <button class="btn" id="harvestbtn">Harvest all</button>
      <button class="btn" id="upbtn">Upgrades</button>
    </div>
    <div id="drawer" hidden></div>
  </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), app=$('app');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xbfe3f5);
const camera=new THREE.PerspectiveCamera(38,1,0.5,120);
const hemi=new THREE.HemisphereLight(0xffffff,0x6b7a55,0.6); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d6,1); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:18,bottom:-18,near:1,far:80});
sun.shadow.bias=-0.0006; scene.add(sun,sun.target);
const M=(c)=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,mat,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m}

// ---- cutaway block
box(60,0.6,33,M(0x8fc06a),-8,-0.3,3.5).castShadow=false;
box(60,0.5,33,M(0x8a6240),-8,-0.85,3.5);
box(60,0.6,33,M(0x7b7f86),-8,-1.4,3.5);
box(16.02,0.05,11.02,M(0x6a9a48),0,-0.02,0).visible=false;
// pond
const pond=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,0.05,28),new THREE.MeshLambertMaterial({color:0x6fb4d8}));
pond.position.set(6.3,0.01,-3.9);pond.scale.z=0.75;pond.receiveShadow=true;scene.add(pond);
// roads
const roadMat=M(0xb59a74);
box(60,0.05,1.3,roadMat,-8,0.02,4.3).castShadow=false;
box(1,0.05,3.7,roadMat,5,0.02,2.5).castShadow=false;
for(let x=-37.4;x<21.5;x+=1.2) box(0.5,0.06,0.07,M(0xe9ddc0),x,0.04,4.3).castShadow=false;

// ---- plots (two player fields)
const PITCH=1.7,G0COLS=5,PLOTPOS=[];
[{x0:-5.6,cols:5,rows:8,z0:1.3,d:-1},{x0:9.9,cols:6,rows:8,z0:1.3,d:-1},{x0:-5.6,cols:5,rows:3,z0:7.2,d:1},{x0:9.9,cols:6,rows:3,z0:7.2,d:1}].forEach(f=>{for(let r=0;r<f.rows;r++)for(let c=0;c<f.cols;c++)PLOTPOS.push({x:f.x0+c*PITCH,z:f.z0+f.d*r*PITCH})});
const NPLOTS=PLOTPOS.length,plotMeshes=[];
PLOTPOS.forEach((q,i)=>{const m=box(1.5,0.1,1.5,new THREE.MeshLambertMaterial({color:0x9fcd78,emissive:0x000000}),q.x,0.05,q.z);m.userData.idx=i;m.castShadow=false;plotMeshes.push(m)});

// ---- crops
const CROPS={
 wheat:{name:'Wheat',seed:2,grow:12,base:5,from:0x7cae4a,to:0xe3b94a},
 corn:{name:'Corn',seed:4,grow:22,base:11,from:0x6aa83f,to:0xf0cf3c},
 tomato:{name:'Tomato',seed:6,grow:32,base:18,from:0x5f9f3c,to:0xd9442f},
 pumpkin:{name:'Pumpkin',seed:10,grow:50,base:36,from:0x6fa23c,to:0xe8872a},
};
const KEYS=Object.keys(CROPS);
function makeCrop(k){
  const g=new THREE.Group(), tint=[], cc=CROPS[k];
  const add=(geo,x,y,z,col,ripe)=>{const mat=new THREE.MeshLambertMaterial({color:cc.from});
    const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;g.add(m);
    tint.push({mat,from:new THREE.Color(col),to:new THREE.Color(ripe)});return m};
  const leaf=0x4f8f35;
  if(k==='wheat'){for(let i=0;i<9;i++){const x=(i%3-1)*0.34+(Math.random()-.5)*.1,z=(Math.floor(i/3)-1)*0.34+(Math.random()-.5)*.1;
      add(new THREE.BoxGeometry(0.07,0.55,0.07),x,0.3,z,0x6fa244,0xd9aa3c);
      add(new THREE.BoxGeometry(0.1,0.2,0.1),x,0.62,z,0x86b24f,0xf0c75a);}}
  if(k==='corn'){for(let i=0;i<4;i++){const x=(i%2-.5)*0.6,z=(Math.floor(i/2)-.5)*0.6;
      add(new THREE.CylinderGeometry(0.06,0.08,0.9,6),x,0.5,z,0x5f9b3a,0x9aa650);
      add(new THREE.BoxGeometry(0.16,0.3,0.16),x+0.1,0.6,z,0x9cc15a,0xf0cf3c);}}
  if(k==='tomato'){for(let i=0;i<4;i++){const x=(i%2-.5)*0.65,z=(Math.floor(i/2)-.5)*0.65;
      add(new THREE.SphereGeometry(0.28,8,6),x,0.3,z,leaf,0x4a8a33);
      add(new THREE.SphereGeometry(0.11,8,6),x+0.12,0.42,z+0.18,0x8cbc4f,0xd9442f);
      add(new THREE.SphereGeometry(0.1,8,6),x-0.15,0.3,z+0.2,0x8cbc4f,0xd9442f);}}
  if(k==='pumpkin'){for(let i=0;i<3;i++){const x=(i-1)*0.5,z=(i%2?.2:-.2);
      const p=add(new THREE.SphereGeometry(0.3,10,8),x,0.22,z,0x8fb04a,0xe8872a);p.scale.y=0.72;
      add(new THREE.BoxGeometry(0.06,0.14,0.06),x,0.5,z,0x4f7f2f,0x5b6f2a);}}
  g.userData.tint=tint; g.userData.p=-1; return g;
}
function setGrowth(g,p){
  g.scale.set(0.35+0.65*p,0.15+0.85*p,0.35+0.65*p);
  const q=Math.round(p*20)/20; if(g.userData.p===q) return; g.userData.p=q;
  const t=Math.max(0,(p-0.55)/0.45);
  for(const o of g.userData.tint) o.mat.color.copy(o.from).lerp(o.to,t);
}

// ---- barn
const barn=new THREE.Group(); barn.position.set(5,0,-0.3); scene.add(barn);
box(2.0,1.1,1.9,M(0xc2503a),0,0.55,0,barn);
{const sh=new THREE.Shape();sh.moveTo(-1.15,0);sh.lineTo(1.15,0);sh.lineTo(0,0.8);sh.closePath();
 const r=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:2.1,bevelEnabled:false}),M(0x7d5a44));
 r.position.set(0,1.1,-1.05);r.castShadow=true;barn.add(r);}
box(0.7,0.8,0.05,M(0x5b3a2b),0,0.4,0.96,barn);
box(0.08,0.8,0.06,M(0xf1e6cf),0,0.4,0.99,barn);
const silo=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.8,14),M(0xd9d6cc));silo.position.set(-1.5,0.9,-0.3);silo.castShadow=true;barn.add(silo);
const dome=new THREE.Mesh(new THREE.SphereGeometry(0.4,14,8,0,Math.PI*2,0,Math.PI/2),M(0x9aa0a8));dome.position.set(-1.5,1.8,-0.3);barn.add(dome);

// ---- market stall
const mk=new THREE.Group(); mk.position.set(-34.5,0,2.7); scene.add(mk);
box(1.4,0.5,0.6,M(0xb98a5a),0,0.25,0.2,mk);
for(const sx of[-0.65,0.65]) box(0.07,1.1,0.07,M(0x6b4a33),sx,0.55,-0.3,mk), box(0.07,1.1,0.07,M(0x6b4a33),sx,0.55,0.5,mk);
for(let i=0;i<6;i++) box(0.27,0.05,1.0,M(i%2?0xf2efe4:0xd25f4a),-0.67+i*0.268,1.12,0.1,mk).rotation.x=-0.12;
for(let i=0;i<4;i++) box(0.22,0.18,0.22,M(i%2?0xe3a63d:0xd9442f),-0.45+i*0.3,0.6,0.2,mk);

// ---- trees (fixed seed) kept clear of fields, buildings, road and village
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
function tree(x,z,s){const t=new THREE.Group();t.position.set(x,0,z);t.scale.setScalar(s);
  box(0.16,0.5,0.16,M(0x7a5a3d),0,0.25,0,t);
  const c=new THREE.Mesh(new THREE.IcosahedronGeometry(0.5,0),M(0x5c9a45));c.position.y=0.85;c.castShadow=true;t.add(c);scene.add(t)}
const KEEPOUT=[[-6.9,2.6,-12.5,2.5],[8.7,19.8,-12.5,2.5],[2.4,7.6,-2.8,4.2],[5,7.6,-5,-2.8],[-18,-11.3,-5,2.9],[-28.6,-21.7,-5,2.9],[-38,-29.5,-13,5.5],[-38,22,3.3,5.2],[-6.9,2.6,5.4,12],[8.7,19.8,5.4,12],[-20.5,-10.5,5.4,15.5],[3.8,6.2,4.9,7],[-12,-7,-9.3,-0.7],[6.4,9.2,-2.2,1.6]];
for(let i=0;i<230;i++){const x=-37.6+rnd()*59,z=-12.6+rnd()*32,s=0.8+rnd()*0.6;
  if(KEEPOUT.some(r=>x>r[0]&&x<r[1]&&z>r[2]&&z<r[3]))continue;tree(x,z,s)}
for(let x=-37.2;x<21.5;x+=1.7){tree(x,-12.6,0.85+rnd()*0.2);tree(x,19.4,0.85+rnd()*0.2)}

// ---- truck
const truck=new THREE.Group(); scene.add(truck);
box(0.55,0.32,0.4,M(0x3f6fa6),0.3,0.3,0,truck);
box(0.3,0.26,0.36,M(0xcfe6f3),0.42,0.5,0,truck);
box(0.9,0.12,0.44,M(0x8b6a4a),-0.35,0.2,0,truck);
for(const[x,z]of[[0.35,0.22],[0.35,-0.22],[-0.55,0.22],[-0.55,-0.22]]){const w=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.08,10),M(0x222222));w.rotation.x=Math.PI/2;w.position.set(x,0.11,z);truck.add(w)}
const crates=[];const crateCols=[0xd9aa3c,0xe3a63d,0xd9442f,0xe8872a];
for(let i=0;i<8;i++){const c=box(0.2,0.2,0.2,M(crateCols[i%4]),-0.6+(i%4)*0.22,0.36+(i>3?0.2:0),(i%2?0.1:-0.1),truck);c.visible=false;crates.push(c)}
const ROUTE=[[5,1.4],[5,4.3],[-34.5,4.3]];
const SEG=[];let ROUTE_LEN=0;
for(let i=0;i<ROUTE.length-1;i++){const dx=ROUTE[i+1][0]-ROUTE[i][0],dz=ROUTE[i+1][1]-ROUTE[i][1],l=Math.hypot(dx,dz);SEG.push({l,s0:ROUTE_LEN,dx,dz,a:ROUTE[i]});ROUTE_LEN+=l}
function placeTruck(s,back){
  s=Math.max(0,Math.min(ROUTE_LEN,s));let sg=SEG.find(q=>s<=q.s0+q.l)||SEG[SEG.length-1];
  const t=(s-sg.s0)/sg.l;truck.position.set(sg.a[0]+sg.dx*t,0,sg.a[1]+sg.dz*t);
  const dx=back?-sg.dx:sg.dx,dz=back?-sg.dz:sg.dz;truck.rotation.y=-Math.atan2(dz,dx);
}
placeTruck(0,false);

// ---- orbit camera
const cam={az:-0.5,el:0.78,dist:38,tx:4,tz:-1};
const CAM0={...cam};
function updateCam(){
  cam.el=Math.max(0.22,Math.min(1.4,cam.el));cam.dist=Math.max(9,Math.min(64,cam.dist));
  const ce=Math.cos(cam.el);
  camera.position.set(cam.tx+cam.dist*Math.sin(cam.az)*ce,cam.dist*Math.sin(cam.el),cam.tz+cam.dist*Math.cos(cam.az)*ce);
  camera.lookAt(cam.tx,0,cam.tz);

  const mine=NPL.filter(p=>p.owner===n.owner);
  let c=mine.filter(p=>p.k&&S.T-p.t>=growN(p.k));if(!c.length)c=mine.filter(p=>!p.k);if(!c.length)c=mine;
  const p=c[Math.floor(Math.random()*c.length)];n.plot=p;n.tx=p.x;n.tz=p.z+0.9;
}
function farmerAct(n){
  const p=n.plot;if(!p)return;
  if(!p.k){p.k=KEYS[Math.floor(Math.random()*KEYS.length)];p.t=S.T;const m=makeCrop(p.k);m.position.set(p.x,0.1,p.z);scene.add(m);p.mesh=m}
  else if(S.T-p.t>=growN(p.k)){scene.remove(p.mesh);p.mesh=null;p.k=null;NB[p.owner]+=2}
}
// neighbour vans drive to the market when crates pile up
const VANS=NEIGH.map((n,i)=>{const gx=n.house[0]+0.2,pz=n.south?6.3:3.1,path=makePath([[gx,pz],[gx,4.65],[-33.2,4.65],[-33.2,3.95],[gx,3.95],[gx,pz]]);
  const v={obj:van(n.van),path,s:0,go:false,sold:false,far:path.seg[0].l+path.seg[1].l,owner:i};path.at(v.obj,0);return v});
function worldUpdate(g,now){
  for(const n of NPCS){
    const dx=n.tx-n.g.position.x,dz=n.tz-n.g.position.z,d=Math.hypot(dx,dz);
    if(d>0.06){const st=Math.min(d,n.speed*g);n.g.position.x+=dx/d*st;n.g.position.z+=dz/d*st;n.g.position.y=g>0?Math.abs(Math.sin(now/130+n.ph))*0.04:0}
    else{n.g.position.y=0;
      if(n.kind==='farmer'&&n.plot&&!n.did){farmerAct(n);n.did=1;n.wait=1.5+Math.random()*2}
      n.wait-=g;
      if(n.wait<=0){n.did=0;
        if(n.kind==='farmer')farmerPick(n);
        else{const r=n.rect;n.tx=r.x0+Math.random()*(r.x1-r.x0);n.tz=r.z0+Math.random()*(r.z1-r.z0);n.wait=1+Math.random()*3}}}
  }
  for(const p of NPL)if(p.mesh)setGrowth(p.mesh,Math.max(0,Math.min(1,(S.T-p.t)/growN(p.k))));
  for(const v of VANS){
    if(!v.go){if(NB[v.owner]>=6){NB[v.owner]-=6;v.go=true;v.sold=false;v.s=0}continue}
    v.s+=1.7*g;if(!v.sold&&v.s>=v.far){v.sold=true;const k=KEYS[Math.floor(Math.random()*KEYS.length)];S.mult[k]=Math.max(0.55,S.mult[k]-0.03)}
    if(v.s>=v.path.L){v.go=false;v.s=0}v.path.at(v.obj,v.s);
  }
}
// ---- animals and extra villagers
const ANIM=[];
function addAnim(o){const g=o.make();g.position.set(o.x,0,o.z);const p=hitProxy(g,o.pr||0.4,o.ph||0.7);
  Object.assign(o,{g,kind:'animal',wait:Math.random()*3,tx:o.x,tz:o.z,ph:Math.random()*6});p.userData.npc=o;ANIM.push(o)}
const rr=(r)=>({x:r.x0+Math.random()*(r.x1-r.x0),z:r.z0+Math.random()*(r.z1-r.z0)});
const PAST={x0:-11.4,x1:-7.6,z0:-8.6,z1:-1.4},YARD={x0:6.4,x1:8.6,z0:1.8,z1:3.2},YARD2={x0:-14.2,x1:-13.2,z0:2.2,z1:3.2};
for(let i=0;i<3;i++){const p=rr(PAST);addAnim({name:'Cow',say:'Moo.',make:cowModel,rect:PAST,x:p.x,z:p.z,speed:0.25,pr:0.5,ph:0.8})}
for(let i=0;i<4;i++){const p=rr(PAST);addAnim({name:'Sheep',say:'Baa.',make:sheepModel,rect:PAST,x:p.x,z:p.z,speed:0.3,pr:0.4,ph:0.6})}
for(let i=0;i<5;i++){const p=rr(YARD);addAnim({name:'Hen',say:'Cluck.',make:chickenModel,rect:YARD,x:p.x,z:p.z,speed:0.45,hop:true,pr:0.3,ph:0.4})}
for(let i=0;i<3;i++){const p=rr(YARD2);addAnim({name:'Hen',say:'Cluck cluck.',make:chickenModel,rect:YARD2,x:p.x,z:p.z,speed:0.45,hop:true,pr:0.3,ph:0.4})}
addNPC({name:'Pete',kind:'villager',rect:{x0:6.2,x1:8.8,z0:1.9,z1:3.1},x:6.8,z:2.4,shirt:0x6a8f3f,pants:0x4a4a5a,hat:true,speed:0.5,lines:['I look after the barn yard. The hens are friendly enough.','Take the truck to the village once the barn is half full.']});
addNPC({name:'Rosa',kind:'villager',rect:{x0:-32.5,x1:-29.8,z0:1.2,z1:2.0},x:-31.5,z:1.6,shirt:0xe8d9b5,pants:0x6b4a33,speed:0.4,lines:['Fresh bread at the bakery. Flour comes from the windmill.','Wheat sells slowly but it never lets you down.']});
addNPC({name:'Abel',kind:'villager',rect:{x0:-37,x1:-32,z0:-8.2,z1:-6.4},x:-35,z:-7.4,shirt:0x7a5ea6,pants:0x3a3a4a,hat:true,speed:0.45,lines:['The windmill turns all day. We grind flour for the whole valley.']});
addNPC({name:'Ilan',kind:'villager',rect:{x0:-33.2,x1:-29.8,z0:-7.6,z1:-6.2},x:-32,z:-7,shirt:0x333333,pants:0x333333,speed:0.35,lines:['Evening bells at dusk. Mind the road after dark.']});
addNPC({name:'Mira',kind:'villager',rect:{x0:-37,x1:-31,z0:-5.4,z1:-2.2},x:-34.5,z:-3,shirt:0xc2503a,pants:0x3a3a4a,speed:0.5});
function animUpdate(g,now){
  for(const a of ANIM){
    const dx=a.tx-a.g.position.x,dz=a.tz-a.g.position.z,d=Math.hypot(dx,dz);
    if(d>0.05){const st=Math.min(d,a.speed*g);a.g.position.x+=dx/d*st;a.g.position.z+=dz/d*st;a.g.rotation.y=-Math.atan2(dz,dx);
      a.g.position.y=a.hop&&g>0?Math.abs(Math.sin(now/90+a.ph))*0.04:0}
    else{a.g.position.y=0;a.wait-=g;if(a.wait<=0){const p=rr(a.rect);a.tx=p.x;a.tz=p.z;a.wait=1+Math.random()*4}}
  }
  wind.rotation.z-=g*0.7;
}
// ---- UI
const cropbar=$('cropbar'),cropBtns={};
KEYS.forEach(k=>{
  const b=document.createElement('button');b.className='crop';
  b.innerHTML='<span><b>'+CROPS[k].name+'</b><br><small>seed $'+CROPS[k].seed+' · '+CROPS[k].grow+'s</small></span><span class="px"></span>';
  b.onclick=()=>{S.sel=k;ui()};cropbar.appendChild(b);cropBtns[k]=b;
});
const drawer=$('drawer'),upEls={};
UPS.forEach(u=>{
  const row=document.createElement('div');row.className='upg';
  row.innerHTML='<span><b>'+u.name+'</b><small></small></span>';
  const b=document.createElement('button');b.className='btn';b.onclick=()=>{buyUp(u.k);ui()};row.appendChild(b);drawer.appendChild(row);upEls[u.k]={small:row.querySelector('small'),b};
});
const nb=document.createElement('button');nb.className='btn';nb.textContent='New game';let nbArm=0;
nb.onclick=()=>{
  if(!nbArm){nbArm=1;nb.textContent='Tap again to erase this farm';setTimeout(()=>{nbArm=0;nb.textContent='New game'},3000);return}
  try{localStorage.removeItem(SAVEKEY)}catch(e){}
  setDrive(null);S=fresh();tr.st='idle';tr.load={};crates.forEach(c=>c.visible=false);placeTruck(0,false);
  S.plots.forEach((_,i)=>syncPlot(i));tr.away=false;Object.assign(VEH.farmer,{x:4.0,z:2.2,h:Math.PI/2,v:0});setDrive('farmer');nbArm=0;nb.textContent='New game';toast('A fresh start');ui();
};
drawer.appendChild(nb);
$('upbtn').onclick=()=>{drawer.hidden=!drawer.hidden;$('upbtn').textContent=drawer.hidden?'Upgrades':'Hide';syncPanel()};
$('snd').onclick=()=>SFX.toggle();SFX.paint();
$('harvestbtn').onclick=()=>{harvestAll();ui()};
$('truckbtn').onclick=()=>{sendTruck();ui()};
document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('on',x===b))});
function syncPanel(){app.style.setProperty('--panelh',$('panel').offsetHeight+'px')}
new ResizeObserver(syncPanel).observe($('panel'));

function ui(h){
  $('money').textContent=fmt(S.money);
  if(typeof ANIM!=='undefined')$('pop').textContent=(NPCS.length+1)+' residents · '+ANIM.length+' animals';
  if(h!==undefined)$('clock').textContent=clockText(h);
  const t=total(),cap=barnCap();
  $('stocktxt').textContent=t+'/'+cap;$('stockbar').style.width=(t/cap*100)+'%';
  $('chips').innerHTML=KEYS.filter(k=>S.stock[k]>0).map(k=>'<span class="chip">'+CROPS[k].name+' '+S.stock[k]+'</span>').join('')||'<span class="hint">Harvest ripe plots to fill the barn.</span>';
  KEYS.forEach(k=>{const b=cropBtns[k];b.classList.toggle('on',S.sel===k);
    const a=trend[k]>0?'<span class="up">▲</span>':trend[k]<0?'<span class="dn">▼</span>':'';
    b.querySelector('.px').innerHTML=a+' $'+price(k)});
  const tb=$('truckbtn');
  if(tr.st==='idle'){const n=Math.min(t,truckCap());if(tr.away){tb.textContent='Truck parked away';tb.disabled=true}else{tb.textContent=n?'Send truck ('+n+')':'Send truck';tb.disabled=!n}}
  else{tb.textContent=tr.st==='out'?'Truck on the road':tr.st==='wait'?'Selling at market':'Truck returning';tb.disabled=true}
  vehUI();
  $('hint').textContent=owned()<NPLOTS?'Next plot '+fmt(landCost()):'All land owned';
  UPS.forEach(u=>{const n=S.up[u.k],e=upEls[u.k];e.small.textContent=u.desc+' · level '+n+'/'+MAXUP;
    e.b.textContent=n>=MAXUP?'Maxed':fmt(u.cost(n));e.b.disabled=n>=MAXUP||S.money<u.cost(n)});
}

// ---- input: drag to rotate, pinch/wheel to zoom, tap to act
const ptrs=new Map();let tapInfo=null,pinch0=0;
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  tapInfo=ptrs.size===1?{x:e.clientX,y:e.clientY,t:performance.now(),moved:0}:null;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){cam.az-=dx*0.008;cam.el+=dy*0.006;if(tapInfo)tapInfo.moved+=Math.abs(dx)+Math.abs(dy)}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)cam.dist*=pinch0/d;pinch0=d}});
function endPtr(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);pinch0=0;
  if(had&&tapInfo&&e.type==='pointerup'&&tapInfo.moved<8&&performance.now()-tapInfo.t<500){
    const r=cv.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera);const hit=ray.intersectObjects(npcHit.concat(plotMeshes))[0];if(hit){if(hit.object.userData.npc){SFX.voice(hit.object.userData.npc);toast(npcLine(hit.object.userData.npc))}else{tapPlot(hit.object.userData.idx);ui()}}}
  tapInfo=null}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.dist*=Math.exp(e.deltaY*0.001)},{passive:false});
$('zin').onclick=()=>cam.dist*=0.85;$('zout').onclick=()=>cam.dist/=0.85;$('zreset').onclick=()=>Object.assign(cam,CAM0);

// ---- save
function save(){try{const o=JSON.parse(JSON.stringify(S));if(tr.st==='out')for(const k in tr.load)o.stock[k]+=tr.load[k];localStorage.setItem(SAVEKEY,JSON.stringify(o))}catch(e){}}
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
setInterval(save,4000);

// ---- loop
let last=performance.now(),uiAcc=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;const g=dt*speed;S.T+=g;
  nextDrift-=g;
  if(nextDrift<=0){nextDrift=8;KEYS.forEach(k=>{const before=S.mult[k];
    S.mult[k]=Math.max(0.55,Math.min(1.7,S.mult[k]+(1-S.mult[k])*0.1+(Math.random()-0.5)*0.14));
    trend[k]=Math.sign(Math.round((S.mult[k]-before)*100))})}
  if(tr.st==='out'){tr.s+=truckSpd()*g;if(tr.s>=ROUTE_LEN){tr.s=ROUTE_LEN;arrive()}placeTruck(tr.s,false)}
  else if(tr.st==='wait'){tr.wait-=g;if(tr.wait<=0)tr.st='back'}
  else if(tr.st==='back'){tr.s-=truckSpd()*g;if(tr.s<=0){tr.s=0;tr.st='idle'}placeTruck(tr.s,true)}
  driveUpdate(dt,now);worldUpdate(g,now);animUpdate(g,now);
  const fx=drive.kind?VEH[drive.kind].x:CAM0.tx,fz=drive.kind?VEH[drive.kind].z:CAM0.tz,fk=Math.min(1,dt*3);
  cam.tx+=(fx-cam.tx)*fk;cam.tz+=(fz-cam.tz)*fk;
  const pulse=0.5+0.5*Math.sin(now/260);
  S.plots.forEach((p,i)=>{const m=plotMeshes[i],c=cropMesh[i];
    if(c){const pr=progress(p);setGrowth(c,pr);
      if(pr>=1){c.rotation.y=Math.sin(now/500+i)*0.08;m.material.emissive.setRGB(0.1*pulse,0.14*pulse,0.02*pulse)}else{c.rotation.y=0;m.material.emissive.setRGB(0,0,0)}}
    else m.material.emissive.setRGB(0,0,0)});
  const h=applyTime();
  SFX.tick(dt,drive.kind,drive.kind?VEH[drive.kind].v:0,drive.kind?VEH[drive.kind].max:1,h);
  uiAcc+=dt;if(uiAcc>0.25){uiAcc=0;ui(h)}
  updateCam();renderer.render(scene,camera);requestAnimationFrame(frame);
}
ui(applyTime());syncPanel();setDrive('farmer');
if(S.T<5)setTimeout(()=>toast('Walk with the stick. Step on a plot to plant or harvest.'),600);
requestAnimationFrame(frame);
</script>
